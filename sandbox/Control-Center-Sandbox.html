/* ============================================================================
   Sofort speichern (Auftrag vom 19.09.2026)
   Es gibt kein „Speichern" mehr: jede Änderung landet im selben Augenblick im
   Speicher des Geräts. Die Angaben liegen in localStorage, der Inhalt
   hochgeladener Dateien in IndexedDB — der wäre für localStorage zu groß.
   Beides kann fehlen (privates Fenster, gesperrte Vorschau); dann arbeitet der
   Prototyp weiter und sagt es in der Sandbox-Leiste.
   ========================================================================== */
const STORE_KEY = "pcc.sandbox.v1";
const APP_VERSION = "1.8.1";
let DATA_REV = 0;        // zählt jede Änderung; steht in jedem Export
let SAVED_AT = null;     // wann zuletzt gespeichert wurde
let STORE_OK = true;     // ob das Gerät überhaupt speichert

/* Dateiinhalte. Ein Prototyp ohne echte Ablage wäre für die Frage „kann ich
   Dateien anhängen?" wertlos, deshalb landen sie in IndexedDB und überleben
   das Neuladen. */
const FILES = (() => {
  let db = null, broken = false;
  const open = () => new Promise((res, rej) => {
    if (broken || typeof indexedDB === "undefined") return rej(new Error("kein IndexedDB"));
    if (db) return res(db);
    let r;
    try { r = indexedDB.open("pcc-sandbox-files", 1); }
    catch (e) { broken = true; return rej(e); }
    r.onupgradeneeded = () => r.result.createObjectStore("files");
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => { broken = true; rej(r.error); };
  });
  const run = (mode, fn) => open().then(d => new Promise((res, rej) => {
    const q = fn(d.transaction("files", mode).objectStore("files"));
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  }));
  return {
    put: (id, blob) => run("readwrite", st => st.put(blob, id)).catch(() => null),
    get: id => run("readonly", st => st.get(id)).catch(() => null),
    del: id => run("readwrite", st => st.delete(id)).catch(() => null)
  };
})();

function storeSnapshot() {
  return { rev:DATA_REV, at:new Date().toISOString(), access:ACCESS, me,
           mxopen:MXOPEN, solo:SOLO_SEEN, version:APP_VERSION,
           projects:PROJECTS, log:PLOG,
           /* Nur die selbst angelegten Personen: die Demoliste steht im Code. */
           people:USERS.filter(u => u.added) };
}
function storeSave() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(storeSnapshot()));
    SAVED_AT = new Date(); STORE_OK = true;
  } catch (e) { STORE_OK = false; }
}
/* Kennungen werden fortlaufend vergeben. Nach einem Neuladen stünde der
   Zähler wieder auf dem Stand der Demodaten, während die gespeicherten Daten
   längst höhere Nummern tragen — die nächste Aufgabe bekäme eine Kennung, die
   es schon gibt. Verwerfen träfe dann zwei Einträge, ein Anhang hinge an der
   falschen Aufgabe. Also den Zähler nach jedem Laden über alles heben, was
   schon vergeben ist. */
function pSeqSync() {
  let max = pSeq;
  const gehe = o => {
    if (!o || typeof o !== "object") return;
    if (Array.isArray(o)) return o.forEach(gehe);
    Object.values(o).forEach(v => {
      if (typeof v === "string") { const m = /^p(\d+)$/.exec(v); if (m && +m[1] > max) max = +m[1]; }
      else gehe(v);
    });
  };
  gehe(PROJECTS);
  pSeq = max;
}

function storeLoad() {
  let raw = null;
  try { raw = localStorage.getItem(STORE_KEY); } catch (e) { STORE_OK = false; return false; }
  if (!raw) return false;
  try {
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.projects)) return false;
    PROJECTS.length = 0; d.projects.forEach(x => PROJECTS.push(x));
    PLOG.length = 0; d.log.forEach(x => PLOG.push(x));
    (d.people || []).forEach(u => { if (!USERS.some(x => x.id === u.id)) USERS.push(u); });
    ACCESS = d.access || null;
    me = d.me || null;
    if (typeof d.mxopen === "boolean") MXOPEN = d.mxopen;
    if (typeof d.solo === "boolean") SOLO_SEEN = d.solo;
    DATA_REV = d.rev || 0;
    SAVED_AT = d.at ? new Date(d.at) : null;
    pSeqSync();
    return true;
  } catch (e) { return false; }
}
function storeClear() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
}

/* Datensicherung: der ganze Stand als Datei, wahlweise mit den Anhängen. Für
   ein Werkzeug, das nur auf dem Gerät speichert, ist das der einzige Weg zu
   einem Backup, zu einem Gerätewechsel — und zur Weitergabe im Team. */
const BK_MAX = 25 * 1048576;
async function backupExport() {
  const snap = storeSnapshot();
  const docs = PROJECTS.flatMap(p => (p.docs || []).filter(d => d.kind === "file" && !d.deleted));
  const total = docs.reduce((a, d) => a + (d.bytes || 0), 0);
  const files = {};
  let withFiles = total <= BK_MAX;
  if (withFiles) {
    for (const d of docs) {
      const blob = await FILES.get(d.id);
      if (!blob) continue;
      files[d.id] = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });
    }
  }
  const out = Object.assign({ kind:"pcc-backup", app:APP_VERSION, exported:new Date().toISOString(),
    people:USERS.filter(u => u.added), files }, snap);
  docSave("control-center-" + today() + ".json", new Blob([JSON.stringify(out)], { type:"application/json" }));
  toast(withFiles ? t("t_backup") : t("bk_toolarge"), !withFiles);
}
function backupImport(file) {
  const r = new FileReader();
  r.onload = async () => {
    let d;
    try { d = JSON.parse(r.result); } catch (e) { return toast(t("e_bkbad"), true); }
    if (!d || d.kind !== "pcc-backup" || !Array.isArray(d.projects)) return toast(t("e_bkbad"), true);
    /* Ein richtiger Kopf reicht nicht: ein Projekt ohne Listen zerlegt sonst
       jede Ansicht, und der Stand auf dem Gerät wäre schon überschrieben. */
    const shaped = x => x && typeof x === "object" && typeof x.id === "string" && typeof x.key === "string"
      && ["tasks","risks","issues","ms","decisions","team","ws"].every(k => Array.isArray(x[k]));
    if (!d.projects.every(shaped)) return toast(t("e_bkbad"), true);
    PROJECTS.length = 0; d.projects.forEach(x => PROJECTS.push(x));
    PLOG.length = 0; (d.log || []).forEach(x => PLOG.push(x));
    (d.people || []).forEach(u => { if (!USERS.some(x => x.id === u.id)) USERS.push(u); });
    let n = 0;
    for (const id of Object.keys(d.files || {})) {
      try { const blob = await (await fetch(d.files[id])).blob(); await FILES.put(id, blob); n++; } catch (e) {}
    }
    pSeqSync();
    plg(null, me, { k:"ev_restored" });
    toast(t("t_restored", { p:PROJECTS.length, f:n }));
    commit(); render();
  };
  r.readAsText(file);
}
function pDialogRestore() {
  openDialog({
    title:t("bk_import"), text:t("bk_import_h"), okLabel:t("bk_import"),
    values:{ file:null },
    build: () => [{ name:"file", label:t("bk_t"), type:"file", accept:".json,application/json", req:true }],
    validate: v => !v.file ? [{ f:"file", m:t("e_bkfile") }] : [],
    onSubmit: v => backupImport(v.file)
  });
}

/* Der eine Weg, auf dem eine Änderung wirksam wird. Wer etwas ändert, ruft
   commit() — und damit ist es gespeichert, gezählt und in jeder offenen
   Ausgabe nachgezogen. */
function commit() {
  DATA_REV++;
  storeSave();
  if (document.getElementById("sandbar") && ACCESS) renderSandbar();
  refreshOpenExport();
}

/* ---------- Timeline ---------- */
function tlWindow(ps) {
  const ds = [];
  ps.forEach(p => { ds.push(p.start, p.end); p.ms.forEach(m => ds.push(m.date)); });
  ds.push(today());
  const from = new Date(ds.reduce((a,b) => a < b ? a : b));
  const to = new Date(ds.reduce((a,b) => a > b ? a : b));
  from.setDate(1);
  to.setMonth(to.getMonth() + 1, 1);
  const months = [];
  const d = new Date(from);
  while (d < to) { months.push(new Date(d)); d.setMonth(d.getMonth() + 1); }
  return { from, to, months };
}
const tlPct = (date, w) => Math.max(0, Math.min(100,
  (new Date(date) - w.from) / (w.to - w.from) * 100));
/* Die Zeichenerklärung steht dort, wo der Zeitstrahl für sich allein steht —
   im Projektverlauf. Auf dem Dashboard, wo er nur einer von acht Blöcken ist,
   bliebe sie Beiwerk. */
function tlLegend() {
  const it = (cls, key) => `<span><i class="${cls}"></i>${t(key)}</span>`;
  return `<div class="tlleg">
    ${it("ok", "h_green")}${it("warn", "h_amber")}${it("bad", "h_red")}${it("done", "tl_leg_done")}
    ${it("dot", "tl_leg_ms")}${it("dotdone", "tl_leg_msdone")}${it("dotlate", "tl_leg_late")}
    ${it("now", "tl_leg_now")}</div>`;
}
function timelineHTML(ps, clickable, legend) {
  if (!ps.length) return `<p class="muted">${t("p_none")}</p>`;
  const w = tlWindow(ps);
  const mName = d => d.toLocaleDateString(L === "de" ? "de-AT" : "en-GB", { month:"short" }).toUpperCase();
  const nowPct = tlPct(today(), w);
  return `<div class="tl"><div class="tlgrid">
    <div class="tlhead" style="position:relative">${w.months.map(m =>
      `<span>${mName(m)}${m.getMonth() === 0 ? " " + m.getFullYear() : ""}</span>`).join("")}
      <div class="tlnowhd" style="left:calc(var(--tlnm) + (100% - var(--tlnm)) * ${nowPct / 100})"><b>${t("tl_now")}</b></div></div>
    ${ps.map(p => {
      const a = tlPct(p.start, w), b = tlPct(p.end, w);
      const cls = p.status === "completed" ? "done" : healthCls(pHealth(p));
      return `<div class="tlrow"${clickable ? ` data-pp="${p.id}" style="cursor:pointer"` : ""}>
        <div class="nm"><div class="t">${esc(p.name)}</div>
          <div class="co">${esc(p.key)} · ${pUser(p.pm)}</div></div>
        <div class="tltrack">
          <div class="grid">${w.months.map(() => "<span></span>").join("")}</div>
          <div class="tlnow" style="left:${nowPct}%"></div>
          <div class="tlbar ${cls}" style="left:${a}%;width:${Math.max(1.2, b - a)}%"></div>
          ${p.ms.map(m => `<div class="ms" style="left:${tlPct(m.date, w)}%" title="${esc(m.name)}">
            <i class="${m.status === "completed" ? "done" : pMsOverdue(m) ? "late" : ""}"></i></div>`).join("")}
        </div></div>`;
    }).join("")}
  </div>${legend ? tlLegend() : ""}</div>`;
}

/* ============================================================================
   Gantt je Projekt (Auftrag vom 19.09.2026)
   Der Zeitstrahl auf dem Dashboard zeigt Projekte. Hier geht es eine Ebene
   tiefer: Teilprojekte als Klammer, darunter ihre Aufgaben und Teilaufgaben,
   dazu die Meilensteine des Teilprojekts. Die Farbe sagt den Zustand
   (erledigt, in Arbeit, überfällig, offen) — sie steht nie allein, jede Zeile
   trägt ihren Titel und der Balken seinen Fortschritt.
   ========================================================================== */
/* ---------- Abhängigkeiten: Widerspruch und kritischer Pfad ---------- */
/* Dieselbe Rechnung wie pcc.critical_path() in der Datenbank — rückwärts vom
   Projektende: Wie lange darf eine Aufgabe spätestens laufen, ohne ihre
   Nachfolger zu verschieben? Ohne Puffer liegt sie auf dem kritischen Pfad. */
const dayDiff = (a, b) => Math.round((new Date(a) - new Date(b)) / 864e5);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return iso(x); };

/* Der früheste Tag, an dem der Nachfolger nach dieser Verbindung beginnen darf. */
function linkEarliest(p, l) {
  const from = p.tasks.find(x => x.id === l.from);
  if (!from) return null;
  const base = l.kind === "ss" ? from.start : from.due;
  return base ? addDays(base, l.lag || 0) : null;
}
/* Wo widerspricht der Plan einer Verbindung? */
function linkConflict(p, l) {
  const to = p.tasks.find(x => x.id === l.to);
  const earliest = linkEarliest(p, l);
  if (!to || !to.start || !earliest) return 0;
  return Math.max(0, dayDiff(earliest, to.start));
}
const pConflicts = p => (p.links || []).map(l => ({ l, days:linkConflict(p, l) }))
  .filter(x => x.days > 0);

function pSchedule(p) {
  const span = x => (x.start && x.due) ? Math.max(0, dayDiff(x.due, x.start)) : 0;
  const byId = {};
  p.tasks.forEach(x => { if (x.due) byId[x.id] = x; });
  const links = (p.links || []).filter(l => byId[l.from] && byId[l.to]);
  const horizon = p.end || p.tasks.reduce((a, x) => (x.due && x.due > a) ? x.due : a, p.start);

  const lateFinish = {};
  const set = (id, v) => { if (!lateFinish[id] || v < lateFinish[id]) lateFinish[id] = v; };
  // Aufgaben ohne Nachfolger dürfen bis zum Projektende laufen.
  Object.keys(byId).forEach(id => {
    if (!links.some(l => l.from === id)) set(id, horizon);
  });
  /* Rückwärts durch das Netz. Die Schleife läuft so oft, wie das Netz tief
     sein kann — Kreise gibt es nicht, also endet sie. */
  for (let round = 0; round < p.tasks.length + 2; round++) {
    let changed = false;
    links.forEach(l => {
      const succ = byId[l.to], pred = byId[l.from];
      const lf = lateFinish[l.to];
      if (!lf) return;
      const lateStart = addDays(lf, -span(succ));
      const cand = l.kind === "ss"
        ? addDays(lateStart, -(l.lag || 0) + span(pred))
        : addDays(lateStart, -(l.lag || 0));
      if (!lateFinish[l.from] || cand < lateFinish[l.from]) { lateFinish[l.from] = cand; changed = true; }
    });
    if (!changed) break;
  }
  const out = {};
  Object.keys(byId).forEach(id => {
    if (!lateFinish[id]) return;
    const slack = dayDiff(lateFinish[id], byId[id].due);
    out[id] = { lateFinish:lateFinish[id], slack, critical:slack <= 0 };
  });
  return out;
}

function gWindow(p) {
  const ds = [today()];
  if (p.start) ds.push(p.start);
  if (p.end) ds.push(p.end);
  p.tasks.forEach(x => { if (x.start) ds.push(x.start); if (x.due) ds.push(x.due); });
  p.ms.forEach(m => ds.push(m.date));
  const from = new Date(ds.reduce((a,b) => a < b ? a : b));
  const to = new Date(ds.reduce((a,b) => a > b ? a : b));
  from.setDate(1);
  to.setMonth(to.getMonth() + 1, 1);
  const months = [];
  const d = new Date(from);
  while (d < to) { months.push(new Date(d)); d.setMonth(d.getMonth() + 1); }
  return { from, to, months };
}

/* Von wann bis wann läuft eine Menge von Aufgaben? Teilprojekte tragen keine
   eigenen Termine — sie ergeben sich aus dem, was darin zu tun ist. */
function gSpan(tasks) {
  const a = tasks.map(x => x.start).filter(Boolean);
  const b = tasks.map(x => x.due).filter(Boolean);
  if (!a.length && !b.length) return null;
  const from = a.length ? a.reduce((x,y) => x < y ? x : y) : b.reduce((x,y) => x < y ? x : y);
  const to   = b.length ? b.reduce((x,y) => x > y ? x : y) : from;
  return { from, to };
}

/* Der Zustand einer Aufgabe als Klasse — dieselben vier Farben wie überall. */
const gCls = x => pTaskOverdue(x) ? "bad"
  : x.status === "completed" ? "ok"
  : x.status === "cancelled" ? "off"
  : x.status === "blocked" ? "bad"
  : x.status === "in_progress" ? "warn" : "open";

function ganttHTML(p, forPrint) {
  const w = gWindow(p);
  const sched = pSchedule(p);
  const conflicts = pConflicts(p);
  const mName = d => d.toLocaleDateString(L === "de" ? "de-AT" : "en-GB", { month:"short" }).toUpperCase();
  const nowPct = tlPct(today(), w);
  const pct = d => tlPct(d, w);

  /* Ein Balken. Ohne Startdatum wird der Fälligkeitstag als Punkt gezeigt —
     eine erfundene Dauer wäre schlimmer als eine ehrliche Marke. */
  const bar = (x, cls, prog) => {
    if (!x.due && !x.start) return `<span class="gnone">${t("g_nodate")}</span>`;
    const a = pct(x.start || x.due), b = pct(x.due || x.start);
    const width = Math.max(1.4, b - a);
    const done = Math.max(0, Math.min(100, prog == null ? 0 : prog));
    /* Die Zahl steht im gefüllten Teil — dort trägt sie Weiß auf voller Farbe.
       Gezeigt wird sie nur, wenn der gefüllte Teil sie auch fasst: ein
       abgeschnittenes „3…" liest sich wie ein Fehler. */
    const room = width * done / 100 >= 3.2;
    const sc = sched[x.id];
    /* Auf dem kritischen Pfad bekommt der Balken einen kräftigen Rahmen — die
       Farbe bleibt der Zustandsfarbe vorbehalten, sonst hieße Rot zweierlei. */
    const crit = sc && sc.critical && !pTaskDone(x) ? " crit" : "";
    return `<div class="gbar ${cls}${crit}" data-gid="${x.id}" style="left:${a}%;width:${width}%"
      title="${esc(gTip(x) + (sc ? " · " + (sc.critical ? t("g_crit") : t("g_slack", { n:sc.slack })) : ""))}">${done > 0
        ? `<i style="width:${done}%">${room && done < 100 ? `<b>${done}%</b>` : ""}</i>` : ""}</div>`;
  };
  const gTip = x => [x.ref ? x.ref + " " + x.title : x.title,
    (x.start ? fmtLong(x.start) : "?") + " – " + (x.due ? fmtLong(x.due) : "?"),
    x.assignee ? pName(x.assignee) : null,
    x.status ? t("ts_" + x.status) : null].filter(Boolean).join(" · ");

  const track = inner => `<div class="gtrack">
      <div class="grid">${w.months.map(() => "<span></span>").join("")}</div>
      <div class="tlnow" style="left:${nowPct}%"></div>${inner}</div>`;

  const rows = [];
  const groups = p.ws.slice();
  /* Aufgaben ohne Teilprojekt bekommen eine eigene Gruppe, damit keine Zeile
     unter den Tisch fällt. */
  const loose = p.tasks.filter(x => !x.ws || !p.ws.some(g => g.id === x.ws));
  if (loose.length) groups.push({ id:null, name:t("g_nogroup"), owner:null });

  groups.forEach(g => {
    const all = p.tasks.filter(x => g.id ? x.ws === g.id : (!x.ws || !p.ws.some(y => y.id === x.ws)));
    const span = gSpan(all);
    const openN = all.filter(x => !pTaskDone(x)).length;
    rows.push(`<div class="grow group">
      <div class="gnm"><b>${esc(g.name)}</b>${g.id && !forPrint && pCanEdit(p)
        ? ` <button class="glnk" data-pwsedit="${g.id}" title="${esc(t("edit"))}">✎</button>` : ""}
        <span class="co">${all.length} ${t("pn_tasks")}${
          openN ? " · " + openN + " " + t("open").toLowerCase() : ""}${
          g.owner ? " · " + pUser(g.owner) : ""}</span></div>
      ${track(span ? `<div class="gbracket" style="left:${pct(span.from)}%;width:${
        Math.max(1.4, pct(span.to) - pct(span.from))}%"
        title="${esc(g.name + ": " + fmtLong(span.from) + " – " + fmtLong(span.to))}"></div>` : "")}
    </div>`);

    all.filter(x => !x.parent).forEach(x => {
      const kids = p.tasks.filter(k => k.parent === x.id);
      rows.push(`<div class="grow">
        <div class="gnm"><span class="gt" title="${esc(x.title)}">${esc(x.title)}</span>
          <span class="co">${x.ref}${x.assignee ? " · " + pUser(x.assignee) : ""}</span></div>
        ${track(bar(x, gCls(x), pTaskProgress(p, x)))}</div>`);
      kids.forEach(k => rows.push(`<div class="grow sub">
        <div class="gnm"><span class="gt" title="${esc(k.title)}">↳ ${esc(k.title)}</span>
          <span class="co">${k.ref}${k.assignee ? " · " + pUser(k.assignee) : ""}</span></div>
        ${track(bar(k, gCls(k), pTaskProgress(p, k)))}</div>`));
    });

    p.ms.filter(m => g.id ? m.ws === g.id : !m.ws).forEach(m => {
      const cls = m.status === "completed" ? "done" : pMsOverdue(m) ? "late" : "";
      rows.push(`<div class="grow ms">
        <div class="gnm"><span class="gt">◆ ${esc(m.name)}</span>
          <span class="co">${m.ref} · ${fmtDate(m.date)} · ${t("ms_" + m.status)}</span></div>
        ${track(`<div class="gms ${cls}" style="left:${pct(m.date)}%"
          title="${esc(m.ref + " " + m.name + " · " + fmtLong(m.date) + " · " + t("ms_" + m.status))}"></div>`)}
      </div>`);
    });
  });

  if (!rows.length) return `<p class="muted">${t("p_none")}</p>`;
  /* Ein Widerspruch ist eine Aussage über den Plan, keine Verzierung: er steht
     über dem Diagramm, nicht nur als Farbe darin. */
  const warn = conflicts.length ? `<div class="notice warn" style="margin-bottom:10px">
    <b>${t("g_conflict_t", { n:conflicts.length })}</b> ${conflicts.map(({l, days}) => {
      const a = p.tasks.find(x => x.id === l.from), b = p.tasks.find(x => x.id === l.to);
      return esc(`${b.ref} ${b.title} ${t("g_conflict_x", { n:days, r:a.ref })}`);
    }).join(" · ")}</div>` : "";
  return warn + `<div class="tl"><div class="ggrid${forPrint ? " forprint" : ""}" data-gantt="${p.id}">
    <div class="ghead">${w.months.map(m =>
      `<span>${mName(m)}${m.getMonth() === 0 ? " " + m.getFullYear() : ""}</span>`).join("")}
      <div class="tlnowhd" style="left:calc(var(--gnm) + (100% - var(--gnm)) * ${nowPct / 100})"><b>${t("tl_now")}</b></div></div>
    ${rows.join("")}
    <svg class="glinks" aria-hidden="true"></svg>
  </div>${gLegend()}</div>`;
}

/* Die Pfeile werden nach dem Einfügen gezeichnet: erst dann stehen die Balken
   an ihrem Platz, und nur gemessene Koordinaten treffen ihn auch nach einer
   Änderung am Stil. */
function drawGanttLinks() {
  document.querySelectorAll("[data-gantt]").forEach(grid => {
    const p = pById(grid.dataset.gantt);
    const svg = grid.querySelector(".glinks");
    if (!p || !svg) return;
    const box = grid.getBoundingClientRect();
    svg.setAttribute("viewBox", `0 0 ${grid.scrollWidth} ${grid.scrollHeight}`);
    svg.setAttribute("width", grid.scrollWidth);
    svg.setAttribute("height", grid.scrollHeight);
    const at = id => {
      const el = grid.querySelector(`[data-gid="${id}"]`);
      if (!el) return null;
      const r = el.getBoundingClientRect();
      return { x1:r.left - box.left, x2:r.right - box.left, y:r.top - box.top + r.height / 2 };
    };
    const paths = (p.links || []).map(l => {
      const a = at(l.from), b = at(l.to);
      if (!a || !b) return "";
      const bad = linkConflict(p, l) > 0;
      // Orthogonal: aus dem Vorgänger heraus, auf die Zeile des Nachfolgers,
      // von links in ihn hinein — so wie ein Gantt es seit jeher zeichnet.
      const sx = l.kind === "ss" ? a.x1 : a.x2;
      const out = sx + 9;
      const inx = b.x1 - 9;
      const d = out <= inx
        ? `M ${sx} ${a.y} H ${out} V ${b.y} H ${b.x1 - 4}`
        : `M ${sx} ${a.y} H ${out} V ${(a.y + b.y) / 2} H ${inx} V ${b.y} H ${b.x1 - 4}`;
      return `<path d="${d}" class="glink${bad ? " bad" : ""}" marker-end="url(#gArrow${bad ? "Bad" : ""})"/>`;
    }).join("");
    svg.innerHTML = `<defs>
      <marker id="gArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0 L8 4 L0 8 z" fill="var(--navy-600)"/></marker>
      <marker id="gArrowBad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0 0 L8 4 L0 8 z" fill="var(--late)"/></marker>
    </defs>${paths}`;
  });
}

function gLegend() {
  const it = (cls, key) => `<span><i class="${cls}"></i>${t(key)}</span>`;
  return `<div class="tlleg">
    ${it("gl ok", "ts_completed")}${it("gl warn", "ts_in_progress")}${it("gl bad", "g_leg_late")}
    ${it("gl open", "ts_not_started")}${it("gl bracket", "g_leg_group")}
    ${it("dot", "tl_leg_ms")}${it("crit", "g_crit")}${it("link", "g_leg_link")}
    ${it("now", "tl_leg_now")}</div>`;
}

/* ---------- Dashboard ---------- */
function pccDash() {
  const ps = pVisible();
  const active = ps.filter(p => !["completed","cancelled"].includes(p.status));
  const cnt = s => ps.filter(p => p.status === s).length;
  const risks = [];
  ps.forEach(p => pOpenRisks(p).forEach(r => risks.push({ p, r })));
  risks.sort((a,b) => rScore(b.r) - rScore(a.r));
  /* Eine Liste, die „kritisch" heißt und Unkritisches enthält, verliert ihre
     Warnwirkung. Kritisch heißt hier: Risikowert 15 oder mehr. */
  const critRisks = risks.filter(x => rScore(x.r) >= 15);
  const over = [];
  ps.forEach(p => pOverdueTasks(p).forEach(x => over.push({ p, x })));
  over.sort((a,b) => daysTo(a.x.due) - daysTo(b.x.due));
  const ms = [];
  ps.forEach(p => p.ms.filter(m => m.status !== "completed" && daysTo(m.date) >= -30)
    .forEach(m => ms.push({ p, m })));
  ms.sort((a,b) => a.m.date < b.m.date ? -1 : 1);
  const soon = ms.filter(x => daysTo(x.m.date) >= 0 && daysTo(x.m.date) <= 30).length;

  /* Die Kennzahlen zählen die gerechnete Gesamtlage, nicht den von Hand
     gesetzten Projektstatus. Sonst stünde oben „alles im Plan", während die
     Zeitstrahlen darunter rot sind — und die Leitung sähe die falsche Zahl
     zuerst. */
  const health = h => ps.filter(p => pHealth(p) === h).length;
  /* Auf dem Dashboard steht der Zeitstrahl als Überblick, nicht als Verzeichnis:
     acht Zeilen, die dringendsten zuerst. Alles Weitere zeigt der Projektverlauf. */
  const hRank = { red:0, amber:1, green:2 };
  const tlHead = active.slice().sort((a,b) =>
    hRank[pHealth(a)] - hRank[pHealth(b)] || (a.end < b.end ? -1 : 1)).slice(0, 8);
  const kpi = (n, lb, cls, title) => `<div class="pkpi ${cls || ""}"${
    title ? ` title="${esc(title)}"` : ""}><div class="n">${n}</div><div class="lb">${t(lb)}</div></div>`;
  const crit = risks.filter(x => rScore(x.r) >= 15).length;
  /* Die teuerste Fehlannahme wäre, dieser Prototyp könne schon gemeinsames
     Arbeiten. Er speichert auf dem Gerät, nicht in einer Datenbank — wer das
     nicht weiß, wundert sich im Team über verschwundene Einträge. Der Hinweis
     lässt sich wegklicken und bleibt weg. */
  const teamhint = SOLO_SEEN ? "" : `<div class="notice warn" id="solohint">
    <b>${t("solo_t")}</b> ${t("solo_s")}
    <button class="mxtoggle" id="solook">${t("solo_ok")}</button></div>`;
  return teamhint + `<div class="pkpis">
      ${kpi(ps.length, "k_total")}${kpi(active.length, "k_active")}
      ${kpi(health("green"), "k_hgreen", "ok", t("k_hgreen_h"))}
      ${kpi(health("amber"), "k_hamber", "warn", t("k_hamber_h"))}
      ${kpi(health("red"), "k_hred", "bad", t("k_hred_h"))}
      ${kpi(cnt("completed"), "k_done")}
      ${kpi(crit, "k_criks", crit ? "bad" : "", t("p_score_h"))}
      ${kpi(over.length, "k_otasks", over.length ? "bad" : "")}${kpi(soon, "k_ums")}
    </div>

    <div class="pcard"><header><h2>${t("c_mtl")}</h2>
      ${active.length > 8 ? `<span class="co">${t("tl_more", { n:active.length - 8, x:t("ptl_t") })}</span>` : ""}
      </header>
      <div class="inner">${timelineHTML(tlHead, true)}</div></div>

    <div class="pcard"><header><h2>${t("c_health")}</h2>
      <span class="co">${active.length} ${t("k_active").toLowerCase()}</span></header>
      <div class="tblwrap aslist"><table><thead><tr>
        <th>${t("col_project")}</th><th>${t("col_health")}</th><th>${t("col_status")}</th>
        <th>${t("col_progress")}</th>
        <th>${t("col_pm")}</th><th>${t("col_next")}</th><th>${t("col_risks")}</th>
      </tr></thead><tbody>${ps.map(p => {
        const n = pNextMs(p), cr = pCritRisks(p).length;
        return `<tr data-pp="${p.id}">
          <td><b>${esc(p.name)}</b><div class="num">${esc(p.key)}</div></td>
          <td>${healthPill(p)}</td>
          <td>${pStatusPill(p.status)}</td>
          <td style="min-width:130px">${pBar(pProgress(p), healthCls(pHealth(p)))}</td>
          <td class="co">${pUser(p.pm)}</td>
          <td class="co">${n ? esc(n.name) + `<div class="num">${fmtDate(n.date)}</div>` : t("none")}</td>
          <td>${pOpenRisks(p).length}${cr ? ` <span class="pill p-late">${cr} ${t("rl_crit_s")}</span>` : ""}</td>
        </tr>`; }).join("")}</tbody></table></div>
      <div class="cards" style="padding:12px">${ps.map(p => `<article class="card" data-pp="${p.id}">
        <div class="top"><span class="num">${esc(p.key)}</span>${healthPill(p)}</div>
        <h4>${esc(p.name)}</h4>
        <div class="sub"><span>${pUser(p.pm)}</span></div>
        <div style="margin-top:8px">${pBar(pProgress(p), healthCls(pHealth(p)))}</div>
      </article>`).join("")}</div>
    </div>

    <div class="grid2">
      <div class="pcard"><header><h2>${t("c_upcoming")}</h2></header>
        ${ms.length ? `<ul class="plist">${ms.slice(0,6).map(({p,m}) => `<li class="clickable" data-pp="${p.id}">
          <span class="when"><b>${new Date(m.date).getDate()}</b>${new Date(m.date)
            .toLocaleDateString(L === "de" ? "de-AT" : "en-GB", { month:"short" })}</span>
          <span class="m"><b>${esc(m.name)}</b>
            <span class="sub">${esc(p.key)} · ${pUser(m.owner)}</span></span>
          <span class="rt">${pill(pMsOverdue(m) ? "p-late" : "p-open", t("ms_" + m.status))}</span>
        </li>`).join("")}</ul>` : `<div class="inner muted">${t("p_none")}</div>`}
      </div>

      <div class="pcard"><header><h2>${t("c_crit")}</h2>
        <span class="co">${t("p_score_h")}</span></header>
        ${critRisks.length ? `<ul class="plist">${critRisks.slice(0,6).map(({p,r}) => `<li class="clickable" data-pp="${p.id}">
          <span class="when"><b>${rScore(r)}</b>${t("col_score")}</span>
          <span class="m"><b>${esc(r.title)}</b>
            <span class="sub">${esc(p.key)} · ${esc(r.cat)} · ${pUser(r.owner)}</span></span>
          <span class="rt">${pill("p-late", t("rl_crit"))}</span>
        </li>`).join("")}</ul>` : `<div class="inner muted">${t("c_crit_none")}</div>`}
      </div>

      <div class="pcard"><header><h2>${t("c_overdue")}</h2></header>
        ${over.length ? `<ul class="plist">${over.slice(0,6).map(({p,x}) => `<li class="clickable" data-pp="${p.id}">
          <span class="when"><b>${Math.abs(daysTo(x.due))}</b>${t("p_days")}</span>
          <span class="m"><b>${esc(x.title)}</b>
            <span class="sub">${esc(p.key)} · ${x.assignee ? pUser(x.assignee) : t("none")} · ${fmtDate(x.due)}</span></span>
          <span class="rt">${prioPill(x.prio)}</span>
        </li>`).join("")}</ul>` : `<div class="inner muted">${t("p_none")}</div>`}
      </div>

      <div class="pcard"><header><h2>${t("c_activity")}</h2></header>
        <ul class="plist">${PLOG.slice(0,7).map(e => {
          const p = pById(e.project);
          return `<li${p ? ` class="clickable" data-pp="${p.id}"` : ""}>
            <span class="when">${fmtDate(e.ts.slice(0,10))}</span>
            <span class="m"><b>${esc(evText(e.txt))}</b>
              <span class="sub">${pUser(e.who)}${p ? " · " + esc(p.key) : ""}</span></span>
          </li>`; }).join("")}</ul>
      </div>
    </div>`;
}

/* ---------- Listen über alle Projekte ---------- */
function pFilterBar(n, extra) {
  const pms = [...new Set(PROJECTS.map(p => p.pm))].map(user).sort(byName);
  return `<div class="filters">
    <input type="search" id="pq" placeholder="${t("p_search")}" value="${esc(PF.q)}" aria-label="${t("p_search")}">
    <select id="pstatus" aria-label="${t("p_allstatus")}"><option value="">${t("p_allstatus")}</option>${
      P_STATUS.map(s => `<option value="${s}" ${PF.status === s ? "selected" : ""}>${t("ps_" + s)}</option>`).join("")}</select>
    <select id="ppm" aria-label="${t("p_allpm")}"><option value="">${t("p_allpm")}</option>${
      pms.map(u => `<option value="${u.id}" ${PF.pm === u.id ? "selected" : ""}>${esc(u.name)}</option>`).join("")}</select>
    ${extra || ""}
    <button class="clear" id="pclear">${t("f_clear")}</button>
    <span class="fcount">${n} ${t("results")}</span></div>`;
}

/* Die Aufgabenliste ist der meistbegangene Weg der Projektleitung. Ohne Filter
   auf Zuständigkeit, Aufgabenstatus und Zeitraum beginnt sie mit Erledigtem
   vom Frühjahr. */
let TF = { who:"", state:"open", span:"" };
const TASK_STATES = ["not_started","in_progress","blocked","completed","cancelled"];
function tFilterBar(n) {
  const people = [...new Set(PROJECTS.flatMap(p => p.tasks.map(x => x.assignee)))]
    .filter(Boolean).map(user).sort(byName);
  return pFilterBar(n, `
    <select id="tfwho" aria-label="${t("tf_who")}"><option value="">${t("tf_who")}</option>${
      people.map(u => `<option value="${u.id}" ${TF.who === u.id ? "selected" : ""}>${esc(u.name)}</option>`).join("")}</select>
    <select id="tfstate" aria-label="${t("tf_state")}">
      <option value="open" ${TF.state === "open" ? "selected" : ""}>${t("tf_open")}</option>
      <option value="" ${TF.state === "" ? "selected" : ""}>${t("tf_all")}</option>${
      TASK_STATES.map(x => `<option value="${x}" ${TF.state === x ? "selected" : ""}>${t("ts_" + x)}</option>`).join("")}</select>
    <select id="tfspan" aria-label="${t("tf_span")}">
      <option value="">${t("tf_span")}</option>
      <option value="week" ${TF.span === "week" ? "selected" : ""}>${t("tf_week")}</option>
      <option value="14" ${TF.span === "14" ? "selected" : ""}>${t("tf_14")}</option>
      <option value="late" ${TF.span === "late" ? "selected" : ""}>${t("tf_late")}</option>
    </select>`);
}
function tMatches(x) {
  if (TF.who && x.assignee !== TF.who) return false;
  if (TF.state === "open") { if (pTaskDone(x)) return false; }
  else if (TF.state && x.status !== TF.state) return false;
  if (TF.span === "late" && !pTaskOverdue(x)) return false;
  if (TF.span === "week" || TF.span === "14") {
    if (!x.due) return false;
    const d = daysTo(x.due);
    if (d > (TF.span === "week" ? 7 : 14)) return false;
  }
  return true;
}
function pFiltered() {
  return (PF.archived ? PROJECTS : pVisible()).filter(p => {
    if (PF.status && p.status !== PF.status) return false;
    if (PF.pm && p.pm !== PF.pm) return false;
    if (PF.q) {
      const q = PF.q.toLowerCase();
      const hay = [p.name, p.key, p.description, ...p.tasks.map(x => x.title),
        ...p.risks.map(x => x.title), ...p.issues.map(x => x.title)].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function pccProjects() {
  const rows = pFiltered();
  const archToggle = PROJECTS.some(p => p.archived)
    ? `<label class="co" style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap">
        <input type="checkbox" id="parch" ${PF.archived ? "checked" : ""}> ${t("arch_show")}</label>` : "";
  if (!rows.length) return pFilterBar(0, archToggle) +
    `<div class="tblwrap"><div class="empty"><b>${t("p_noproj")}</b>${t("p_noproj_s")}</div></div>`;
  return pFilterBar(rows.length, archToggle) + `<div class="tblwrap aslist"><table><thead><tr>
      <th>${t("f_key")}</th><th>${t("col_project")}</th><th>${t("col_health")}</th>
      <th>${t("col_status")}</th>
      <th>${t("col_progress")}</th><th>${t("col_pm")}</th><th>${t("f_end")}</th>
      <th>${t("col_next")}</th><th>${t("col_risks")}</th>
    </tr></thead><tbody>${rows.map(p => {
      const n = pNextMs(p);
      return `<tr data-pp="${p.id}">
        <td class="num">${esc(p.key)}</td>
        <td><b>${esc(p.name)}</b></td>
        <td>${healthPill(p)}</td>
        <td>${pStatusPill(p.status)}</td>
        <td style="min-width:130px">${pBar(pProgress(p), healthCls(pHealth(p)))}</td>
        <td class="co">${pUser(p.pm)}</td>
        <td class="co">${fmtDate(p.end)}</td>
        <td class="co">${n ? esc(n.name) : t("none")}</td>
        <td>${pOpenRisks(p).length}</td></tr>`; }).join("")}</tbody></table></div>
    <div class="cards">${rows.map(p => `<article class="card" data-pp="${p.id}">
      <div class="top"><span class="num">${esc(p.key)}</span>${healthPill(p)}</div>
      <h4>${esc(p.name)}</h4>
      <div class="sub"><span>${pUser(p.pm)}</span><span>·</span><span>${fmtDate(p.end)}</span></div>
      <div style="margin-top:8px">${pBar(pProgress(p), healthCls(pHealth(p)))}</div>
      <div class="next">${pOpenRisks(p).length} ${t("col_risks")} · ${pOverdueTasks(p).length} ${t("c_overdue")}</div>
    </article>`).join("")}</div>`;
}
function pccTasks() {
  const rows = [];
  pFiltered().forEach(p => p.tasks.forEach(x => { if (tMatches(x)) rows.push({ p, x }); }));
  rows.sort((a,b) => (a.x.due || "9") < (b.x.due || "9") ? -1 : 1);
  if (!rows.length) return tFilterBar(0) + pEmpty("p_nohits", "p_nohits_s");
  return tFilterBar(rows.length) + `<div class="tblwrap aslist"><table><thead><tr>
      <th>${t("col_task")}</th><th>${t("col_project")}</th><th>${t("col_assignee")}</th>
      <th>${t("col_status")}</th><th>${t("col_prio")}</th><th>${t("col_due")}</th><th>${t("col_progress")}</th>
    </tr></thead><tbody>${rows.map(({p,x}) => `<tr data-pp="${p.id}">
      <td>${x.parent ? '<span class="co">↳ </span>' : ""}<b>${esc(x.title)}</b><div class="num">${x.ref}</div></td>
      <td class="num">${esc(p.key)}</td>
      <td class="co">${x.assignee ? pUser(x.assignee) : t("none")}</td>
      <td>${pill(x.status === "completed" ? "p-done" : x.status === "blocked" ? "p-late"
        : x.status === "in_progress" ? "p-work" : "p-open", t("ts_" + x.status))}</td>
      <td>${prioPill(x.prio)}</td>
      <td class="${pTaskOverdue(x) ? "" : "co"}" style="${pTaskOverdue(x) ? "color:var(--late);font-weight:600" : ""}">${fmtDate(x.due)}</td>
      <td style="min-width:110px">${pBar(pTaskProgress(p, x))}</td>
    </tr>`).join("")}</tbody></table></div>
    <div class="cards">${rows.map(({p,x}) => `<article class="card" data-pp="${p.id}">
      <div class="top"><span class="num">${x.ref} · ${esc(p.key)}</span>
        ${pill(x.status === "completed" ? "p-done" : x.status === "blocked" ? "p-late"
          : x.status === "in_progress" ? "p-work" : "p-open", t("ts_" + x.status))}${prioPill(x.prio)}</div>
      <h4>${esc(x.title)}</h4>
      <div class="sub"><span>${x.assignee ? pUser(x.assignee) : t("none")}</span><span>·</span>
        <span${pTaskOverdue(x) ? ' style="color:var(--late);font-weight:600"' : ""}>${fmtDate(x.due)}</span></div>
      <div style="margin-top:8px">${pBar(pTaskProgress(p, x))}</div>
    </article>`).join("")}</div>`;
}
/* Die Stufe eines Werts — dieselbe Einteilung wie die Farben der Matrix und
   die Abzeichen in den Listen. */
const rLevel = v => v >= 15 ? 4 : v >= 10 ? 3 : v >= 5 ? 2 : 1;
const rLevelCls = v => ["", "l", "m", "h", "x"][rLevel(v)];

/* Welche Zelle gerade ausgewählt ist — ein Klick filtert die Liste darunter. */
let MX = null;

function riskScale() {
  /* Eine Skala ohne Worte ist Auslegungssache: jede und jeder versteht unter
     einer 4 etwas anderes. Deshalb steht hier, was die Stufen bedeuten — und
     was aus einem Wert folgt. Ohne das ist eine Risikomatrix Dekoration. */
  const stufe = (n, von, bis) => `<tr>
    <td><span class="mxkey ${["", "l", "m", "h", "x"][n]}">${von}–${bis}</span></td>
    <td><b>${t("mx_lvl" + n)}</b></td>
    <td>${t("mx_act" + n)}</td></tr>`;
  return `<div class="mxexpl">
    <div class="mxcol">
      <h4>${t("mx_scale")}</h4>
      <div class="mxsub">${t("col_prob")} ↑</div>
      <ul>${[5,4,3,2,1].map(i => `<li>${t("mx_prob" + i)}</li>`).join("")}</ul>
      <div class="mxsub">${t("col_imp")} →</div>
      <ul>${[1,2,3,4,5].map(i => `<li>${t("mx_imp" + i)}</li>`).join("")}</ul>
    </div>
    <div class="mxcol">
      <h4>${t("mx_act")}</h4>
      <table class="mxlvl"><tbody>
        ${stufe(1, 1, 4)}${stufe(2, 5, 9)}${stufe(3, 10, 14)}${stufe(4, 15, 25)}
      </tbody></table>
      <p class="co" style="margin-top:10px">${t("mx_cells")}</p>
    </div>
  </div>`;
}

function riskMatrix(rows) {
  const cell = (pb, im) => {
    const v = pb * im, hit = rows.filter(({r}) => r.prob === pb && r.imp === im);
    const sel = MX && MX.pb === pb && MX.im === im;
    const label = hit.length
      ? t("mx_cell", { n:hit.length, v, l:t("mx_lvl" + rLevel(v)) })
      : `${t("mx_none")} · ${t("mx_val")} ${v}`;
    /* Jede Zelle ist ein Knopf: sie sagt, was sie bedeutet, und zeigt auf
       Klick genau die Risiken, die darin liegen. */
    return `<td class="${rLevelCls(v)}${sel ? " sel" : ""}">
      <button type="button" data-mx="${pb}|${im}" title="${esc(
        `${t("col_prob")} ${pb} × ${t("col_imp")} ${im} = ${v} · ${label}`)}"
        aria-label="${esc(label)}">${hit.length ? `<b>${hit.length}</b>` : ""}</button></td>`;
  };
  return `<div class="co mxhead">${t("p_score_h")}
      <button class="mxtoggle" id="mxtoggle">${MXOPEN ? t("mx_hide") : t("mx_show")}</button></div>
    ${MXOPEN ? riskScale() : ""}
    <div class="mxwrap">
      <div class="mxy">${t("mx_prob")}</div>
      <table class="rmx"><thead><tr><th></th>${[1,2,3,4,5].map(i => `<th>${i}</th>`).join("")}</tr></thead>
      <tbody>${[5,4,3,2,1].map(pb => `<tr><th>${pb}</th>${[1,2,3,4,5].map(im => cell(pb, im)).join("")}</tr>`).join("")}</tbody>
      </table>
    </div>
    <div class="mxx">${t("mx_imp")} →</div>
    ${MX ? `<div class="notice" style="margin:10px 0 0">
      <b>${t("col_prob")} ${MX.pb} × ${t("col_imp")} ${MX.im} = ${MX.pb * MX.im}</b>
      · ${t("mx_lvl" + rLevel(MX.pb * MX.im))} · ${t("mx_act" + rLevel(MX.pb * MX.im))}
      <button class="mxtoggle" id="mxclear">${t("mx_clear")}</button></div>` : ""}`;
}

function pccRisks() {
  const rows = [];
  pFiltered().forEach(p => p.risks.forEach(r => rows.push({ p, r })));
  rows.sort((a,b) => rScore(b.r) - rScore(a.r));
  if (!rows.length) return pFilterBar(0) + pEmpty("p_nohits", "p_nohits_s");
  /* Die Matrix zeigt immer alles; gefiltert wird nur die Liste darunter —
     sonst verschwände beim Klick auf ein Feld die Übersicht, in der man
     gerade steht. */
  const liste = MX ? rows.filter(({r}) => r.prob === MX.pb && r.imp === MX.im) : rows;
  const matrix = riskMatrix(rows);
  if (!liste.length) return pFilterBar(rows.length) +
    `<div class="pcard"><header><h2>${t("p_matrix")}</h2></header><div class="inner">${matrix}</div></div>` +
    pEmpty("p_nohits", "p_nohits_s");
  return pFilterBar(liste.length) +
    `<div class="pcard"><header><h2>${t("p_matrix")}</h2></header><div class="inner">${matrix}</div></div>` +
    `<div class="tblwrap aslist"><table><thead><tr>
      <th>${t("col_score")}</th><th>${t("col_title")}</th><th>${t("col_project")}</th><th>${t("col_cat")}</th>
      <th>${t("col_prob")}</th><th>${t("col_imp")}</th><th>${t("col_owner")}</th><th>${t("col_status")}</th><th>${t("col_due")}</th>
    </tr></thead><tbody>${liste.map(({p,r}) => `<tr data-pp="${p.id}">
      <td><span class="pill ${rScore(r) >= 15 ? "p-late" : rScore(r) >= 8 ? "p-work" : "p-open"}">${rScore(r)}</span></td>
      <td><b>${esc(r.title)}</b><div class="num">${r.ref}</div></td>
      <td class="num">${esc(p.key)}</td><td class="co">${esc(r.cat)}</td>
      <td class="co">${r.prob}</td><td class="co">${r.imp}</td>
      <td class="co">${pUser(r.owner)}</td>
      <td>${pill(r.status === "open" ? "p-late" : r.status === "monitoring" ? "p-work" : "p-done", t("rs_" + r.status))}</td>
      <td class="co">${fmtDate(r.due)}</td></tr>`).join("")}</tbody></table></div>
    <div class="cards">${liste.map(({p,r}) => `<article class="card" data-pp="${p.id}">
      <div class="top"><span class="pill ${rScore(r) >= 15 ? "p-late" : rScore(r) >= 8 ? "p-work" : "p-open"}">${t("col_score")} ${rScore(r)}</span>
        <span class="num">${r.ref} · ${esc(p.key)}</span>
        ${pill(r.status === "open" ? "p-late" : r.status === "monitoring" ? "p-work" : "p-done", t("rs_" + r.status))}</div>
      <h4>${esc(r.title)}</h4>

/* Erlaubt ist, was im Betrieb erlaubt ist (supabase/seed.sql, Einstellung
   „documents"): Bürodateien, PDF, Bilder, Text. 50 MB je Datei. */
const DOC_TYPES = [
  "application/pdf", "image/png", "image/jpeg", "text/plain", "text/csv",
  "application/msword", "application/vnd.ms-excel", "application/vnd.ms-powerpoint",
  "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  "application/vnd.openxmlformats-officedocument.presentationml.presentation"];
const DOC_EXT = ".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt,.png,.jpg,.jpeg";
const DOC_MAX = 52428800;
const docOk = f => DOC_TYPES.includes(f.type) || /\.(pdf|docx?|xlsx?|pptx?|csv|txt|png|jpe?g)$/i.test(f.name);

/* Die Dateiart als Kürzel: sie sagt mehr als ein Symbol und druckt sich auch
   dort sauber, wo die Schrift keine Sonderzeichen mitbringt. */
const docIcon = d => {
  if (d.kind === "link") return "URL";
  const m = /\.([a-z0-9]{1,5})$/i.exec(d.file || "");
  return m ? m[1].toUpperCase() : "DAT";
};
const shortName = d => (d.title || "").length > 18 ? d.title.slice(0,16) + "…" : d.title;

/* Anhänge eines Gegenstands — in aller Regel einer Aufgabe. */
const docsFor = (p, kind, id) =>
  (p.docs || []).filter(d => d.entity === kind && d.entityId === id && !d.deleted);

/* Herunterladen: der Inhalt liegt in IndexedDB, nicht im Dokumentsatz.
   In der eingebetteten Vorschau auf claude.ai zieht ein gewöhnlicher
   Download-Verweis nicht — dort geht die Datei über die Speichern-Funktion der
   Umgebung, die den Betrachter fragt. Überall sonst bleibt es beim Verweis. */
function docSave(name, blob) {
  const plain = () => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  };
  if (!(window.claude && typeof window.claude.use === "function")) return plain();
  window.claude.use("downloads").then(dl => {
    if (!dl) return plain();
    dl.save({ filename:name, data:blob }).catch(err => {
      if (err && err.code === "declined") return;      // Betrachter hat abgelehnt
      toast(t("doc_nodl"), true);
    });
  }).catch(plain);
}
function docOpen(d) {
  if (d.kind === "link") { try { window.open(d.url, "_blank", "noopener"); } catch (e) {} return; }
  FILES.get(d.id).then(blob => {
    if (!blob) return toast(t("doc_gone"), true);
    docSave(d.file || "datei", blob);
  });
}

const P_TSTATUS = ["not_started","in_progress","blocked","completed","cancelled"];
const P_RSTATUS = ["open","monitoring","mitigated","closed","accepted"];
const P_ISTATUS = ["open","in_progress","blocked","resolved","closed"];
const P_MSTATUS = ["planned","in_progress","completed","delayed"];
const teamOpts = p => p.team.map(m => ({ v:m.user, l:pName(m.user) }))

/* ---------- Aufgabe bearbeiten ---------- */
function pDialogEditTask(p, x) {
  const others = pTop(p).filter(y => y.id !== x.id && !pTaskDone(y) && y.parent !== x.id);
  openDialog({
    title:x.ref + " · " + x.title, text:"", okLabel:t("save"),
    values:{ title:x.title, ws:x.ws || "", assignee:x.assignee || "", prio:x.prio,
             status:x.status, progress:String(x.progress || 0), start:x.start || "", due:x.due || "",
             deps:(p.links || []).filter(l => l.to === x.id).map(l => l.from),
             description:x.description || "" },
    build: v => [
      { name:"title", label:t("col_title"), type:"text", req:true },
      { name:"ws", label:t("col_ws"), type:"select", half:true, options:wsOpts(p) },
      { name:"assignee", label:t("col_assignee"), type:"select", half:true,
        options:[{ v:"", l:t("none") }].concat(teamOpts(p)) },
      { name:"status", label:t("col_status"), type:"select", half:true, reactive:true,
        options:P_TSTATUS.map(st => ({ v:st, l:t("ts_" + st) })) },
      { name:"prio", label:t("col_prio"), type:"select", half:true,
        options:P_PRIO.map(pr => ({ v:pr, l:t("prio_" + pr) })) },
      /* Gesperrt, wo der Wert nicht von Hand kommt: bei abgeschlossenen
         Aufgaben und bei solchen, die ihre Teilaufgaben mitteln. */
      { name:"progress", label:t("col_progress") + " (%)", type:"number", half:true,
        disabled:v.status === "completed" || v.status === "cancelled" || pHasKids(p, x),
        hint:pHasKids(p, x) ? t("ed_prog_sub") : v.status === "completed" ? t("ed_prog_done") : "" },
      { name:"start", label:t("f_start"), type:"date", half:true },
      { name:"due", label:t("col_due"), type:"date", half:true },
      ...(x.parent ? [] : [{ name:"deps", label:t("g_dep"), type:"checks", hint:t("g_dep_h"),
        options:others.map(y => ({ v:y.id, l:y.ref + " " + y.title })) }]),
      { name:"description", label:t("f_desc"), type:"textarea" }
    ],
    validate: v => {
      const e = [];
      if ((v.title || "").trim().length < 3) e.push({ f:"title", m:t("e_pname") });
      if (v.start && v.due && v.due < v.start) e.push({ f:"due", m:t("e_dates") });
      const pr = +v.progress;
      if (v.progress !== "" && (isNaN(pr) || pr < 0 || pr > 100)) e.push({ f:"progress", m:t("e_prog") });
      // Ein Kreis darf auch über den Umweg „Bearbeiten" nicht entstehen.
      if ((v.deps || []).some(id => reaches(p, x.id, id))) e.push({ f:"deps", m:t("e_cycle") });
      return e;
    },
    onSubmit: v => {
      const before = { status:x.status, due:x.due, assignee:x.assignee };
      const done = v.status === "completed";
      Object.assign(x, { title:v.title.trim(), ws:v.ws || null, assignee:v.assignee || null,
        prio:v.prio, status:v.status, start:v.start || null, due:v.due || null,
        description:v.description,
        progress:done ? 100 : v.status === "cancelled" ? x.progress : Math.max(0, Math.min(100, +v.progress || 0)),
        done:done ? (x.done || today()) : null });
      if (!x.parent) {
        p.links = (p.links || []).filter(l => l.to !== x.id)
          .concat((v.deps || []).map(id => ({ from:id, to:x.id, kind:"fs", lag:0 })));
      }
      // Teilaufgaben folgen dem Teilprojekt ihres Elternteils.
      p.tasks.filter(k => k.parent === x.id).forEach(k => { k.ws = x.ws; });
      if (before.status !== x.status) plg(p, me, { k:"ev_tstatus", x:x.ref + " " + x.title + " → " + t("ts_" + x.status) });
      else plg(p, me, { k:"ev_tedit", x:x.ref + " " + x.title });
      if (before.assignee !== x.assignee && x.assignee) plg(p, me, { k:"ev_tassign", x:x.ref + " → " + pName(x.assignee) });
      toast(t("t_ptask")); commit(); render();
    }
  });
}
/* Führt von a ein Weg zu b? Für die Kreisprüfung beim Bearbeiten. */
function reaches(p, a, b) {
  const seen = new Set(); const stack = [a];
  while (stack.length) {
    const cur = stack.pop();
    if (cur === b) return true;
    if (seen.has(cur)) continue;
    seen.add(cur);
    (p.links || []).filter(l => l.from === cur).forEach(l => stack.push(l.to));
  }
  return false;
}

/* ---------- Verwerfen ---------- */
/* Verworfen wird mit Rückfrage und Eintrag im Verlauf. Eine Aufgabe nimmt
   ihre Teilaufgaben, Verbindungen und Anhänge mit; was an ihr hing, wäre
   sonst verwaist. */
function pDiscard(p, kind, obj) {
  const label = { task:obj.ref + " " + obj.title, risk:obj.ref + " " + obj.title,
                  issue:obj.ref + " " + obj.title, ms:obj.ref + " " + obj.name,
                  dec:obj.ref + " " + obj.topic, ws:obj.name }[kind];
  const extra = kind === "task" ? " " + t("disc_task_x", { n:p.tasks.filter(k => k.parent === obj.id).length })
              : kind === "ws" ? " " + t("disc_ws_x", { n:p.tasks.filter(x => x.ws === obj.id).length }) : "";
  confirmDialog(t("disc_t"), t("disc_q", { x:label }) + extra, t("disc_t"), () => {
    if (kind === "task") {
      const ids = [obj.id].concat(p.tasks.filter(k => k.parent === obj.id).map(k => k.id));
      p.tasks = p.tasks.filter(x => !ids.includes(x.id));
      p.links = (p.links || []).filter(l => !ids.includes(l.from) && !ids.includes(l.to));
      (p.docs || []).filter(d => d.entity === "task" && ids.includes(d.entityId)).forEach(d => { d.deleted = true; FILES.del(d.id); });
    }
    if (kind === "risk") p.risks = p.risks.filter(x => x !== obj);
    if (kind === "issue") p.issues = p.issues.filter(x => x !== obj);
    if (kind === "ms") p.ms = p.ms.filter(x => x !== obj);
    if (kind === "dec") p.decisions = p.decisions.filter(x => x !== obj);
    if (kind === "ws") { p.ws = p.ws.filter(x => x !== obj);
      p.tasks.filter(x => x.ws === obj.id).forEach(x => { x.ws = null; });
      p.ms.filter(m => m.ws === obj.id).forEach(m => { m.ws = null; }); }
    plg(p, me, { k:"ev_discard", x:label });
    toast(t("t_discarded", { x:label })); commit(); render();
  });
}

const PCC_NAV = [["dash","pn_dash"],["projects","pn_projects"],["timeline","pn_timeline"],

function pccNavItems() {
  const ps = pVisible();
  const over = ps.reduce((a,p) => a + pOverdueTasks(p).length, 0);
  const crit = ps.reduce((a,p) => a + pCritRisks(p).length, 0);
  /* Ein Abzeichen steht für etwas, das zu tun ist — nicht für einen Bestand.
     Deshalb kein Zähler an „Projekte". */
  const cnt = { dash:over, risks:crit,
    issues:ps.reduce((a,p) => a + p.issues.filter(i => ["open","blocked"].includes(i.status)).length, 0) };
  const hint = { dash:t("cnt_over"), risks:t("cnt_crit"), issues:t("cnt_issues") };
  return {
    work:PCC_NAV.slice(0,4).map(([k,lb]) => [k, lb, cnt[k] || 0, k === "dash", hint[k]]),
    org:PCC_NAV.slice(4).map(([k,lb]) => [k, lb, cnt[k] || 0, k === "risks", hint[k]])
  };
}

/* Beschreibt den wirksamen Filter in einem Satz. Ein Bericht, dem fünf von
   sechs Projekten fehlen, ohne dass es jemand sieht, führt zu falschen
   Entscheidungen außerhalb dieses Werkzeugs. */
function pFilterDesc() {

/* ---------- Suche über alles ---------- */
/* Dieselben Gegenstände wie pcc.search() in der Datenbank. Gesucht wird im
   Titel und in der Referenz; was der Zugang nicht sehen darf, kommt nicht
   zurück — im Prototyp sind das archivierte Projekte für den Lesezugang. */
function gSearch(q) {
  const s = (q || "").trim().toLowerCase();
  if (s.length < 2) return [];
  const hit = (kind, p, ref, label, context, id, tab) =>
    ({ kind, p, ref, label, context, id, tab,
       rank:(label || "").toLowerCase().indexOf(s) === 0 ? 0
          : (ref || "").toLowerCase() === s ? 0 : 1 });
  const has = (...v) => v.some(x => (x || "").toLowerCase().includes(s));
  const out = [];
  pVisible().forEach(p => {
    if (has(p.name, p.key)) out.push(hit("project", p, p.key, p.name, p.description, null, "overview"));
    p.ws.forEach(w => { if (has(w.name))
      out.push(hit("workstream", p, null, w.name, "", w.id, "timeline")); });
    p.tasks.forEach(x => { if (has(x.title, x.ref))
      out.push(hit("task", p, x.ref, x.title, x.description, x.id, "tasks")); });
    p.ms.forEach(m => { if (has(m.name, m.ref))
      out.push(hit("milestone", p, m.ref, m.name, fmtLong(m.date), m.id, "timeline")); });
    p.risks.forEach(r => { if (has(r.title, r.ref))
      out.push(hit("risk", p, r.ref, r.title, r.mitigation, r.id, "risks")); });
    p.issues.forEach(i => { if (has(i.title, i.ref))
      out.push(hit("issue", p, i.ref, i.title, i.description, i.id, "issues")); });
    p.decisions.forEach(d => { if (has(d.topic, d.decision, d.ref))
      out.push(hit("decision", p, d.ref, d.topic, d.decision, d.id, "decisions")); });
    (p.docs || []).filter(d => !d.deleted).forEach(d => { if (has(d.title))
      out.push(hit("document", p, null, d.title, d.description, d.id, "docs")); });
  });
  return out.sort((a,b) => a.rank - b.rank || a.label.localeCompare(b.label)).slice(0, 40);
}

const GS_LABEL = { project:"pn_projects", workstream:"g_groups", task:"pn_tasks", milestone:"pn_milestones",
  risk:"pn_risks", issue:"pn_issues", decision:"tab_dec", document:"tab_docs" };

function renderSearch(q) {
  const box = document.getElementById("ghits");
  if (!box) return;
  const hits = gSearch(q);
  if ((q || "").trim().length < 2) { box.hidden = true; box.innerHTML = ""; return; }

/* ---------- Kalender (ICS) ---------- */
/* Dieselben Regeln wie pcc.calendar(): offene Meilensteine und Fristen,
   ganztägig, Ende am Folgetag — sonst zeigt Outlook den letzten Tag nicht. */
function icsText(ps) {
  const pad = d => d.replace(/-/g, "");
  const esc2 = v => String(v || "").replace(/[\r\n]+/g, " ").replace(/\\/g, "\\\\").replace(/,/g, "\\,").replace(/;/g, "\\;");
  const next = d => addDays(d, 1).replace(/-/g, "");
  const ev = [];
  ps.forEach(p => {
    p.ms.filter(m => m.status !== "completed").forEach(m => ev.push({
      id:m.id, day:m.date, sum:`${p.key} · ${m.ref} ${m.name}`,
      note:`${t("pn_milestones")} · ${m.owner ? pName(m.owner) : t("none")} · ${t("ms_" + m.status)}` }));
    p.tasks.filter(x => x.due && !pTaskDone(x)).forEach(x => ev.push({
      id:x.id, day:x.due, sum:`${p.key} · ${x.ref} ${x.title}`,
      note:`${t("col_due")} · ${x.assignee ? pName(x.assignee) : t("none")} · ${t("ts_" + x.status)}` }));
  });
  ev.sort((a,b) => a.day < b.day ? -1 : 1);
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0,15) + "Z";
  return ["BEGIN:VCALENDAR", "VERSION:2.0",
    "PRODID:-//Aviation Academy Austria//Project Control Center//DE",
    "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:Project Control Center"]
    .concat(ev.flatMap(e => ["BEGIN:VEVENT", `UID:${e.id}@control-center`,
      `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${pad(e.day)}`, `DTEND;VALUE=DATE:${next(e.day)}`,
      `SUMMARY:${esc2(e.sum)}`, `DESCRIPTION:${esc2(e.note)}`, "END:VEVENT"]))
    .concat(["END:VCALENDAR"]).join("\r\n");
}
function downloadIcs(ps, name) {
  const blob = new Blob([icsText(ps)], { type:"text/calendar;charset=utf-8" });
  docSave(name, blob);
  toast(t("t_ics"));
}

/* ---------- Wochenbericht ---------- */
/* Rückblick und Ausblick in einem Blatt: was sich geändert hat, was ansteht
   und was liegen geblieben ist. Ein Bericht, der nur zurückschaut, beantwortet
   die Frage der Leitungsrunde nur halb. */
let REP_DAYS = 7;
function weeklyDef() {
  const since = addDays(today(), -REP_DAYS);
  const ps = pFiltered();
  const inRange = ts => ts && ts.slice(0,10) >= since;
  const log = PLOG.filter(e => inRange(e.ts) && (!e.project || ps.some(p => p.id === e.project)));
  const done = [], soon = [], late = [], crit = [];
  ps.forEach(p => {
    p.tasks.filter(x => x.done && inRange(x.done)).forEach(x => done.push({ p, x }));
    p.tasks.filter(x => pTaskOverdue(x)).forEach(x => late.push({ p, x }));
    p.tasks.filter(x => !pTaskDone(x) && x.due && daysTo(x.due) >= 0 && daysTo(x.due) <= 14)
      .forEach(x => soon.push({ p, x }));
    p.ms.filter(m => m.status !== "completed" && daysTo(m.date) >= 0 && daysTo(m.date) <= 14)
      .forEach(m => soon.push({ p, m }));
    pOpenRisks(p).filter(r => rScore(r) >= 15).forEach(r => crit.push({ p, r }));
  });
  soon.sort((a,b) => ((a.x || a.m).due || (a.x || a.m).date) < ((b.x || b.m).due || (b.x || b.m).date) ? -1 : 1);
  late.sort((a,b) => daysTo(a.x.due) - daysTo(b.x.due));
  crit.sort((a,b) => rScore(b.r) - rScore(a.r));
  return { title:t("rep_weekly"), meta:[[t("rep_period"), fmtLong(since) + " – " + fmtLong(today())],
      [t("exp_filter"), pFilterDesc()],
      [t("rep_changes"), log.length], [t("k_otasks"), late.length]],
    sections:[
      { h:t("rep_done"), cols:[t("f_ref"), t("col_task"), t("col_project"), t("col_assignee"), t("col_date")],
        rows:done.map(({p,x}) => [x.ref, x.title, p.key, x.assignee ? pName(x.assignee) : "", fmtLong(x.done)]) },
      { h:t("rep_next"), cols:[t("col_date"), t("col_title"), t("col_project"), t("col_owner"), t("col_status")],
        rows:soon.map(o => o.x
          ? [fmtLong(o.x.due), o.x.ref + " " + o.x.title, o.p.key,
             o.x.assignee ? pUser(o.x.assignee) : "", t("ts_" + o.x.status)]
          : [fmtLong(o.m.date), "◆ " + o.m.ref + " " + o.m.name, o.p.key,
             o.m.owner ? pUser(o.m.owner) : "", t("ms_" + o.m.status)]) },
      { h:t("c_overdue"), cols:[t("f_ref"), t("col_task"), t("col_project"), t("col_assignee"), t("col_due"), t("p_days")],
        rows:late.map(({p,x}) => [x.ref, x.title, p.key, x.assignee ? pName(x.assignee) : "",
          fmtLong(x.due), Math.abs(daysTo(x.due))]) },
      { h:t("c_crit"), cols:[t("f_ref"), t("col_title"), t("col_project"), t("col_score"), t("col_owner"), t("f_mit")],
        rows:crit.map(({p,r}) => [r.ref, r.title, p.key, rScore(r), pName(r.owner), r.mitigation || ""]) },
      { h:t("rep_changes"), cols:[t("exp_when"), t("exp_who"), t("col_project"), t("exp_what")],
        rows:log.slice(0,80).map(e => [fmtLong(e.ts.slice(0,10)), pName(e.who),
          (pById(e.project) || {}).key || "", evText(e.txt)]) }] };
}

function pccDoc(kind) {
  const ps = pFiltered();
  const cur = pProject ? pById(pProject) : null;
  const listMeta = () => [[t("exp_filter"), pFilterDesc()],
    [t("exp_count"), ps.length + " " + t("p_of") + " " + pVisible().length]];
  const projMeta = p => [[t("f_key"), p.key], [t("col_project"), p.name],
    [t("col_status"), t("ps_" + p.status)], [t("col_pm"), pUser(p.pm)],
    [t("col_progress"), pProgress(p) + "%"],
    [t("f_start"), fmtLong(p.start) + " – " + fmtLong(p.end)],
    [t("f_health"), t("h_" + pHealth(p))]];
  const taskRows = list => list.map(({p,x}) => [x.ref, x.title, p.key,
    (p.ws.find(w => w.id === x.ws) || {}).name || "", x.assignee ? pUser(x.assignee) : "",
    t("ts_" + x.status), x.prio, fmtLong(x.due), pTaskProgress(p, x) + "%",
    docsFor(p, "task", x.id).map(d => d.title).join("; ")]);
  const TASK_COLS = [t("f_ref"), t("col_task"), t("col_project"), t("col_ws"), t("col_assignee"),
    t("col_status"), t("col_prio"), t("col_due"), t("col_progress"), t("doc_att")];
  const riskRows = list => list.map(({p,r}) => [r.ref, r.title, p.key, r.cat, r.prob, r.imp,
    rScore(r), pUser(r.owner), t("rs_" + r.status), fmtLong(r.due), r.mitigation]);
  const RISK_COLS = [t("f_ref"), t("col_title"), t("col_project"), t("col_cat"), t("col_prob"),
    t("col_imp"), t("col_score"), t("col_owner"), t("col_status"), t("col_due"), t("f_mit")];

  if (kind === "pcc_dash") {
    const risks = [], over = [], ms = [];
    ps.forEach(p => { pOpenRisks(p).forEach(r => risks.push({ p, r }));
      pOverdueTasks(p).forEach(x => over.push({ p, x }));
      p.ms.filter(m => m.status !== "completed").forEach(m => ms.push({ p, m })); });
    risks.sort((a,b) => rScore(b.r) - rScore(a.r));
    const crit = risks.filter(x => rScore(x.r) >= 15);
    ms.sort((a,b) => a.m.date < b.m.date ? -1 : 1);
    return { title:t("exp_pcc_dash"),
      meta:listMeta().concat([[t("k_otasks"), over.length], [t("k_criks"), crit.length]]),
      sections:[
        { h:t("c_health"), cols:[t("f_key"), t("col_project"), t("col_status"), t("col_progress"),
          t("col_pm"), t("col_next"), t("col_risks")],
          rows:ps.map(p => { const n = pNextMs(p);
            return [p.key, p.name, t("ps_" + p.status), pProgress(p) + "%", pUser(p.pm),
              n ? n.name + " (" + fmtLong(n.date) + ")" : "—", pOpenRisks(p).length]; }) },
        { h:t("c_upcoming"), cols:[t("col_date"), t("pn_milestones"), t("col_project"), t("col_owner"), t("col_status")],
          rows:ms.slice(0,20).map(({p,m}) => [fmtLong(m.date), m.name, p.key, pName(m.owner), t("ms_" + m.status)]) },
        { h:t("c_crit"), cols:RISK_COLS, rows:riskRows(crit.slice(0,20)) },
        { h:t("c_overdue"), cols:TASK_COLS, rows:taskRows(over) },
        { h:t("c_activity"), cols:[t("exp_when"), t("exp_who"), t("col_project"), t("exp_what")],
          rows:PLOG.slice(0,25).map(e => [fmtLong(e.ts.slice(0,10)), pName(e.who),
            (pById(e.project) || {}).key || "", evText(e.txt)]) }] };
  }
  if (kind === "pcc_projects") return { title:t("pp_t"), meta:listMeta(),
    sections:[{ cols:[t("f_key"), t("col_project"), t("col_status"), t("col_progress"), t("col_pm"),
      t("f_start"), t("f_end"), t("col_risks"), t("c_overdue"), t("f_health")],
      rows:ps.map(p => [p.key, p.name, t("ps_" + p.status), pProgress(p) + "%", pName(p.pm),
        fmtLong(p.start), fmtLong(p.end), pOpenRisks(p).length, pOverdueTasks(p).length, t("h_" + pHealth(p))]) }] };
  if (kind === "pcc_tasks" || kind === "pcc_ptasks") {
    const src = kind === "pcc_ptasks" ? [cur] : ps;
    const rows = []; src.forEach(p => p.tasks.forEach(x => rows.push({ p, x })));
    return { title:t("pt_t") + (kind === "pcc_ptasks" ? " — " + cur.key : ""),
      meta:[[t("exp_count"), rows.length]], sections:[{ cols:TASK_COLS, rows:taskRows(rows) }] };
  }
  if (kind === "pcc_risks" || kind === "pcc_prisks") {
    const src = kind === "pcc_prisks" ? [cur] : ps;
    const rows = []; src.forEach(p => p.risks.forEach(r => rows.push({ p, r })));
    rows.sort((a,b) => rScore(b.r) - rScore(a.r));
    return { title:t("pr_t") + (kind === "pcc_prisks" ? " — " + cur.key : ""),
      meta:[[t("exp_count"), rows.length]], sections:[{ cols:RISK_COLS, rows:riskRows(rows) }] };
  }
  if (kind === "pcc_ms") {
    const rows = []; ps.forEach(p => p.ms.forEach(m => rows.push({ p, m })));
    rows.sort((a,b) => a.m.date < b.m.date ? -1 : 1);
    return { title:t("pm_t"), meta:[[t("exp_count"), rows.length]],
      sections:[{ cols:[t("col_date"), t("pn_milestones"), t("col_project"), t("col_owner"), t("col_status")],
        rows:rows.map(({p,m}) => [fmtLong(m.date), m.name, p.key, pName(m.owner), t("ms_" + m.status)]) }] };
  }
  if (kind === "pcc_weekly") return weeklyDef();
  if (kind === "pcc_pgantt") {
    /* Im Ausdruck steht das Gantt als Bild und als Tabelle: das Bild zeigt die
       Lage zueinander, die Tabelle lässt sich weiterverarbeiten. */
    const rows = [];
    const groups = cur.ws.concat(
      cur.tasks.some(x => !x.ws || !cur.ws.some(g => g.id === x.ws))
        ? [{ id:null, name:t("g_nogroup") }] : []);
    groups.forEach(g => {
      const all = cur.tasks.filter(x => g.id ? x.ws === g.id
                                            : (!x.ws || !cur.ws.some(y => y.id === x.ws)));
      const span = gSpan(all);
      rows.push([g.name, t("col_ws"), g.owner ? pName(g.owner) : "",
                 span ? fmtLong(span.from) : "—", span ? fmtLong(span.to) : "—", "", ""]);
      all.filter(x => !x.parent).forEach(x => {
        const add = (y, sub) => rows.push([(sub ? "↳ " : "") + y.title, y.ref,
          y.assignee ? pUser(y.assignee) : "", y.start ? fmtLong(y.start) : "—",
          y.due ? fmtLong(y.due) : "—", t("ts_" + y.status),
          (pTaskDone(y) ? 100 : y.progress || 0) + "%"]);
        add(x, false);
        cur.tasks.filter(k => k.parent === x.id).forEach(k => add(k, true));
      });
      cur.ms.filter(m => g.id ? m.ws === g.id : !m.ws).forEach(m =>
        rows.push(["◆ " + m.name, m.ref, m.owner ? pName(m.owner) : "",
                   "—", fmtLong(m.date), t("ms_" + m.status), ""]));
    });
    return { title:t("g_t") + " — " + cur.key, meta:projMeta(cur), gantt:ganttHTML(cur, true),
      sections:[{ cols:[t("col_title"), t("f_ref"), t("col_assignee"), t("f_start"),
        t("col_due"), t("col_status"), t("col_progress")], rows }] };
  }
  if (kind === "pcc_pdec") return { title:t("tab_dec") + " — " + cur.key, meta:projMeta(cur),
    sections:[{ cols:[t("f_ref"), t("col_date"), t("col_title"), t("tab_dec"), t("f_rat"),
      t("f_imp2"), t("f_maker"), t("f_part")],
      rows:cur.decisions.map(d => [d.ref, fmtLong(d.date), d.topic, d.decision, d.rationale,
        d.impact, pName(d.maker), d.participants.map(pName).join(", ")]) }] };
  if (kind === "pcc_pact") return { title:t("tab_act") + " — " + cur.key, meta:projMeta(cur),
    sections:[{ cols:[t("exp_when"), t("exp_who"), t("exp_what")],
      rows:pActivity(cur).map(e => [fmtLong(e.ts.slice(0,10)), pName(e.who), evText(e.txt)]) }] };
  if (kind === "pcc_report") {
    const p = pById(pRepProject) || cur;
    const tk = p.tasks.map(x => ({ p, x })), rk = p.risks.map(r => ({ p, r }));
    return { title:t("exp_pcc_proj") + " — " + p.name, meta:projMeta(p), sign:true,
      gantt:ganttHTML(p, true), sections:[
      { h:t("tab_over"), cols:[t("col_title"), t("f_desc")],
        rows:[[t("f_desc"), p.description], [t("f_obj"), p.objectives], [t("f_scope"), p.scope]] },
      { h:t("pn_milestones"), cols:[t("col_date"), t("col_title"), t("col_owner"), t("col_status")],
        rows:p.ms.map(m => [fmtLong(m.date), m.name, pName(m.owner), t("ms_" + m.status)]) },
      { h:t("pn_tasks"), cols:TASK_COLS, rows:taskRows(tk) },
      { h:t("pn_risks"), cols:RISK_COLS, rows:riskRows(rk) },
      { h:t("pn_issues"), cols:[t("f_key"), t("col_title"), t("col_owner"), t("col_prio"), t("col_status"), t("col_due")],
        rows:p.issues.map(i => [i.ref, i.title, pName(i.owner), i.prio, t("is_" + i.status), fmtLong(i.due)]) },
      { h:t("tab_dec"), cols:[t("col_date"), t("col_title"), t("tab_dec"), t("f_maker")],
        rows:p.decisions.map(d => [fmtLong(d.date), d.topic, d.decision, pName(d.maker)]) },
      { h:t("tab_team"), cols:[t("usr_name"), t("f_prole"), t("f_resp")],
        rows:p.team.map(m => [pName(m.user), m.role, m.resp]) },
      { h:t("tab_docs"), cols:[t("col_title"), t("doc_at"), t("col_status"), t("f_ver"),
          t("doc_size"), t("col_owner"), t("f_desc")],
        rows:p.docs.map(d => [d.title,
          !d.entity || d.entity === "project" ? t("tab_over")
            : ((p.tasks.find(x => x.id === d.entityId) || {}).ref || "") + " " +
              ((p.tasks.find(x => x.id === d.entityId) || {}).title || ""),
          d.kind === "file" ? t("doc_file") : t("doc_link"),
          d.version + (d.superseded ? " (" + t("doc_super") + ")" : ""), d.size || "—",
          pUser(d.owner), d.description]) },
      { h:t("tab_act"), cols:[t("exp_when"), t("exp_who"), t("exp_what")],
        rows:pActivity(p).slice(0,30).map(e => [fmtLong(e.ts.slice(0,10)), pName(e.who), evText(e.txt)]) },
      { h:t("ver_t"), cols:[t("f_ver"), t("col_date"), t("exp_who"), t("ver_sum")],
        rows:p.versions.map(v => [v.v, fmtLong(v.date), pName(v.by), evText(v.summary)]) }] };
  }
}

function render() {
  const inApp = !!(ACCESS && me);
  document.getElementById("login").classList.toggle("on", !inApp);
  document.getElementById("app").style.display = inApp ? "" : "none";
  renderSandbar();
  if (!inApp) { pProject = null; renderLogin(); return; }
  renderTop(); renderNav(); renderMain();
}
/* Gespeicherten Stand übernehmen, bevor zum ersten Mal gezeichnet wird. Liegt
   keiner vor, bleibt es bei den Demodaten. */
storeLoad();
render();
/* Ein zweites Fenster derselben Person schreibt in denselben Speicher. Ohne
   das hier überschrieben sich beide gegenseitig — die letzte Speicherung
   gewann, die andere Arbeit war weg. Jetzt übernimmt ein Fenster den Stand des
   anderen, sobald der gespeichert ist. */
window.addEventListener("storage", e => {
  if (e.key !== STORE_KEY || !e.newValue) return;
  if (dlg) return;   // mitten in einer Eingabe wird nichts unter der Hand ausgetauscht
  if (storeLoad()) { render(); toast(t("sb_synced")); }
});
</script>
