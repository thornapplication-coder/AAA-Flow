<meta charset="utf-8">
<title>Project Control Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ============================================================================
   Project Control Center — Sandbox
   Klickbarer Prototyp. Keine Persistenz, Daten im Speicher; ein Neuladen
   stellt den Ausgangszustand wieder her.
   Rollen, Rechte und Ableitungen gespiegelt aus supabase/migrations.
   Desktop ist Leitplattform, Tablet und Telefon sind reduziert.
   ========================================================================== */
:root{
  --navy-900:#0C1B2E; --navy-800:#12283F; --navy-700:#1B3A5A;
  --navy-600:#26507A; --navy-500:#3A6796; --navy-400:#5B84B1;
  --line:#DDE4EC; --line-strong:#C3CFDD;
  --paper:#F1F4F8; --surface:#FFFFFF; --surface-2:#FAFCFE;
  --ink:#132132; --ink-soft:#5A6B7F; --ink-faint:#8A9AAC;
  --open:#8FA3BC;
  --work:#B87514; --work-bg:#FDF3E2;
  --done:#26714F; --done-bg:#E6F2EC;
  --late:#A83A2A; --late-bg:#FBECE9;
  --exc:#5C4B8A;  --exc-bg:#EFEBF7;
  --focus:#4A90D9;
  --r:6px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Chrome ---------- */
.app{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:56px auto 1fr;height:100vh;max-width:100vw}
.topbar{grid-column:1/-1;background:var(--navy-900);display:flex;align-items:center;gap:14px;padding:0 16px;color:#fff}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:600;letter-spacing:-.01em;font-size:16px;white-space:nowrap}
.brand em{font-style:normal;color:var(--navy-400)}
.brand span{color:var(--navy-400);font-weight:400;font-size:12px;letter-spacing:.04em}
.topbar .spacer{flex:1}
.lang{display:flex;border:1px solid #24405F;border-radius:var(--r);overflow:hidden;flex:0 0 auto}
.lang button{padding:5px 11px;font-size:12px;font-weight:600;color:#9DB4CC}
.lang button.on{background:var(--navy-600);color:#fff}

.side{grid-column:1;grid-row:2/4;background:var(--navy-800);padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.side button{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--r);color:#A9C0D6;font-size:13.5px;text-align:left;width:100%}
.side button:hover{background:#1A3552}
.side button.on{background:var(--navy-600);color:#fff;font-weight:600}
.side .count{font-size:11px;background:rgba(255,255,255,.14);padding:1px 6px;border-radius:9px;font-variant-numeric:tabular-nums}
.side .count.alert{background:#7A3A2C;color:#FFD9D1}
.side .grp{color:#5B7794;font-size:11px;padding:14px 12px 5px;letter-spacing:.03em}
.side .who{margin-top:auto;padding:12px;border-top:1px solid #1E3A57;color:#7E9AB6;font-size:11.5px;line-height:1.45}
.side .who b{display:block;color:#C6D8E8;font-size:12.5px;font-weight:600}

.workspace{grid-column:2;grid-row:3;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.mobnav{grid-column:2;grid-row:2;display:none;gap:6px;padding:9px 12px;background:var(--navy-800);overflow-x:auto;min-width:0}
.mobnav button{color:#A9C0D6;font-size:13px;padding:6px 12px;border-radius:14px;white-space:nowrap;border:1px solid #24405F}
.mobnav button.on{background:var(--navy-600);color:#fff;font-weight:600;border-color:var(--navy-600)}
.mobnav .count{font-size:11px;margin-left:5px;font-variant-numeric:tabular-nums}
.mobnav .count.alert{color:#F0A192;font-weight:700}

.main{padding:22px 24px 96px;flex:1;min-width:0}
.hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap}
.hd h1{font-size:21px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.hd p{color:var(--ink-soft);font-size:13px;margin-top:3px;max-width:66ch}
.btn-primary{background:var(--navy-600);color:#fff;padding:8px 15px;border-radius:var(--r);font-size:13.5px;font-weight:600;white-space:nowrap}
.btn-primary:hover{background:var(--navy-700)}
.btn-ghost{border:1px solid var(--line-strong);background:#fff;color:var(--navy-600);padding:7px 13px;border-radius:var(--r);font-size:13px;font-weight:600}
.btn-ghost:hover{border-color:var(--navy-500);background:var(--surface-2)}

/* ---------- Filter ---------- */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 10px;min-width:230px;flex:1 1 230px;max-width:340px}
.filters select{border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 9px;background:#fff}
.filters .clear{color:var(--navy-600);font-size:13px;text-decoration:underline;padding:6px 2px}
.fcount{color:var(--ink-faint);font-size:12.5px;margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- Tabelle ---------- */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-soft);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #EDF1F6;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr[data-id]{cursor:pointer}
tbody tr[data-id]:hover{background:#F7FAFD}
.num{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap}
.tn{font-weight:600}
.co{color:var(--ink-soft);font-size:12.5px}
.pill{display:inline-block;padding:2px 8px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-open{background:#EEF2F7;color:#5A6B7F}
.p-work{background:var(--work-bg);color:var(--work)}
.p-done{background:var(--done-bg);color:var(--done)}
.p-late{background:var(--late-bg);color:var(--late)}
.empty{padding:44px 20px;text-align:center;color:var(--ink-soft)}
.empty b{display:block;color:var(--ink);margin-bottom:5px;font-size:15px}

/* ---------- Kartenliste (Handy) ---------- */
.cards{display:none;gap:10px;flex-direction:column}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 14px;cursor:pointer}
.card:active{background:#F7FAFD}
.card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h4{font-size:15px;font-weight:600;margin-top:5px}
.card .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .next{font-size:12.5px;color:var(--ink-soft);margin-top:7px;padding-top:7px;border-top:1px solid #F0F4F8}
.card .next b{color:var(--ink);font-weight:600}
.card .foot{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}

.notice{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--navy-600);border-radius:var(--r);padding:11px 13px;font-size:12.5px;color:var(--ink-soft);margin-bottom:16px}
.notice b{color:var(--ink)}
.notice.warn{border-left-color:var(--late);background:var(--late-bg);border-color:#F0D5CF;color:#7C3427}
.notice.warn b{color:#7C3427}


/* ---------- Dialog ---------- */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(12,27,46,.5);z-index:20;padding:16px}
.modal.on{display:flex}
.modal .card{background:var(--surface);border-radius:9px;width:min(560px,100%);max-height:92vh;overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(12,27,46,.3);cursor:default}
.modal h3{font-size:16px;font-weight:600;margin-bottom:6px}
.modal .lead{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{grid-column:1/-1}
.fld.half{grid-column:auto}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line-strong);border-radius:var(--r);padding:8px 10px;font-size:13.5px;background:#fff}
.fld textarea{min-height:84px;resize:vertical}
.fld .hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px}
.modal .err{color:var(--late);font-size:12px;margin-top:8px;min-height:16px}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.modal .btns button{padding:8px 15px;border-radius:var(--r);font-size:13px;font-weight:600;border:1px solid var(--line-strong)}
.modal .btns .go{background:var(--navy-600);color:#fff;border-color:var(--navy-600)}
.modal .btns .go:hover{background:var(--navy-700)}

/* ---------- Druck- und Exportdokument ---------- */
.hdacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#print{display:none;position:fixed;inset:0;z-index:60;background:#fff;overflow-y:auto}
#print.on{display:block}
.pbar{position:sticky;top:0;background:var(--navy-900);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;z-index:2}
.pbar .ttl{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.pbar button{border:1px solid #24405F;color:#C6D8E8;border-radius:var(--r);padding:6px 13px;font-size:13px;font-weight:600}
.pbar button.go{background:var(--navy-600);border-color:var(--navy-600);color:#fff}
.pdoc{max-width:900px;margin:0 auto;padding:28px 26px 60px;color:#111;font-size:11.5px}
.pdoc h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
.pdoc .brand{font-size:11px;letter-spacing:.14em;color:#5A6B7F;text-transform:uppercase;margin-bottom:3px}
.pdoc .sub{color:#5A6B7F;font-size:12px;margin-top:3px}
.pdoc .rule{height:2px;background:var(--navy-900);margin:12px 0 14px}
.pdoc h2{font-size:13px;font-weight:600;margin:20px 0 7px;padding-bottom:4px;border-bottom:1px solid #C3CFDD}
.pdoc table{width:100%;border-collapse:collapse;margin-bottom:6px}
.pdoc th{background:#EEF2F7;border:1px solid #C3CFDD;padding:5px 6px;font-size:10px;text-align:left;
  text-transform:uppercase;letter-spacing:.03em;color:#3A4A5E}
.pdoc td{border:1px solid #DDE4EC;padding:5px 6px;vertical-align:top}
.pdoc tr{break-inside:avoid}
.pdoc thead{display:table-header-group}
.pdoc .kv{width:100%;border-collapse:collapse;margin-bottom:6px}
.pdoc .kv td{border:none;padding:2px 0;vertical-align:top}
.pdoc .kv td:first-child{width:190px;color:#5A6B7F}
.pdoc .foot{margin-top:26px;padding-top:8px;border-top:1px solid #C3CFDD;color:#5A6B7F;font-size:10px}
.pdoc .sign{margin-top:26px;display:flex;gap:40px}
.pdoc .sign div{flex:1;border-top:1px solid #111;padding-top:4px;color:#5A6B7F;font-size:10px}
.pdoc .none{color:#5A6B7F;font-style:italic}
@media print{
  .app,.login,.sandbar,.modal,.toast{display:none!important}
  #print{display:block!important;position:static;overflow:visible}
  .pbar{display:none!important}
  .pdoc{max-width:none;padding:0}
@page{margin:14mm 12mm}
  body{background:#fff}
}

.ovlcard{background:var(--surface);border-radius:10px;width:min(620px,100%);margin:24px 0 96px;
  box-shadow:0 20px 60px rgba(12,27,46,.3);display:flex;flex-direction:column;max-height:calc(100vh - 140px)}

/* ---------- Anmeldung ---------- */
.login{position:fixed;inset:0;overflow-y:auto;display:none;
  background:linear-gradient(160deg,var(--navy-900) 0%,var(--navy-700) 100%);padding:32px 16px 110px}
.login.on{display:block}
.login .box{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.login .hello{text-align:center;color:#9DB4CC;font-size:13.5px}
.login h1{text-align:center;color:#fff;font-size:29px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.login h1 em{color:var(--navy-400);font-style:normal}
.login .claim{text-align:center;color:#9DB4CC;font-size:13.5px;margin-top:-8px}
.login .card{background:var(--surface);border-radius:10px;padding:18px}
.login label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
.login input{width:100%;border:1px solid var(--line-strong);border-radius:var(--r);padding:11px 12px;font-size:15px;background:#fff}
.login .go{width:100%;background:var(--navy-600);color:#fff;padding:12px;border-radius:var(--r);font-size:15px;font-weight:600;margin-top:12px}
.login .go:hover{background:var(--navy-700)}
.login .fine{color:#8FAAC6;font-size:12px;text-align:center;line-height:1.45}
.pick{background:rgba(255,255,255,.05);border:1px solid #24405F;border-radius:10px;overflow:hidden}
.pick h2{font-size:11px;letter-spacing:.09em;color:#E3B341;padding:13px 15px 9px;font-weight:600}
.pick .rows{max-height:min(44vh,400px);overflow-y:auto}
.pick button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 15px;text-align:left;border-top:1px solid #1E3A57}
.pick button:hover{background:rgba(255,255,255,.07)}
.pick .ini{width:36px;height:36px;flex:0 0 36px;border-radius:8px;background:var(--navy-600);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600}
.pick .ini.s{background:#6B4E9E}.pick .ini.t{background:#1F6E5A}.pick .ini.a{background:#B0641A}
.pick .nm{color:#fff;font-size:14.5px;font-weight:600}
.pick .rl{color:#8FAAC6;font-size:12px}

/* ---------- Sandbox-Leiste ---------- */
.sandbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#2A2410;border-top:1px solid #5A4A18;
  display:flex;align-items:center;gap:8px;padding:7px 12px;overflow-x:auto}
.sandbar .tag{display:flex;align-items:center;gap:7px;color:#E3B341;font-size:11.5px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.sandbar .clock{color:#CDBA7A;font-size:12px;font-family:var(--mono);white-space:nowrap}
.sandbar .clock b{color:#F0D48A;font-weight:600}
.sandbar .sp{flex:1;min-width:4px}
.sandbar button{border:1px solid #5A4A18;color:#E3B341;border-radius:5px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:transparent}
.sandbar button:hover{background:#3B3316}
.sandbar button.reset{color:#CDBA7A}
.topbar .userchip{display:flex;align-items:center;gap:9px;color:#C6D8E8;font-size:12.5px;white-space:nowrap;min-width:0}
.topbar .userchip b{color:#fff;font-weight:600}
.topbar .userchip .sw{border:1px solid #24405F;border-radius:var(--r);color:#9DB4CC;padding:5px 10px;font-size:12px}
.topbar .userchip .sw:hover{background:var(--navy-700);color:#fff}

/* ---------- Kennzahlen, Projektansicht ---------- */
.pkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:12px;margin-bottom:20px}
.pkpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.pkpi .n{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.pkpi .lb{font-size:12px;color:var(--ink-soft);margin-top:3px}
.pkpi.ok .n{color:var(--done)}
.pkpi.warn .n{color:var(--work)}
.pkpi.bad .n{color:var(--late)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.pcard>header{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.pcard>header h2{font-size:14px;font-weight:600;flex:1;min-width:0}
.pcard>header .co{font-size:12px}
.pcard .inner{padding:14px 15px}
.plist{list-style:none}
.plist li{display:flex;gap:12px;align-items:flex-start;padding:10px 15px;border-bottom:1px solid #F0F4F8}
.plist li:last-child{border-bottom:none}
.plist li.clickable{cursor:pointer}
.plist li.clickable:hover{background:#F7FAFD}
.plist .when{flex:0 0 54px;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);line-height:1.3}
.plist .when b{display:block;color:var(--ink);font-size:14px;font-weight:600}
.plist .m{flex:1;min-width:0}
.plist .m b{font-size:13.5px;font-weight:600;display:block}
.plist .m .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.plist .rt{flex:0 0 auto;text-align:right}

.bar{height:6px;background:#E6ECF3;border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--navy-600)}
.bar.ok i{background:var(--done)}
.bar.warn i{background:var(--work)}
.bar.bad i{background:var(--late)}
.pct{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.s-not_started{background:#EEF2F7;color:#5A6B7F}
.s-started{background:#E8F0FA;color:var(--navy-600)}
.s-on_track{background:var(--done-bg);color:var(--done)}
.s-at_risk{background:var(--work-bg);color:var(--work)}
.s-delayed{background:var(--late-bg);color:var(--late)}
.s-cancelled{background:#EEF2F7;color:var(--ink-faint)}
.s-completed{background:#E7EDF6;color:var(--navy-700)}

/* Timeline */
.tl{overflow-x:auto}
.tlgrid{min-width:640px}
.tlhead{display:flex;border-bottom:1px solid var(--line);padding-left:190px}
.tlhead span{flex:1;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;padding:6px 0 6px 6px;border-left:1px solid var(--line)}
.tlrow{display:flex;align-items:center;border-bottom:1px solid #F0F4F8;min-height:44px}
.tlrow:last-child{border-bottom:none}
.tlrow .nm{flex:0 0 190px;padding:8px 12px 8px 0;font-size:13px;font-weight:600;min-width:0}
.tlrow .nm .co{font-weight:400;font-size:11.5px}
.tlrow .tltrack{flex:1;position:relative;height:44px}
.tlrow .tltrack .grid{position:absolute;inset:0;display:flex}
.tlrow .tltrack .grid span{flex:1;border-left:1px solid #EDF1F6}
.tlrow .tltrack .tlbar{position:absolute;top:15px;height:12px;border-radius:6px;background:var(--navy-500)}
.tlrow .tltrack .tlbar.ok{background:var(--done)}
.tlrow .tltrack .tlbar.warn{background:var(--work)}
.tlrow .tltrack .tlbar.bad{background:var(--late)}
.tlrow .tltrack .tlbar.done{background:var(--navy-400)}
.tlrow .tltrack .ms{position:absolute;top:12px;width:0;height:0}
.tlrow .tltrack .ms i{position:absolute;left:-6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--navy-800);display:block}
.tlrow .tltrack .ms i.done{background:var(--done);border-color:var(--done)}
.tlrow .tltrack .ms i.late{background:var(--late);border-color:var(--late)}
.tlnow{position:absolute;top:0;bottom:0;width:1px;background:var(--late);opacity:.5}

/* Risk-Matrix */
.rmx{border-collapse:collapse}
.rmx td,.rmx th{border:1px solid var(--line);padding:0;text-align:center}
.rmx th{background:var(--surface-2);font-size:10.5px;color:var(--ink-soft);padding:4px 6px;font-weight:600}
.rmx td{width:44px;height:38px;font-size:12px;font-weight:600}
.rmx td.l{background:#E9F3ED;color:var(--done)}
.rmx td.m{background:#FBF0DC;color:var(--work)}
.rmx td.h{background:#F7DED7;color:var(--late)}
.rmx td.x{background:#EFC9C0;color:#7C2D20}
.rmx td b{display:inline-block;min-width:20px}

/* Projektkopf */
.phead{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.phead .top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.phead h1{font-size:20px;font-weight:600;letter-spacing:-.015em;flex:1;min-width:200px}
.phead .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.phead .facts div .k{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.phead .facts div .v{font-size:13.5px;font-weight:600;margin-top:2px}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.ptabs button{padding:9px 13px;font-size:13.5px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptabs button.on{color:var(--navy-700);border-bottom-color:var(--navy-600);font-weight:600}
.back{font-size:13px;color:var(--navy-600);text-decoration:underline;margin-bottom:10px;display:inline-block}

.kv2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.kv2 .k{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.kv2 .v{font-size:13.5px}
.tasktree .sub{padding-left:26px}
.tasktree .sub td:first-child{color:var(--ink-soft)}
.raci{font-family:var(--mono);font-size:11px;font-weight:700;display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;border-radius:4px}
.raci.R{background:#E8F0FA;color:var(--navy-600)}
.raci.A{background:var(--late-bg);color:var(--late)}
.raci.C{background:var(--work-bg);color:var(--work)}
.raci.I{background:#EEF2F7;color:var(--ink-soft)}
.prio-Critical{background:var(--late-bg);color:var(--late)}
.prio-High{background:var(--work-bg);color:var(--work)}
.prio-Medium{background:#E8F0FA;color:var(--navy-600)}
.prio-Low{background:#EEF2F7;color:#5A6B7F}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:70px;transform:translate(-50%,14px);background:var(--navy-900);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:30;max-width:min(560px,92vw);box-shadow:0 10px 30px rgba(12,27,46,.35)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:#7C2D20}

/* ---------- Tabellenaktionen und Formularfelder ---------- */
td.acts{white-space:nowrap}
td.acts button{font-size:11.5px;border:1px solid var(--line-strong);border-radius:4px;padding:3px 8px;color:var(--navy-600);background:#fff;margin-right:4px}
td.acts button:hover{border-color:var(--navy-500);background:var(--surface-2)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:7px 10px;
  border:1px solid var(--line-strong);border-radius:var(--r);padding:10px 11px;background:#fff}
.checks label{display:flex;align-items:flex-start;gap:7px;font-size:13px;font-weight:400;color:var(--ink);
  cursor:pointer;margin:0;line-height:1.3;min-width:0}
.checks label>span{min-width:0;overflow-wrap:anywhere;hyphens:auto}
/* Ohne feste Breite erbt das Kästchen width:100% aus .fld input und schiebt
   die Beschriftung aus dem Feld. */
.checks input[type=checkbox]{width:16px;height:16px;margin-top:1px;flex:0 0 auto;accent-color:var(--navy-600)}
.checks input:disabled{opacity:.4}
.checks input:disabled + *,.checks label:has(input:disabled){color:var(--ink-faint);cursor:not-allowed}
.fld input:disabled,.fld select:disabled,.fld textarea:disabled{background:#F1F4F8;color:var(--ink-faint);cursor:not-allowed}
.fld input:disabled::placeholder{color:var(--line-strong)}
.tgl{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line-strong);border-radius:var(--r);padding:9px 11px;background:#fff;cursor:pointer;min-width:0}
.tgl input{margin-top:2px;width:16px;height:16px;accent-color:var(--navy-600);flex:0 0 16px}
.tgl span{font-size:12.5px;color:var(--ink-soft);font-weight:400;min-width:0;overflow-wrap:anywhere}

/* ---------- Tablet ---------- */
@media(max-width:1100px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mobnav{display:flex;grid-column:1}
  .workspace{grid-column:1}
  .main{padding:16px 16px 96px}
}
/* ---------- Handy: Kartenliste statt Tabelle ---------- */
@media(max-width:760px){
  .topbar{gap:10px;padding:0 12px}
  .brand span{display:none}
  .main{padding:14px 12px 96px}
  .tblwrap.aslist{display:none}
  .cards{display:flex}
  .filters{padding:10px 12px}
  .filters input[type=search]{max-width:none;min-width:0}
  .fcount{margin-left:0}
  .fld.half{grid-column:1/-1}
  .sandbar{flex-wrap:wrap;gap:6px 8px;overflow-x:visible}
  .sandbar .sp{flex-basis:100%;min-width:100%;height:0}
  .sandbar .clock{font-size:11.5px}
}

/* Simulierte Uhr: die Sandbox-Leiste verschiebt "heute" nach vorn, damit
   Termine, Überfälligkeit und die Gesamtlage erlebbar werden. Die Demodaten
   entstehen einmal beim Laden relativ zum echten Datum. */
let CLOCK = 0;                       // Verschiebung in Kalendertagen
const iso = d => d.toISOString().slice(0,10);
const todayD = () => { const d = new Date(); d.setDate(d.getDate() + CLOCK); return d; };
const today = () => iso(todayD());
const D = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
function addBusinessDays(dateStr, days) {
  if (!dateStr) return null;
  const d = new Date(dateStr); const step = Math.sign(days); let left = Math.abs(days);
  while (left > 0) { d.setDate(d.getDate() + step); const w = d.getDay(); if (w !== 0 && w !== 6) left--; }
  return iso(d);
}
const daysTo = s => Math.round((new Date(s) - new Date(today())) / 864e5);
const fmtDate = s => s ? new Date(s).toLocaleDateString(L === "de" ? "de-AT" : "en-GB", { day:"2-digit", month:"short" }) : t("none");

}

let toastTimer = null;
function toast(text, bad) {
  const el = document.getElementById("toast");
  el.textContent = text; el.className = "toast on" + (bad ? " bad" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = "toast" + (bad ? " bad" : ""); }, 3600);
}

/* ---------- Dialog ----------
   build(values) liefert die Felder; Felder mit reactive:true zeichnen den
   Dialog beim Ändern neu, damit abhängige Felder erscheinen.               */
let dlg = null;
function openDialog(cfg) { dlg = { cfg, values: Object.assign({}, cfg.values) }; renderDialog(); }
function closeDialog() { document.getElementById("modal").classList.remove("on"); dlg = null; }
function renderDialog(err) {
  if (!dlg) return;
  const a = document.activeElement;
  const keep = a && a.dataset && a.dataset.f
    ? { name:a.dataset.f, pos:(a.selectionStart != null ? a.selectionStart : null) } : null;
  const card = document.querySelector("#modal .card");
  const cardTop = card ? card.scrollTop : 0;
  const { cfg, values } = dlg;
  const fields = cfg.build(values);
  document.getElementById("mTitle").textContent = cfg.title;
  document.getElementById("mText").textContent = cfg.text || "";
  document.getElementById("mErr").textContent = err || "";
  document.getElementById("mCancel").textContent = t("cancel");
  document.getElementById("mOk").textContent = cfg.okLabel || t("ok");
  document.getElementById("mBody").innerHTML = fields.map(f => {
    if (f.type === "note") return `<div class="fld"><div class="notice" style="margin:0">${esc(f.label)}</div></div>`;
    const v = values[f.name] == null ? "" : values[f.name];
    const inner =
      f.type === "toggle"
        ? `<label class="tgl"><input type="checkbox" data-f="${f.name}" ${v ? "checked" : ""} ${f.disabled ? "disabled" : ""}
             ${f.reactive ? 'data-reactive="1"' : ""}><span>${esc(f.text || "")}</span></label>`
      : f.type === "checks"
        ? `<div class="checks">${f.options.map(o => `<label><input type="checkbox" data-fm="${f.name}"
             value="${esc(o.v)}" ${(v || []).includes(o.v) ? "checked" : ""} ${f.disabled ? "disabled" : ""}><span>${esc(o.l)}</span></label>`).join("")}</div>`
      : f.type === "select"
        ? `<select data-f="${f.name}" ${f.disabled ? "disabled" : ""} ${f.reactive ? 'data-reactive="1"' : ""}>${
            f.options.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(v) ? "selected" : ""}>${esc(o.l)}</option>`).join("")}</select>`
      : f.type === "textarea"
        ? `<textarea data-f="${f.name}" placeholder="${esc(f.placeholder || "")}">${esc(v)}</textarea>`
        : `<input type="${f.type || "text"}" data-f="${f.name}" value="${esc(v)}"
             placeholder="${esc(f.placeholder || "")}" ${f.disabled ? "disabled" : ""}
             ${f.reactive ? 'data-reactive="1"' : ""} ${f.list ? `list="${f.list}"` : ""}>`;
    return `<div class="fld${f.half ? " half" : ""}">
      ${f.type === "toggle" ? `<label>${esc(f.label)}</label>` : `<label for="">${esc(f.label)}</label>`}${inner}
      ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}
      ${f.list ? `<datalist id="${f.list}">${(f.listOptions || []).map(o => `<option value="${esc(o)}"></option>`).join("")}</datalist>` : ""}
    </div>`;
  }).join("");
  document.getElementById("modal").classList.add("on");
  if (card && cardTop) card.scrollTop = cardTop;
  document.querySelectorAll("#mBody [data-f]").forEach(el => {
    const handler = e => {
      dlg.values[el.dataset.f] = el.type === "checkbox" ? el.checked : e.target.value;
      if (el.dataset.reactive) renderDialog();
    };
    el.oninput = handler; el.onchange = handler;
  });
  document.querySelectorAll("#mBody [data-fm]").forEach(el => el.onchange = () => {
    const n = el.dataset.fm;
    dlg.values[n] = Array.from(document.querySelectorAll(`#mBody [data-fm="${n}"]:checked`)).map(x => x.value);
  });
  /* Reaktive Felder zeichnen den Dialog neu — Fokus und Schreibmarke halten */
  if (keep && keep.name) {
    const el = document.querySelector(`#mBody [data-f="${keep.name}"]`);
    if (el) { el.focus(); if (keep.pos != null && el.setSelectionRange) { try { el.setSelectionRange(keep.pos, keep.pos); } catch (e) {} } }
  } else {
    const first = document.querySelector("#mBody [data-f]");
    if (first && !err) first.focus();
  }
}
document.getElementById("mOk").onclick = () => {
  if (!dlg) return;
  const e = dlg.cfg.validate ? dlg.cfg.validate(dlg.values) : null;
  if (e) return renderDialog(e);
  const { cfg, values } = dlg;
  closeDialog();
  cfg.onSubmit(values);
};

/* ============================================================================
   Export
   PDF entsteht über eine eigene Druckansicht: die Bildschirmoberfläche wird
   ausgeblendet und ein sauberes Dokument gedruckt. Excel gibt es überall dort,
   wo die Ansicht eine Liste ist.
   ========================================================================== */
const XLS_KINDS = ["pcc_dash","pcc_projects","pcc_risks","pcc_tasks","pcc_ms",
  "pcc_report","pcc_ptasks","pcc_prisks","pcc_pact"];
const fmtLong = d => d ? new Date(d).toLocaleDateString(L === "de" ? "de-AT" : "en-GB",

/* Jede Ansicht liefert dieselbe Struktur: Titel, Kopfangaben, Abschnitte mit
   Spalten und Zeilen. Daraus entsteht wahlweise die Druckansicht (PDF) oder
   eine Tabelle für die Zwischenablage (Excel). */
const docDef = kind => pccDoc(kind);

function renderPrint(def) {
  const tbl = sec => sec.rows.length
    ? `<table><thead><tr>${sec.cols.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
       <tbody>${sec.rows.map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table>`
    : `<p class="none">${t("exp_none")}</p>`;
  return `<div class="pdoc">
    <div class="brand">Aviation Academy Austria · Project Control Center</div>
    <h1>${esc(def.title)}</h1>
    ${def.subtitle ? `<div class="sub">${esc(def.subtitle)}</div>` : ""}
    <div class="rule"></div>
    ${def.meta && def.meta.length ? `<table class="kv">${def.meta.map(([k,v]) =>
      `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>` : ""}
    ${def.sections.map(sec => `${sec.h ? `<h2>${esc(sec.h)}</h2>` : ""}${tbl(sec)}`).join("")}
    ${def.sign ? `<div class="sign"><div>${t("exp_sign1")}</div><div>${t("exp_sign2")}</div></div>` : ""}
    <div class="foot">${t("exp_printed", { d:fmtLong(today()) + ", " +
      new Date().toLocaleTimeString(L === "de" ? "de-AT" : "en-GB", { hour:"2-digit", minute:"2-digit" }),
      n:M().name })} · ${t("exp_sandbox")}</div>
  </div>`;
}
function openPrint(kind) {
  const def = docDef(kind);
  const el = document.getElementById("print");
  el.innerHTML = `<div class="pbar">
      <span class="ttl">${esc(def.title)}</span>
      <button id="pPrint" class="go">${t("exp_print")}</button>
      <button id="pClose">${t("exp_close")}</button>
    </div>` + renderPrint(def);
  el.classList.add("on");
  document.getElementById("pClose").onclick = () => el.classList.remove("on");
  document.getElementById("pPrint").onclick = () => { try { window.print(); } catch (e) { toast(t("exp_manual"), true); } };
  try { window.print(); } catch (e) { /* Vorschau blockiert den Druckdialog — Ansicht bleibt sichtbar */ }
}
function exportTable(kind) {
  const def = docDef(kind);
  const lines = [];
  def.sections.forEach(sec => {
    if (sec.h) lines.push(sec.h);
    lines.push(sec.cols.join("\t"));
    sec.rows.forEach(r => lines.push(r.map(v => String(v == null ? "" : v).replace(/[\t\n]/g, " ")).join("\t")));
    lines.push("");
  });
  const tsv = lines.join("\n").trim();
  openDialog({
    title:t("exp_xls_t"), text:t("exp_xls_p"), okLabel:t("exp_copy"),
    values:{ data:tsv },
    build: () => [{ name:"data", label:def.title, type:"textarea" }],
    validate: () => null,
    onSubmit: v => {
      const done = () => toast(t("t_copied"));
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(v.data).then(done, () => toast(t("exp_manual"), true));
      else toast(t("exp_manual"), true);
    }
  });
}
const expBtns = kind =>
  `<button class="btn-ghost" data-exp="pdf|${kind}">${t("exp_pdf")}</button>` +
  (XLS_KINDS.includes(kind) ? `<button class="btn-ghost" data-exp="xls|${kind}">${t("exp_xls")}</button>` : "");
function wireExports() {
  document.querySelectorAll("[data-exp]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const [how, kind] = b.dataset.exp.split("|");
    how === "pdf" ? openPrint(kind) : exportTable(kind);
  });
}

/* ---------- Ableitungen ---------- */
const pTop = p => p.tasks.filter(x => !x.parent);
const pKids = (p, t) => p.tasks.filter(x => x.parent === t.id);
const pTaskDone = t => t.status === "completed" || t.status === "cancelled";
function pProgress(p) {
  const all = p.tasks.filter(t => t.status !== "cancelled");
  if (!all.length) return 0;
  return Math.round(all.reduce((a, t) => a + (pTaskDone(t) ? 100 : (t.progress || 0)), 0) / all.length);
}
const pTaskOverdue = t => !pTaskDone(t) && t.due && daysTo(t.due) < 0;
const pOverdueTasks = p => p.tasks.filter(pTaskOverdue);
const pOpenRisks = p => p.risks.filter(r => ["open","monitoring"].includes(r.status));
const rScore = r => r.prob * r.imp;
const pCritRisks = p => pOpenRisks(p).filter(r => rScore(r) >= 15);
const pMsOverdue = m => m.status !== "completed" && daysTo(m.date) < 0;
function pNextMs(p) {
  return p.ms.filter(m => m.status !== "completed").sort((a,b) => a.date < b.date ? -1 : 1)[0] || null;
}
/* Rot ist teuer: es bedeutet Handlungsbedarf auf Leitungsebene. Ein einzelnes
   kritisches Risiko in einem Projekt im Plan ist noch kein roter Status. */
function pHealth(p) {
  if (p.status === "completed" || p.status === "cancelled") return "green";
  if (p.status === "delayed" || p.ms.some(pMsOverdue) || pCritRisks(p).length >= 2) return "red";
  if (p.status === "at_risk" || pCritRisks(p).length || pOverdueTasks(p).length) return "amber";
  return "green";
}
const healthCls = h => h === "red" ? "bad" : h === "amber" ? "warn" : "ok";
/* Sichtbarkeit: Abschnitt 5 gibt auch dem Viewer Leserecht auf Projekte, nicht
   nur auf eigene. Gelesen wird alles Nichtarchivierte, geändert je nach Rolle.
   Soll die Sicht je Projekt einschränkbar sein, ist das eine Erweiterung —
   siehe PCC-ARCHITECTURE.md, offener Punkt. */
const pVisible = () => PROJECTS.filter(p => !p.archived);
const pById = id => PROJECTS.find(x => x.id === id);
const pill = (cls, txt) => `<span class="pill ${cls}">${esc(txt)}</span>`;
const pStatusPill = s => pill("s-" + s, t("ps_" + s));
const pBar = (v, cls) => `<div style="display:flex;align-items:center;gap:8px">
  <div class="bar ${cls || ""}" style="flex:1"><i style="width:${v}%"></i></div><span class="pct">${v}%</span></div>`;

/* ---------- Timeline ---------- */
function tlWindow(ps) {
  const ds = [];
  ps.forEach(p => { ds.push(p.start, p.end); p.ms.forEach(m => ds.push(m.date)); });
  ds.push(today());
  const from = new Date(ds.reduce((a,b) => a < b ? a : b));
  const to = new Date(ds.reduce((a,b) => a > b ? a : b));
  from.setDate(1);
  to.setMonth(to.getMonth() + 1, 1);
  const months = [];
  const d = new Date(from);
  while (d < to) { months.push(new Date(d)); d.setMonth(d.getMonth() + 1); }
  return { from, to, months };
}
const tlPct = (date, w) => Math.max(0, Math.min(100,
  (new Date(date) - w.from) / (w.to - w.from) * 100));
function timelineHTML(ps, clickable) {
  if (!ps.length) return `<p class="muted">${t("p_none")}</p>`;
  const w = tlWindow(ps);
  const mName = d => d.toLocaleDateString(L === "de" ? "de-AT" : "en-GB", { month:"short" }).toUpperCase();
  const nowPct = tlPct(today(), w);
  return `<div class="tl"><div class="tlgrid">
    <div class="tlhead">${w.months.map(m =>
      `<span>${mName(m)}${m.getMonth() === 0 ? " " + m.getFullYear() : ""}</span>`).join("")}</div>
    ${ps.map(p => {
      const a = tlPct(p.start, w), b = tlPct(p.end, w);
      const cls = p.status === "completed" ? "done" : healthCls(pHealth(p));
      return `<div class="tlrow"${clickable ? ` data-pp="${p.id}" style="cursor:pointer"` : ""}>
        <div class="nm">${esc(p.name.length > 34 ? p.name.slice(0,32) + "…" : p.name)}
          <div class="co">${esc(p.key)} · ${pUser(p.pm)}</div></div>
        <div class="tltrack">
          <div class="grid">${w.months.map(() => "<span></span>").join("")}</div>
          <div class="tlnow" style="left:${nowPct}%"></div>
          <div class="tlbar ${cls}" style="left:${a}%;width:${Math.max(1.2, b - a)}%"></div>
          ${p.ms.map(m => `<div class="ms" style="left:${tlPct(m.date, w)}%" title="${esc(m.name)}">
            <i class="${m.status === "completed" ? "done" : pMsOverdue(m) ? "late" : ""}"></i></div>`).join("")}
        </div></div>`;
    }).join("")}
  </div></div>`;
}

function pDialogNewProject() {
  if (!(pIsAdmin() || pRole() === "pm")) return toast(t("p_noedit"), true);
  openDialog({
    title:t("nc_p_t"), text:t("nc_p_p"), okLabel:t("create"),
    values:{ key:"", name:"", pm:me, description:"", objectives:"", scope:"",
             start:today(), end:addBusinessDays(today(), 60), status:"not_started" },
    build: () => [
      { name:"name", label:t("col_project"), type:"text", placeholder:"z. B. XLS Recurrent Redesign" },
      { name:"key", label:t("f_key"), type:"text", half:true, placeholder:"XLS-27" },
      { name:"pm", label:t("col_pm"), type:"select", half:true, options:
        USERS.filter(u => ["super_admin","admin","pm"].includes(u.pcc)).sort(byName).map(u => ({ v:u.id, l:u.name })) },
      { name:"description", label:t("f_desc"), type:"textarea" },
      { name:"objectives", label:t("f_obj"), type:"textarea" },
      { name:"scope", label:t("f_scope"), type:"textarea" },
      { name:"start", label:t("f_start"), type:"date", half:true },
      { name:"end", label:t("f_end"), type:"date", half:true },
      { name:"status", label:t("col_status"), type:"select", options:
        P_STATUS.map(s => ({ v:s, l:t("ps_" + s) })) }
    ],
    validate: v => (v.name || "").trim().length < 3 ? t("e_pname")
      : !(v.key || "").trim() ? t("e_pkey")
      : PROJECTS.some(p => p.key.toLowerCase() === v.key.trim().toLowerCase()) ? t("e_pkeydup")
      : (v.end && v.start && v.end < v.start) ? t("e_dates") : null,
    onSubmit: v => {
      const p = mkProject({ key:v.key.trim().toUpperCase(), name:v.name.trim(), pm:v.pm,
        description:v.description || "", objectives:v.objectives || "", scope:v.scope || "",
        status:v.status, start:v.start, end:v.end, health:"green" });
      p.team = [{ user:v.pm, role:"Project Manager", resp:"" }];
      pver(p, L === "de" ? "Projekt angelegt" : "Project created", []);
      plg(p, me, (L === "de" ? "Projekt angelegt — " : "Project created — ") + p.name);
      toast(t("t_pnew", { n:p.key }));
      pProject = p.id; pTab = "overview"; render();
    }
  });
}
function pDialogEditProject(p) {
  openDialog({
    title:p.name, text:t("nc_p_p"), okLabel:t("save"),
    values:{ name:p.name, pm:p.pm, status:p.status, description:p.description,
             objectives:p.objectives, scope:p.scope, start:p.start, end:p.end },
    build: () => [
      { name:"name", label:t("col_project"), type:"text" },
      { name:"status", label:t("col_status"), type:"select", half:true, options:
        P_STATUS.map(s => ({ v:s, l:t("ps_" + s) })) },
      { name:"pm", label:t("col_pm"), type:"select", half:true, disabled:!pIsAdmin(), options:
        USERS.filter(u => ["super_admin","admin","pm"].includes(u.pcc)).sort(byName).map(u => ({ v:u.id, l:u.name })) },
      { name:"description", label:t("f_desc"), type:"textarea" },
      { name:"objectives", label:t("f_obj"), type:"textarea" },
      { name:"scope", label:t("f_scope"), type:"textarea" },
      { name:"start", label:t("f_start"), type:"date", half:true },
      { name:"end", label:t("f_end"), type:"date", half:true }
    ],
    validate: v => (v.name || "").trim().length < 3 ? t("e_pname")
      : (v.end && v.start && v.end < v.start) ? t("e_dates") : null,
    onSubmit: v => {
      const ch = [];
      if (v.status !== p.status) ch.push({ e:p.name, f:t("col_status"), o:t("ps_" + p.status), n:t("ps_" + v.status) });
      if (v.end !== p.end) ch.push({ e:p.name, f:t("f_end"), o:fmtLong(p.end), n:fmtLong(v.end) });
      if (pIsAdmin()) p.pm = v.pm;
      Object.assign(p, { name:v.name.trim(), status:v.status, description:v.description,
        objectives:v.objectives, scope:v.scope, start:v.start, end:v.end });
      if (ch.length) {
        pver(p, L === "de" ? "Projekt geändert" : "Project updated", ch);
        ch.forEach(c => plg(p, me, `${c.f}: ${c.o} → ${c.n}`));
      }
      toast(ch.length ? t("t_pstatus") : t("t_psaved")); render();
    }
  });
}

function pDialogNewRisk(p) {
  openDialog({
    title:t("pn_risks"), text:t("p_score_h"), okLabel:t("create"),
    values:{ title:"", cat:"", prob:"3", imp:"3", owner:me, due:addBusinessDays(today(), 20),
             description:"", mitigation:"", conting:"" },
    build: () => [
      { name:"title", label:t("col_title"), type:"text" },
      { name:"cat", label:t("col_cat"), type:"text", half:true, placeholder:"Lieferant, Behörde, Personal …" },
      { name:"owner", label:t("col_owner"), type:"select", half:true, options:
        p.team.map(m => ({ v:m.user, l:user(m.user).name })) },
      { name:"prob", label:t("col_prob"), type:"select", half:true, options:[1,2,3,4,5].map(i => ({ v:String(i), l:String(i) })) },
      { name:"imp", label:t("col_imp"), type:"select", half:true, options:[1,2,3,4,5].map(i => ({ v:String(i), l:String(i) })) },
      { name:"due", label:t("col_due"), type:"date", half:true },
      { name:"description", label:t("f_desc"), type:"textarea" },
      { name:"mitigation", label:t("f_mit"), type:"textarea" },
      { name:"conting", label:t("f_cont"), type:"textarea" }
    ],
    validate: v => (v.title || "").trim().length < 3 ? t("e_pname") : null,
    onSubmit: v => {
      const r = { id:pid(), ref:"R-" + (p.risks.length + 1), title:v.title.trim(),
        description:v.description, cat:v.cat || "—", prob:+v.prob, imp:+v.imp, owner:v.owner,
        status:"open", due:v.due, mitigation:v.mitigation, conting:v.conting };
      p.risks.push(r);
      plg(p, me, (L === "de" ? "Risiko angelegt: " : "Risk created: ") + r.ref + " " + r.title);
      if (rScore(r) >= 15) pver(p, (L === "de" ? "Kritisches Risiko aufgenommen: " : "Critical risk added: ") + r.title,
        [{ e:r.ref, f:t("col_score"), o:"—", n:String(rScore(r)) }]);
      toast(t("t_psaved")); render();
    }
  });
}
function pDialogNewIssue(p) {
  openDialog({
    title:t("pn_issues"), text:"", okLabel:t("create"),
    values:{ title:"", owner:me, prio:"Medium", due:addBusinessDays(today(), 5), description:"" },
    build: () => [
      { name:"title", label:t("col_title"), type:"text" },
      { name:"owner", label:t("col_owner"), type:"select", half:true, options:
        p.team.map(m => ({ v:m.user, l:user(m.user).name })) },
      { name:"prio", label:t("col_prio"), type:"select", half:true, options:P_PRIO.map(x => ({ v:x, l:x })) },
      { name:"due", label:t("col_due"), type:"date", half:true },
      { name:"description", label:t("f_desc"), type:"textarea" }
    ],
    validate: v => (v.title || "").trim().length < 3 ? t("e_pname") : null,
    onSubmit: v => {
      p.issues.push({ id:pid(), ref:"I-" + (p.issues.length + 1), title:v.title.trim(),
        description:v.description, owner:v.owner, prio:v.prio, status:"open", due:v.due, resolution:"" });
      plg(p, me, (L === "de" ? "Issue gemeldet: " : "Issue raised: ") + v.title.trim());
      toast(t("t_psaved")); render();
    }
  });
}

/* ---------- Ansicht und Bedienung ---------- */
const PCC_NAV = [["dash","pn_dash"],["projects","pn_projects"],["timeline","pn_timeline"],
  ["tasks","pn_tasks"],["risks","pn_risks"],["issues","pn_issues"],["milestones","pn_milestones"],
  ["reports","pn_reports"]];

function pccNavItems() {
  const ps = pVisible();
  const over = ps.reduce((a,p) => a + pOverdueTasks(p).length, 0);
  const crit = ps.reduce((a,p) => a + pCritRisks(p).length, 0);
  const cnt = { dash:over, projects:ps.length, risks:crit,
    issues:ps.reduce((a,p) => a + p.issues.filter(i => ["open","blocked"].includes(i.status)).length, 0) };
  return {
    work:PCC_NAV.slice(0,4).map(([k,lb]) => [k, lb, cnt[k] || 0, k === "dash"]),
    org:PCC_NAV.slice(4).map(([k,lb]) => [k, lb, cnt[k] || 0, k === "risks"])
  };
}
function renderPcc(m) {
  const head = (title, sub, extra) => `<div class="hd"><div><h1>${t(title)}</h1><p>${t(sub)}</p></div>${
    extra ? `<div class="hdacts">${extra}</div>` : ""}</div>`;
  if (pProject) {
    const p = pById(pProject);
    if (!p) { pProject = null; return renderPcc(m); }
    m.innerHTML = pccDetail(p);
    wirePcc(); return;
  }
  const canNew = pIsAdmin() || pRole() === "pm";
  const newBtn = canNew ? `<button class="btn-primary" id="pnew">+ ${t("p_new")}</button>` : "";
  const V = {
    dash:    () => head("pd_t","pd_s", expBtns("pcc_dash") + newBtn) + pccDash(),
    projects:() => head("pp_t","pp_s", expBtns("pcc_projects") + newBtn) + pccProjects(),
    timeline:() => head("ptl_t","ptl_s") + `<div class="pcard"><div class="inner">${
      timelineHTML(pVisible().filter(p => p.status !== "cancelled"), true)}</div></div>`,
    tasks:   () => head("pt_t","pt_s", expBtns("pcc_tasks")) + pccTasks(),
    risks:   () => head("pr_t","pr_s", expBtns("pcc_risks")) + pccRisks(),
    issues:  () => head("pi_t","pi_s") + pccIssues(),
    milestones:() => head("pm_t","pm_s", expBtns("pcc_ms")) + pccMilestones(),
    reports: () => head("prep_t","prep_s") + pccReports()
  }[pv] || (() => head("pd_t","pd_s") + pccDash());
  m.innerHTML = V();
  wirePcc();
}
function wirePcc() {
  const q = id => document.getElementById(id);
  wireExports();
  if (q("pnew")) q("pnew").onclick = pDialogNewProject;
  if (q("pback")) q("pback").onclick = () => { pProject = null; pv = pv === "dash" ? "dash" : "projects"; render(); };
  if (q("pedit")) q("pedit").onclick = () => pDialogEditProject(pById(pProject));
  if (q("pnewtask")) q("pnewtask").onclick = () => pDialogNewTask(pById(pProject));
  if (q("pnewrisk")) q("pnewrisk").onclick = () => pDialogNewRisk(pById(pProject));
  if (q("pnewissue")) q("pnewissue").onclick = () => pDialogNewIssue(pById(pProject));
  if (q("pupload")) q("pupload").onclick = () => toast(t("doc_soon"), true);
  if (q("pq")) {
    q("pq").oninput = e => { PF.q = e.target.value; renderMain();
      const el = q("pq"); el.focus(); el.setSelectionRange(PF.q.length, PF.q.length); };
    q("pstatus").onchange = e => { PF.status = e.target.value; renderMain(); };
    q("ppm").onchange = e => { PF.pm = e.target.value; renderMain(); };
    q("pclear").onclick = () => { PF = { q:"", status:"", pm:"", health:"" }; renderMain(); };
  }
  document.querySelectorAll("[data-ptab]").forEach(b => b.onclick = () => { pTab = b.dataset.ptab; renderMain(); });
  document.querySelectorAll("[data-pp]").forEach(el => el.onclick = e => {
    if (e.target.closest("button") && !e.target.closest("[data-pp]").isSameNode(e.target.closest("button"))) return;
    pProject = el.dataset.pp; pTab = "overview"; render();
  });
  document.querySelectorAll("[data-ptdone]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const p = pById(pProject), x = p.tasks.find(y => y.id === b.dataset.ptdone);
    x.status = "completed"; x.progress = 100; x.done = today();
    plg(p, me, (L === "de" ? "Aufgabe erledigt: " : "Task completed: ") + x.title);
    toast(t("t_ptask")); render();
  });
  document.querySelectorAll("[data-prep]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const [how, id] = b.dataset.prep.split("|");
    pRepProject = id;
    how === "pdf" ? openPrint("pcc_report") : exportTable("pcc_report");
  });
}
let pRepProject = null;

/* ---------- Export ---------- */
function pccDoc(kind) {
  const ps = pFiltered();
  const cur = pProject ? pById(pProject) : null;
  const projMeta = p => [[t("f_key"), p.key], [t("col_project"), p.name],
    [t("col_status"), t("ps_" + p.status)], [t("col_pm"), pUser(p.pm)],
    [t("col_progress"), pProgress(p) + "%"],
    [t("f_start"), fmtLong(p.start) + " – " + fmtLong(p.end)],
    [t("f_health"), t("h_" + pHealth(p))]];
  const taskRows = list => list.map(({p,x}) => [x.ref, x.title, p.key,
    (p.ws.find(w => w.id === x.ws) || {}).name || "", x.assignee ? pUser(x.assignee) : "",
    t("ts_" + x.status), x.prio, fmtLong(x.due), (pTaskDone(x) ? 100 : x.progress || 0) + "%"]);
  const TASK_COLS = [t("f_key"), t("col_task"), t("col_project"), t("col_ws"), t("col_assignee"),
    t("col_status"), t("col_prio"), t("col_due"), t("col_progress")];
  const riskRows = list => list.map(({p,r}) => [r.ref, r.title, p.key, r.cat, r.prob, r.imp,
    rScore(r), pUser(r.owner), t("rs_" + r.status), fmtLong(r.due), r.mitigation]);
  const RISK_COLS = [t("f_key"), t("col_title"), t("col_project"), t("col_cat"), t("col_prob"),
    t("col_imp"), t("col_score"), t("col_owner"), t("col_status"), t("col_due"), t("f_mit")];

  if (kind === "pcc_dash") {
    const risks = [], over = [], ms = [];
    ps.forEach(p => { pOpenRisks(p).forEach(r => risks.push({ p, r }));
      pOverdueTasks(p).forEach(x => over.push({ p, x }));
      p.ms.filter(m => m.status !== "completed").forEach(m => ms.push({ p, m })); });
    risks.sort((a,b) => rScore(b.r) - rScore(a.r));
    ms.sort((a,b) => a.m.date < b.m.date ? -1 : 1);
    return { title:t("exp_pcc_dash"),
      meta:[[t("exp_count"), ps.length], [t("k_otasks"), over.length], [t("k_oriks"), risks.length]],
      sections:[
        { h:t("c_health"), cols:[t("f_key"), t("col_project"), t("col_status"), t("col_progress"),
          t("col_pm"), t("col_next"), t("col_risks")],
          rows:ps.map(p => { const n = pNextMs(p);
            return [p.key, p.name, t("ps_" + p.status), pProgress(p) + "%", pUser(p.pm),
              n ? n.name + " (" + fmtLong(n.date) + ")" : "—", pOpenRisks(p).length]; }) },
        { h:t("c_upcoming"), cols:[t("col_date"), t("pn_milestones"), t("col_project"), t("col_owner"), t("col_status")],
          rows:ms.slice(0,20).map(({p,m}) => [fmtLong(m.date), m.name, p.key, pUser(m.owner), t("ms_" + m.status)]) },
        { h:t("c_crit"), cols:RISK_COLS, rows:riskRows(risks.slice(0,20)) },
        { h:t("c_overdue"), cols:TASK_COLS, rows:taskRows(over) },
        { h:t("c_activity"), cols:[t("exp_when"), t("exp_who"), t("col_project"), t("exp_what")],
          rows:PLOG.slice(0,25).map(e => [fmtLong(e.ts.slice(0,10)), pUser(e.who),
            (pById(e.project) || {}).key || "", e.txt]) }] };
  }
  if (kind === "pcc_projects") return { title:t("pp_t"), meta:[[t("exp_count"), ps.length]],
    sections:[{ cols:[t("f_key"), t("col_project"), t("col_status"), t("col_progress"), t("col_pm"),
      t("f_start"), t("f_end"), t("col_risks"), t("c_overdue"), t("f_health")],
      rows:ps.map(p => [p.key, p.name, t("ps_" + p.status), pProgress(p) + "%", pUser(p.pm),
        fmtLong(p.start), fmtLong(p.end), pOpenRisks(p).length, pOverdueTasks(p).length, t("h_" + pHealth(p))]) }] };
  if (kind === "pcc_tasks" || kind === "pcc_ptasks") {
    const src = kind === "pcc_ptasks" ? [cur] : ps;
    const rows = []; src.forEach(p => p.tasks.forEach(x => rows.push({ p, x })));
    return { title:t("pt_t") + (kind === "pcc_ptasks" ? " — " + cur.key : ""),
      meta:[[t("exp_count"), rows.length]], sections:[{ cols:TASK_COLS, rows:taskRows(rows) }] };
  }
  if (kind === "pcc_risks" || kind === "pcc_prisks") {
    const src = kind === "pcc_prisks" ? [cur] : ps;
    const rows = []; src.forEach(p => p.risks.forEach(r => rows.push({ p, r })));
    rows.sort((a,b) => rScore(b.r) - rScore(a.r));
    return { title:t("pr_t") + (kind === "pcc_prisks" ? " — " + cur.key : ""),
      meta:[[t("exp_count"), rows.length]], sections:[{ cols:RISK_COLS, rows:riskRows(rows) }] };
  }
  if (kind === "pcc_ms") {
    const rows = []; ps.forEach(p => p.ms.forEach(m => rows.push({ p, m })));
    rows.sort((a,b) => a.m.date < b.m.date ? -1 : 1);
    return { title:t("pm_t"), meta:[[t("exp_count"), rows.length]],
      sections:[{ cols:[t("col_date"), t("pn_milestones"), t("col_project"), t("col_owner"), t("col_status")],
        rows:rows.map(({p,m}) => [fmtLong(m.date), m.name, p.key, pUser(m.owner), t("ms_" + m.status)]) }] };
  }
  if (kind === "pcc_pact") return { title:t("tab_act") + " — " + cur.key, meta:projMeta(cur),
    sections:[{ cols:[t("exp_when"), t("exp_who"), t("exp_what")],
      rows:pActivity(cur).map(e => [fmtLong(e.ts.slice(0,10)), pUser(e.who), e.txt]) }] };
  if (kind === "pcc_report") {
    const p = pById(pRepProject) || cur;
    const tk = p.tasks.map(x => ({ p, x })), rk = p.risks.map(r => ({ p, r }));
    return { title:t("exp_pcc_proj") + " — " + p.name, meta:projMeta(p), sign:true, sections:[
      { h:t("tab_over"), cols:[t("col_title"), t("f_desc")],
        rows:[[t("f_desc"), p.description], [t("f_obj"), p.objectives], [t("f_scope"), p.scope]] },
      { h:t("pn_milestones"), cols:[t("col_date"), t("col_title"), t("col_owner"), t("col_status")],
        rows:p.ms.map(m => [fmtLong(m.date), m.name, pUser(m.owner), t("ms_" + m.status)]) },
      { h:t("pn_tasks"), cols:TASK_COLS, rows:taskRows(tk) },
      { h:t("pn_risks"), cols:RISK_COLS, rows:riskRows(rk) },
      { h:t("pn_issues"), cols:[t("f_key"), t("col_title"), t("col_owner"), t("col_prio"), t("col_status"), t("col_due")],
        rows:p.issues.map(i => [i.ref, i.title, pUser(i.owner), i.prio, t("is_" + i.status), fmtLong(i.due)]) },
      { h:t("tab_dec"), cols:[t("col_date"), t("col_title"), t("tab_dec"), t("f_maker")],
        rows:p.decisions.map(d => [fmtLong(d.date), d.topic, d.decision, pUser(d.maker)]) },
      { h:t("tab_team"), cols:[t("usr_name"), t("f_prole"), t("f_resp")],
        rows:p.team.map(m => [pUser(m.user), m.role, m.resp]) },
      { h:t("tab_docs"), cols:[t("col_title"), t("col_status"), t("f_ver"), t("doc_size"), t("col_owner"), t("f_desc")],
        rows:p.docs.map(d => [d.title, d.kind === "file" ? t("doc_file") : t("doc_link"),
          d.version + (d.superseded ? " (" + t("doc_super") + ")" : ""), d.size || "—",
          pUser(d.owner), d.description]) },
      { h:t("tab_act"), cols:[t("exp_when"), t("exp_who"), t("exp_what")],
        rows:pActivity(p).slice(0,30).map(e => [fmtLong(e.ts.slice(0,10)), pUser(e.who), e.txt]) },
      { h:t("ver_t"), cols:[t("f_ver"), t("col_date"), t("exp_who"), t("ver_sum")],
        rows:p.versions.map(v => [v.v, fmtLong(v.date), pUser(v.by), v.summary]) }] };
  }
}

function render() {
  const inApp = !!me;
  document.getElementById("login").classList.toggle("on", !inApp);
  document.getElementById("app").style.display = inApp ? "" : "none";
  renderSandbar();
  if (!inApp) { pProject = null; renderLogin(); return; }
  renderTop(); renderNav(); renderMain();
}
render();
</script>
