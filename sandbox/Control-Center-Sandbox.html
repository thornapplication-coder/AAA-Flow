<meta charset="utf-8">
<title>Project Control Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ============================================================================
   Project Control Center — Sandbox
   Klickbarer Prototyp. Keine Persistenz, Daten im Speicher; ein Neuladen
   stellt den Ausgangszustand wieder her.
   Rollen, Rechte und Ableitungen gespiegelt aus supabase/migrations.
   Desktop ist Leitplattform, Tablet und Telefon sind reduziert.
   ========================================================================== */
:root{
  --navy-900:#0C1B2E; --navy-800:#12283F; --navy-700:#1B3A5A;
  --navy-600:#26507A; --navy-500:#3A6796; --navy-400:#5B84B1;
  --line:#DDE4EC; --line-strong:#C3CFDD;
  --paper:#F1F4F8; --surface:#FFFFFF; --surface-2:#FAFCFE;
  --ink:#132132; --ink-soft:#5A6B7F; --ink-faint:#677687;
  --open:#8FA3BC;
  --work:#9A6110; --work-bg:#FDF3E2;
  --done:#26714F; --done-bg:#E6F2EC;
  --late:#A83A2A; --late-bg:#FBECE9;
  --exc:#5C4B8A;  --exc-bg:#EFEBF7;
  --focus:#4A90D9;
  --r:6px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Chrome ---------- */
.app{display:grid;grid-template-columns:212px minmax(0,1fr);grid-template-rows:56px auto 1fr;height:100vh;max-width:100vw}
.topbar{grid-column:1/-1;background:var(--navy-900);display:flex;align-items:center;gap:14px;padding:0 16px;color:#fff}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:600;letter-spacing:-.01em;font-size:16px;
  white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.brand em{font-style:normal;color:var(--navy-400)}
.brand span{color:var(--navy-400);font-weight:400;font-size:12px;letter-spacing:.04em}
.topbar .spacer{flex:1}
/* Suche über alles. Sie sitzt in der Kopfzeile, weil sie zu keinem Bereich
   gehört — und über allen. */
.gsearch{position:relative;flex:1 1 180px;min-width:0;max-width:320px}
.gsearch input{width:100%;border:1px solid #24405F;background:#0F2033;color:#E8F0F8;
  border-radius:var(--r);padding:7px 11px;font-size:13px}
.gsearch input::placeholder{color:#7690AB}
.ghits{position:absolute;top:calc(100% + 6px);left:0;width:min(520px,80vw);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 48px rgba(12,27,46,.28);
  max-height:min(70vh,520px);overflow-y:auto;z-index:25;color:var(--ink)}
.ghits .gh{padding:7px 13px 4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-soft);background:var(--surface-2);border-bottom:1px solid var(--line)}
.ghits button{display:block;width:100%;text-align:left;padding:9px 13px;border-bottom:1px solid #F0F4F8}
.ghits button:hover,.ghits button:focus-visible{background:#F7FAFD}
.ghits .t{font-size:13.5px;font-weight:600;display:block}
.ghits .s{font-size:11.5px;color:var(--ink-soft)}
.ghits .none{padding:16px 13px;color:var(--ink-soft);font-size:13px}
.lang{display:flex;border:1px solid #24405F;border-radius:var(--r);overflow:hidden;flex:0 0 auto}
.lang button{padding:5px 11px;font-size:12px;font-weight:600;color:#9DB4CC}
.lang button.on{background:var(--navy-600);color:#fff}

.side{grid-column:1;grid-row:2/4;background:var(--navy-800);padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.side button{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--r);color:#A9C0D6;font-size:13.5px;text-align:left;width:100%}
.side button:hover{background:#1A3552}
.side button.on{background:var(--navy-600);color:#fff;font-weight:600}
.side .count{font-size:11px;background:rgba(255,255,255,.14);padding:1px 6px;border-radius:9px;font-variant-numeric:tabular-nums}
.side .count.alert{background:#7A3A2C;color:#FFD9D1}
.side .grp{color:#7690AB;font-size:11px;padding:14px 12px 5px;letter-spacing:.03em}
.side .who{margin-top:auto;padding:12px;border-top:1px solid #1E3A57;color:#7E9AB6;font-size:11.5px;line-height:1.45}
.side .who b{display:block;color:#C6D8E8;font-size:12.5px;font-weight:600}

.workspace{grid-column:2;grid-row:3;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.mobnav{grid-column:2;grid-row:2;display:none;gap:6px;padding:9px 12px;background:var(--navy-800);overflow-x:auto;min-width:0}
.mobnav button{color:#A9C0D6;font-size:13px;padding:6px 12px;border-radius:14px;white-space:nowrap;border:1px solid #24405F}
.mobnav button.on{background:var(--navy-600);color:#fff;font-weight:600;border-color:var(--navy-600)}
.mobnav .count{font-size:11px;margin-left:5px;font-variant-numeric:tabular-nums}
.mobnav .count.alert{color:#F0A192;font-weight:700}

.main{padding:22px 24px 96px;flex:1;min-width:0}
.hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap}
.hd h1{font-size:21px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.hd p{color:var(--ink-soft);font-size:13px;margin-top:3px;max-width:66ch}
.btn-primary{background:var(--navy-600);color:#fff;padding:8px 15px;border-radius:var(--r);font-size:13.5px;font-weight:600;white-space:nowrap}
.btn-primary:hover{background:var(--navy-700)}
.btn-ghost{border:1px solid var(--line-strong);background:#fff;color:var(--navy-600);padding:7px 13px;border-radius:var(--r);font-size:13px;font-weight:600}
.btn-ghost:hover{border-color:var(--navy-500);background:var(--surface-2)}

/* ---------- Filter ---------- */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 10px;min-width:230px;flex:1 1 230px;max-width:340px}
.filters select{border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 9px;background:#fff}
.filters .clear{color:var(--navy-600);font-size:13px;text-decoration:underline;padding:6px 2px}
.fcount{color:var(--ink-faint);font-size:12.5px;margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- Tabelle ---------- */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-soft);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #EDF1F6;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr[data-id]{cursor:pointer}
tbody tr[data-id]:hover{background:#F7FAFD}
.num{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap}
.tn{font-weight:600}
.co{color:var(--ink-soft);font-size:12.5px}
.pill{display:inline-block;padding:2px 8px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-open{background:#EEF2F7;color:#5A6B7F}
.p-work{background:var(--work-bg);color:var(--work)}
.p-done{background:var(--done-bg);color:var(--done)}
.p-late{background:var(--late-bg);color:var(--late)}
.empty{padding:44px 20px;text-align:center;color:var(--ink-soft)}
.empty b{display:block;color:var(--ink);margin-bottom:5px;font-size:15px}

/* ---------- Kartenliste (Handy) ---------- */
.cards{display:none;gap:10px;flex-direction:column}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 14px;cursor:pointer}
.card:active{background:#F7FAFD}
.card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h4{font-size:15px;font-weight:600;margin-top:5px}
.card .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .next{font-size:12.5px;color:var(--ink-soft);margin-top:7px;padding-top:7px;border-top:1px solid #F0F4F8}
.card .next b{color:var(--ink);font-weight:600}
.card .foot{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}

.notice{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--navy-600);border-radius:var(--r);padding:11px 13px;font-size:12.5px;color:var(--ink-soft);margin-bottom:16px}
.notice b{color:var(--ink)}
.notice.warn{border-left-color:var(--late);background:var(--late-bg);border-color:#F0D5CF;color:#7C3427}
.notice.warn b{color:#7C3427}


/* ---------- Dialog ---------- */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(12,27,46,.5);z-index:20;padding:16px}
.modal.on{display:flex}
.modal .card{background:var(--surface);border-radius:9px;width:min(560px,100%);max-height:92vh;overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(12,27,46,.3);cursor:default}
.modal h3{font-size:16px;font-weight:600;margin-bottom:6px}
.modal .lead{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{grid-column:1/-1}
.fld.half{grid-column:auto}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line-strong);border-radius:var(--r);padding:8px 10px;font-size:13.5px;background:#fff}
.fld textarea{min-height:84px;resize:vertical}
/* Der Excel-Export ist eine Tabelle mit Tabulatoren: feste Schrittweite, kein
   Umbruch, und hoch genug, um die Spalten zu erkennen. */
.fld textarea[data-f="data"]{min-height:300px;font-family:var(--mono);font-size:12px;
  white-space:pre;overflow-wrap:normal;overflow-x:auto}
.fld .hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px}
.modal .err{color:var(--late);font-size:12px;margin-top:8px;min-height:16px}
.modal .err ul{margin:0;padding-left:16px}
.fld label .req{color:var(--late);margin-left:2px}
/* Ein Dialog, der nur den ersten Fehler nennt, schickt in drei Anläufe. Die
   beanstandeten Felder werden zugleich benannt und markiert. */
.fld.bad input,.fld.bad textarea,.fld.bad select{border-color:var(--late);background:#FFF6F6}
.fld.bad label{color:var(--late)}
.reqnote{grid-column:1/-1;font-size:11.5px;color:var(--ink-soft)}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.modal .btns button{padding:8px 15px;border-radius:var(--r);font-size:13px;font-weight:600;border:1px solid var(--line-strong)}
.modal .btns .go{background:var(--navy-600);color:#fff;border-color:var(--navy-600)}
.modal .btns .go:hover{background:var(--navy-700)}

/* ---------- Druck- und Exportdokument ---------- */
.hdacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#print{display:none;position:fixed;inset:0;z-index:60;background:#fff;overflow-y:auto}
#print.on{display:block}
.pbar{position:sticky;top:0;background:var(--navy-900);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;z-index:2}
.pbar .ttl{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.pbar button{border:1px solid #24405F;color:#C6D8E8;border-radius:var(--r);padding:6px 13px;font-size:13px;font-weight:600}
.pbar button.go{background:var(--navy-600);border-color:var(--navy-600);color:#fff}
.pdoc{max-width:900px;margin:0 auto;padding:28px 26px 60px;color:#111;font-size:11.5px}
.pdoc h1{font-size:19px;font-weight:600;letter-spacing:-.01em}
.pdoc .brand{font-size:11px;letter-spacing:.14em;color:#5A6B7F;text-transform:uppercase;margin-bottom:3px}
.pdoc .sub{color:#5A6B7F;font-size:12px;margin-top:3px}
.pdoc .rule{height:2px;background:var(--navy-900);margin:12px 0 14px}
.pdoc h2{font-size:13px;font-weight:600;margin:20px 0 7px;padding-bottom:4px;border-bottom:1px solid #C3CFDD}
.pdoc table{width:100%;border-collapse:collapse;margin-bottom:6px}
.pdoc th{background:#EEF2F7;border:1px solid #C3CFDD;padding:5px 6px;font-size:10px;text-align:left;
  text-transform:uppercase;letter-spacing:.03em;color:#3A4A5E}
.pdoc td{border:1px solid #DDE4EC;padding:5px 6px;vertical-align:top}
.pdoc tr{break-inside:avoid}
.pdoc thead{display:table-header-group}
.pdoc .kv{width:100%;border-collapse:collapse;margin-bottom:6px}
.pdoc .kv td{border:none;padding:2px 0;vertical-align:top}
.pdoc .kv td:first-child{width:190px;color:#5A6B7F}
.pdoc .foot{margin-top:26px;padding-top:8px;border-top:1px solid #C3CFDD;color:#5A6B7F;font-size:10px}
.pdoc .pgantt{margin-bottom:10px}
.pdoc .pgantt .tl{overflow:visible}
.pdoc .pgantt .gbar b{color:#fff}
.pdoc .sign{margin-top:26px;display:flex;gap:40px}
.pdoc .sign div{flex:1;border-top:1px solid #111;padding-top:4px;color:#5A6B7F;font-size:10px}
.pdoc .none{color:#5A6B7F;font-style:italic}
@media print{
  .app,.login,.sandbar,.modal,.toast{display:none!important}
  #print{display:block!important;position:static;overflow:visible}
  .pbar{display:none!important}
  .pdoc{max-width:none;padding:0}
@page{margin:14mm 12mm}
  body{background:#fff}
}

.ovlcard{background:var(--surface);border-radius:10px;width:min(620px,100%);margin:24px 0 96px;
  box-shadow:0 20px 60px rgba(12,27,46,.3);display:flex;flex-direction:column;max-height:calc(100vh - 140px)}

/* ---------- Anmeldung ---------- */
.login{position:fixed;inset:0;overflow-y:auto;display:none;
  background:linear-gradient(160deg,var(--navy-900) 0%,var(--navy-700) 100%);padding:32px 16px 110px}
.login.on{display:block}
.login .box{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.login .hello{text-align:center;color:#9DB4CC;font-size:13.5px}
.login h1{text-align:center;color:#fff;font-size:29px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.login h1 em{color:var(--navy-400);font-style:normal}
.login .claim{text-align:center;color:#9DB4CC;font-size:13.5px;margin-top:-8px}
.login .card{background:var(--surface);border-radius:10px;padding:18px}
.login label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
.login input{width:100%;border:1px solid var(--line-strong);border-radius:var(--r);padding:11px 12px;font-size:15px;background:#fff}
.login .go{width:100%;background:var(--navy-600);color:#fff;padding:12px;border-radius:var(--r);font-size:15px;font-weight:600;margin-top:12px}
.login .go:hover{background:var(--navy-700)}
.login .fine{color:#8FAAC6;font-size:12px;text-align:center;line-height:1.45}
.pick{background:rgba(255,255,255,.05);border:1px solid #24405F;border-radius:10px;overflow:hidden}
.pick h2{font-size:11px;letter-spacing:.09em;color:#E3B341;padding:13px 15px 9px;font-weight:600}
.pick .rows{max-height:min(44vh,400px);overflow-y:auto}
.pick button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 15px;text-align:left;border-top:1px solid #1E3A57}
.pick button:hover{background:rgba(255,255,255,.07)}
.pick .ini{width:36px;height:36px;flex:0 0 36px;border-radius:8px;background:var(--navy-600);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600}
.pick .ini.s{background:#6B4E9E}.pick .ini.t{background:#1F6E5A}.pick .ini.a{background:#B0641A}
.pick .nm{color:#fff;font-size:14.5px;font-weight:600}
.pick .rl{color:#8FAAC6;font-size:12px}

/* ---------- Sandbox-Leiste ---------- */
.sandbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#2A2410;border-top:1px solid #5A4A18;
  display:flex;align-items:center;gap:8px;padding:7px 12px;overflow-x:auto}
.sandbar .tag{display:flex;align-items:center;gap:7px;color:#E3B341;font-size:11.5px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.sandbar .clock{color:#CDBA7A;font-size:12px;font-family:var(--mono);white-space:nowrap}
.sandbar .clock b{color:#F0D48A;font-weight:600}
.sandbar .sp{flex:1;min-width:4px}
.sandbar button{border:1px solid #5A4A18;color:#E3B341;border-radius:5px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:transparent}
.sandbar button:hover{background:#3B3316}
.sandbar button.reset{color:#CDBA7A}
.sandbar .saved{color:#9CCFA8;font-size:11.5px;white-space:nowrap}
/* min-width:0 allein lässt die Box schrumpfen, nicht ihren Inhalt: Name und
   Knöpfe liefen aus dem Feld heraus und legten sich über den Sprachumschalter.
   Schrumpfen darf hier nur der Name — mit Auslassungspunkten. */
.topbar .userchip{display:flex;align-items:center;gap:9px;color:#C6D8E8;font-size:12.5px;white-space:nowrap;min-width:0;flex:0 1 auto}
.topbar .userchip>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
.topbar .userchip b{color:#fff;font-weight:600}
.topbar .userchip .sw{border:1px solid #24405F;border-radius:var(--r);color:#9DB4CC;padding:5px 10px;
  font-size:12px;white-space:nowrap;flex:0 0 auto}
.topbar .userchip .sw .ini2{display:none;font-weight:700;letter-spacing:.02em}
.topbar .userchip .sw:hover{background:var(--navy-700);color:#fff}

/* ---------- Kennzahlen, Projektansicht ---------- */
.pkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:12px;margin-bottom:20px}
.pkpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.pkpi .n{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.pkpi .lb{font-size:12px;color:var(--ink-soft);margin-top:3px}
.pkpi.ok .n{color:var(--done)}
.pkpi.warn .n{color:var(--work)}
.pkpi.bad .n{color:var(--late)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
/* Der Kopf trägt Titel, Erklärung und Knöpfe. Mit flex:1 und min-width:0 fiel
   der Titel auf schmalen Schirmen auf null Breite zusammen und sein Text lief
   quer über die Erklärung. Jetzt behält jeder Teil mindestens seine
   Mindestbreite, und was nicht mehr passt, rutscht in die nächste Zeile. */
.pcard>header{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:12px 15px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.pcard>header h2{font-size:14px;font-weight:600;flex:1 1 auto;min-width:min-content}
.pcard>header .co{font-size:12px;flex:1 1 240px;min-width:min-content}
.pcard .inner{padding:14px 15px}
.plist{list-style:none}
.plist li{display:flex;gap:12px;align-items:flex-start;padding:10px 15px;border-bottom:1px solid #F0F4F8}
.plist li:last-child{border-bottom:none}
.plist li.clickable{cursor:pointer}
.plist li.clickable:hover{background:#F7FAFD}
.plist .when{flex:0 0 54px;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);line-height:1.3}
.plist .when b{display:block;color:var(--ink);font-size:14px;font-weight:600}
.plist .m{flex:1;min-width:0}
.plist .m b{font-size:13.5px;font-weight:600;display:block}
.plist .m .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.plist .rt{flex:0 0 auto;text-align:right}

.bar{height:6px;background:#E6ECF3;border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--navy-600)}
.bar.ok i{background:var(--done)}
.bar.warn i{background:var(--work)}
.bar.bad i{background:var(--late)}
.pct{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.s-not_started{background:#EEF2F7;color:#5A6B7F}
.s-started{background:#E8F0FA;color:var(--navy-600)}

/* Timeline */
.tl{overflow-x:auto}
.tlgrid{min-width:640px;--tlnm:190px}
.tlhead{display:flex;border-bottom:1px solid var(--line);padding-left:var(--tlnm)}
.tlhead span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;padding:6px 0 6px 6px;border-left:1px solid var(--line)}
.tlrow{display:flex;align-items:center;border-bottom:1px solid #F0F4F8;min-height:44px}
.tlrow:last-child{border-bottom:none}
.tlrow .nm{flex:0 0 var(--tlnm);padding:8px 12px 8px 0;font-size:13px;font-weight:600;min-width:0;overflow:hidden}
.tlrow .nm .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tlrow .nm .co{font-weight:400;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlrow .tltrack{flex:1;position:relative;height:44px}
.tlrow .tltrack .grid{position:absolute;inset:0;display:flex}
.tlrow .tltrack .grid span{flex:1;border-left:1px solid #EDF1F6}
.tlrow .tltrack .tlbar{position:absolute;top:15px;height:12px;border-radius:6px;background:var(--navy-500)}
.tlrow .tltrack .tlbar.ok{background:var(--done)}
.tlrow .tltrack .tlbar.warn{background:var(--work)}
.tlrow .tltrack .tlbar.bad{background:var(--late)}
.tlrow .tltrack .tlbar.done{background:var(--navy-400)}
.tlrow .tltrack .ms{position:absolute;top:12px;width:0;height:0}
.tlrow .tltrack .ms i{position:absolute;left:-6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--navy-800);display:block}
.tlrow .tltrack .ms i.done{background:var(--done);border-color:var(--done)}
.tlrow .tltrack .ms i.late{background:var(--late);border-color:var(--late)}
.tlnow{position:absolute;top:0;bottom:0;width:1px;background:var(--late);opacity:.5}
/* Die Linie ohne Beschriftung war eine rote Markierung ohne Aussage. */
.tlnowhd{position:absolute;top:0;bottom:0;width:1px;background:var(--late);opacity:.55}
.tlnowhd b{position:absolute;top:2px;left:3px;font-size:10px;font-weight:700;letter-spacing:.04em;
  color:var(--late);text-transform:uppercase;white-space:nowrap;background:#fff;padding:0 3px;border-radius:3px}
.tlleg{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 0 2px 0;font-size:11.5px;color:var(--ink-soft)}
.tlleg span{display:inline-flex;align-items:center;gap:6px}
.tlleg i{width:14px;height:8px;border-radius:4px;display:inline-block}
.tlleg i.ok{background:var(--done)} .tlleg i.warn{background:var(--work)}
.tlleg i.bad{background:var(--late)} .tlleg i.done{background:var(--navy-400)}
.tlleg i.dot{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--navy-800)}
.tlleg i.dotdone{width:10px;height:10px;border-radius:50%;background:var(--done);border:2px solid var(--done)}
.tlleg i.dotlate{width:10px;height:10px;border-radius:50%;background:var(--late);border:2px solid var(--late)}
.tlleg i.now{width:2px;height:12px;border-radius:0;background:var(--late)}

/* Gantt je Projekt */
.ggrid{min-width:760px;--gnm:264px;position:relative}
.ghead{display:flex;position:relative;border-bottom:1px solid var(--line);padding-left:var(--gnm);padding-top:14px}
.ghead .tlnowhd b{top:0}
.ghead span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;
  color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;padding:6px 0 6px 6px;border-left:1px solid var(--line)}
.grow{display:flex;align-items:center;border-bottom:1px solid #F4F7FA;min-height:34px;background:transparent}
.grow:last-child{border-bottom:none}
.grow.group{background:var(--surface-2);border-bottom:1px solid var(--line);min-height:38px}
.grow .gnm{flex:0 0 var(--gnm);padding:6px 12px 6px 0;min-width:0;font-size:13px}
.grow .gnm b{font-weight:600}
.glnk{color:var(--navy-600);font-size:12px;padding:0 4px;opacity:.7}
.glnk:hover{opacity:1}
.grow .gnm .gt{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow .gnm .co{display:block;font-size:11px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow.sub .gnm{padding-left:16px}
.grow.sub .gnm .gt{font-weight:400;color:var(--ink-soft)}
.grow.ms .gnm .gt{font-weight:600}
.grow .gtrack{flex:1;position:relative;height:34px;min-width:0}
.grow.group .gtrack{height:38px}
.grow .gtrack .grid{position:absolute;inset:0;display:flex}
.grow .gtrack .grid span{flex:1;border-left:1px solid #EDF1F6}
/* Der Balken: heller Grund in der Zustandsfarbe, darin der Fortschritt voll.
   4 px runde Enden, damit Anfang und Ende ablesbar bleiben. */
.gbar{position:absolute;top:9px;height:16px;border-radius:4px;overflow:hidden;
  background:#E6ECF3;border:1px solid var(--line-strong);display:flex;align-items:center}
.gbar i{display:flex;align-items:center;height:100%;background:var(--navy-500);border-radius:3px 0 0 3px;overflow:hidden}
.gbar b{font-size:10px;font-weight:700;color:#fff;padding-left:5px;white-space:nowrap}
.gbar.ok{border-color:var(--done);background:var(--done-bg)}      .gbar.ok i{background:var(--done)}
.gbar.warn{border-color:var(--work);background:var(--work-bg)}    .gbar.warn i{background:var(--work)}
.gbar.bad{border-color:var(--late);background:var(--late-bg)}     .gbar.bad i{background:var(--late)}
.gbar.open{border-color:var(--line-strong);background:#EEF2F7}    .gbar.open i{background:var(--open)}
.gbar.off{border-style:dashed;background:#F4F6F9;opacity:.7}      .gbar.off i{background:var(--ink-faint)}
/* Das Teilprojekt ist eine Klammer, kein Balken: es ist keine eigene Arbeit. */
.gbracket{position:absolute;top:15px;height:8px;background:var(--navy-700);border-radius:2px}
.gbracket::before,.gbracket::after{content:"";position:absolute;top:8px;border-top:6px solid var(--navy-700)}
.gbracket::before{left:0;border-right:5px solid transparent}
.gbracket::after{right:0;border-left:5px solid transparent}
.gms{position:absolute;top:10px;left:0;width:14px;height:14px;margin-left:-7px;background:#fff;
  border:2px solid var(--navy-800);transform:rotate(45deg);border-radius:2px}
.gms.done{background:var(--done);border-color:var(--done)}
.gms.late{background:var(--late);border-color:var(--late)}
.gnone{position:absolute;left:6px;top:9px;font-size:11px;color:var(--ink-faint)}
/* Der kritische Pfad ist ein zweiter Kanal neben der Zustandsfarbe: ein
   kräftiger Rahmen, nicht eine weitere Farbe. */
.gbar.crit{box-shadow:0 0 0 2px var(--navy-800);border-color:var(--navy-800)}
.glinks{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
.grow{position:relative;z-index:1}
.glink{fill:none;stroke:var(--navy-600);stroke-width:1.5;opacity:.75}
.glink.bad{stroke:var(--late);stroke-dasharray:4 3;opacity:1}
.tlleg i.crit{width:16px;height:9px;border-radius:3px;background:#EEF2F7;box-shadow:0 0 0 2px var(--navy-800)}
.tlleg i.link{width:16px;height:2px;background:var(--navy-600);border-radius:0}
.tlleg i.gl{width:16px;height:9px;border-radius:3px;border:1px solid var(--line-strong);background:#EEF2F7}
.tlleg i.gl.ok{border-color:var(--done);background:var(--done)}
.tlleg i.gl.warn{border-color:var(--work);background:var(--work)}
.tlleg i.gl.bad{border-color:var(--late);background:var(--late)}
.tlleg i.gl.open{border-color:var(--line-strong);background:var(--open)}
.tlleg i.gl.bracket{background:var(--navy-700);border-color:var(--navy-700);height:6px}
/* Im Ausdruck zählt Vollständigkeit mehr als eine ruhige Zeilenhöhe: der
   Titel wird umgebrochen statt abgeschnitten. */
.ggrid.forprint{--gnm:260px;min-width:0}
.ggrid.forprint .gnm .gt{white-space:normal;overflow:visible}
.ggrid.forprint .grow{page-break-inside:avoid;break-inside:avoid}

/* Risk-Matrix */
.mxhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.mxtoggle{color:var(--navy-600);font-size:12.5px;text-decoration:underline;white-space:nowrap}
/* Die Erklärung steht neben der Matrix, nicht darunter: wer eine Stufe
   einträgt, soll nicht scrollen müssen, um ihre Bedeutung zu lesen. */
.mxexpl{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;margin-bottom:14px}
.mxexpl h4{font-size:12.5px;font-weight:600;margin-bottom:6px}
.mxexpl .mxsub{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin:9px 0 3px}
.mxexpl ul{list-style:none;font-size:12.5px;line-height:1.55}
.mxexpl li{color:var(--ink-soft)}
.mxlvl{border-collapse:collapse;width:100%}

.mxlvl td:first-child{width:56px}
.mxlvl b{color:var(--ink)}
.mxkey{display:inline-block;min-width:46px;text-align:center;border-radius:4px;
  font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 5px}
.mxkey.l{background:#E9F3ED;color:var(--done)}
.mxkey.m{background:#FBF0DC;color:var(--work)}
.mxkey.h{background:#F7DED7;color:var(--late)}
.mxkey.x{background:#EFC9C0;color:#7C2D20}
/* Jede Zelle ist ein Knopf — die Fläche füllt sie ganz aus, damit der Finger
   sie auch trifft. */
.rmx td button{width:100%;height:100%;min-height:38px;font:inherit;color:inherit;font-weight:600}
.rmx td.sel{outline:2px solid var(--navy-800);outline-offset:-2px}
.rmx{border-collapse:collapse;width:auto}
.rmx td,.rmx th{border:1px solid var(--line);padding:0;text-align:center}
.rmx th{background:var(--surface-2);font-size:10.5px;color:var(--ink-soft);padding:4px 6px;font-weight:600}
.rmx td{width:44px;height:38px;font-size:12px;font-weight:600}
.rmx td.l{background:#E9F3ED;color:var(--done)}
.rmx td.m{background:#FBF0DC;color:var(--work)}
.rmx td.h{background:#F7DED7;color:var(--late)}
.rmx td.x{background:#EFC9C0;color:#7C2D20}
.rmx td b{display:inline-block;min-width:20px}
.mxwrap{display:flex;align-items:center;gap:8px}
.mxy{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--ink-soft);letter-spacing:.03em}
.mxx{font-size:11px;color:var(--ink-soft);margin:4px 0 0 28px;letter-spacing:.03em}

/* Projektkopf */
.phead{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.phead .top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.phead h1{font-size:20px;font-weight:600;letter-spacing:-.015em;flex:1;min-width:200px}
.phead .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.phead .facts div .k{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.phead .facts div .v{font-size:13.5px;font-weight:600;margin-top:2px}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.ptabs button{padding:9px 13px;font-size:13.5px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptabs button.on{color:var(--navy-700);border-bottom-color:var(--navy-600);font-weight:600}
.back{font-size:13px;color:var(--navy-600);text-decoration:underline;margin-bottom:10px;display:inline-block}

.kv2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.kv2 .k{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.kv2 .v{font-size:13.5px}
.tasktree .sub{padding-left:26px}
.tasktree .sub td:first-child{color:var(--ink-soft)}
.raci{font-family:var(--mono);font-size:11px;font-weight:700;display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;border-radius:4px}
.raci.R{background:#E8F0FA;color:var(--navy-600)}

.prio-High{background:var(--work-bg);color:var(--work)}
.prio-Medium{background:#E8F0FA;color:var(--navy-600)}

/* ---------- Toast ---------- */
.toast .undo{margin-left:10px;text-decoration:underline;color:#BFD6EC;font-weight:600}
.toast{position:fixed;left:50%;bottom:70px;transform:translate(-50%,14px);background:var(--navy-900);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:30;max-width:min(560px,92vw);box-shadow:0 10px 30px rgba(12,27,46,.35)}

}

  : n >= 1048576 ? (n / 1048576).toFixed(1).replace(".", L === "de" ? "," : ".") + " MB"

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* ---------- Datum und Arbeitstage ---------- */
/* Simulierte Uhr: die Sandbox-Leiste verschiebt "heute" nach vorn, damit
   Termine, Überfälligkeit und die Gesamtlage erlebbar werden. Die Demodaten
   entstehen einmal beim Laden relativ zum echten Datum. */
let CLOCK = 0;                       // Verschiebung in Kalendertagen
const iso = d => d.toISOString().slice(0,10);
const todayD = () => { const d = new Date(); d.setDate(d.getDate() + CLOCK); return d; };
const today = () => iso(todayD());
const D = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
function addBusinessDays(dateStr, days) {
  if (!dateStr) return null;
  const d = new Date(dateStr); const step = Math.sign(days); let left = Math.abs(days);
  while (left > 0) { d.setDate(d.getDate() + step); const w = d.getDay(); if (w !== 0 && w !== 6) left--; }
  return iso(d);
}
const daysTo = s => Math.round((new Date(s) - new Date(today())) / 864e5);
const fmtDate = s => s ? new Date(s).toLocaleDateString(L === "de" ? "de-AT" : "en-GB", { day:"2-digit", month:"short" }) : t("none");

/* ---------- Audit-Trail ---------- */
/* Jeder Audit-Eintrag trägt einen Zeitstempel, damit sich der Trail nach
   Zeitraum auswerten lässt. Live-Einträge hängen an der simulierten Uhr. */
const nowTs = () => today() + "T" + new Date().toTimeString().slice(0,5);
/* ---------- State ---------- */
/* Zwei Zugänge, entschieden am 19.09.2026: ACCESS ist der Zugang ("team" darf
   alles, "viewer" liest), me die Person, die gerade daran arbeitet. Beide
   Zugänge werden gemeinsam benutzt — deshalb sagt die Personenwahl, wer hinter
   einer Änderung steht, und nicht die Anmeldung. */
let ACCESS = null;                // null heißt Anmeldebildschirm
let me = null;                    // Person aus dem Verzeichnis
const M = () => user(me);

/* ---------- Zeitreise und Toast ---------- */
/* Das simulierte Datum verschieben: Fristen, Überfälligkeit und Gesamtlage
   hängen daran und werden damit erlebbar. */
function travel(days) {
  const before = pOverdueCount();
  CLOCK += days;
  commit(); render();
  const after = pOverdueCount();
  const dt = after.tasks - before.tasks, dm = after.ms - before.ms;
  toast(t("t_travel", { d:fmtDate(today()),
    c:(dt || dm) ? t("tr_diff", { t:dt, m:dm }) : t("tr_none") }));
}
/* Wie viel bereits überfällig ist — Grundlage für die Rückmeldung nach einem
   Sprung in der Zeit. */
function pOverdueCount() {
  const ps = pVisible();
  return { tasks:ps.reduce((a,p) => a + pOverdueTasks(p).length, 0),
           ms:ps.reduce((a,p) => a + p.ms.filter(pMsOverdue).length, 0) };
}

let toastTimer = null;
function toast(text, bad, action) {
  const el = document.getElementById("toast");
  el.innerHTML = esc(text) + (action ? ` <button class="undo">${esc(action.label)}</button>` : "");
  el.className = "toast on" + (bad ? " bad" : "");
  if (action) el.querySelector(".undo").onclick = () => {
    el.className = "toast"; action.fn();
  };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = "toast" + (bad ? " bad" : ""); }, action ? 6000 : 3600);
}

/* ---------- Dialog ----------
   build(values) liefert die Felder; Felder mit reactive:true zeichnen den
   Dialog beim Ändern neu, damit abhängige Felder erscheinen.               */
let dlg = null;
function openDialog(cfg) { dlg = { cfg, values: Object.assign({}, cfg.values) }; renderDialog(); }
function closeDialog() { document.getElementById("modal").classList.remove("on"); dlg = null; }
function renderDialog(err) {
  if (!dlg) return;
  const a = document.activeElement;
  const keep = a && a.dataset && a.dataset.f
    ? { name:a.dataset.f, pos:(a.selectionStart != null ? a.selectionStart : null) } : null;
  const card = document.querySelector("#modal .card");
  const cardTop = card ? card.scrollTop : 0;
  const { cfg, values } = dlg;
  const fields = cfg.build(values);
  document.getElementById("mTitle").textContent = cfg.title;
  document.getElementById("mText").textContent = cfg.text || "";
  /* err ist entweder ein Satz oder eine Liste {f, m}: Feldname und Grund. */
  const errs = Array.isArray(err) ? err : err ? [{ f:null, m:err }] : [];
  const bad = new Set(errs.map(x => x.f).filter(Boolean));
  document.getElementById("mErr").innerHTML = errs.length === 1
    ? esc(errs[0].m)
    : errs.length ? `<ul>${errs.map(x => `<li>${esc(x.m)}</li>`).join("")}</ul>` : "";
  document.getElementById("mCancel").textContent = t("cancel");
  document.getElementById("mOk").textContent = cfg.okLabel || t("ok");
  /* Ein Nebenweg neben Abbrechen und OK — etwa Kopieren neben Herunterladen. */
  const ex = document.getElementById("mExtra");
  ex.style.display = cfg.extra ? "" : "none";
  if (cfg.extra) { ex.textContent = cfg.extra.label; ex.onclick = () => cfg.extra.fn(dlg.values); }
  document.getElementById("mBody").innerHTML = fields.map(f => {
    if (f.type === "note") return `<div class="fld"><div class="notice" style="margin:0">${esc(f.label)}</div></div>`;
    const v = values[f.name] == null ? "" : values[f.name];
    const inner =
      f.type === "toggle"
        ? `<label class="tgl"><input type="checkbox" data-f="${f.name}" ${v ? "checked" : ""} ${f.disabled ? "disabled" : ""}
             ${f.reactive ? 'data-reactive="1"' : ""}><span>${esc(f.text || "")}</span></label>`
      : f.type === "checks"
        ? `<div class="checks">${f.options.map(o => `<label><input type="checkbox" data-fm="${f.name}"
             value="${esc(o.v)}" ${(v || []).includes(o.v) ? "checked" : ""} ${f.disabled ? "disabled" : ""}><span>${esc(o.l)}</span></label>`).join("")}</div>`
      : f.type === "select"
        ? `<select data-f="${f.name}" ${f.disabled ? "disabled" : ""} ${f.reactive ? 'data-reactive="1"' : ""}>${
            f.options.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(v) ? "selected" : ""}>${esc(o.l)}</option>`).join("")}</select>`
      : f.type === "file"
        ? `<input type="file" data-ff="${f.name}" ${f.accept ? `accept="${esc(f.accept)}"` : ""}>` +
          (v && v.name ? `<div class="hint"><b>${esc(v.name)}</b> · ${fmtSize(v.size)}</div>` : "")
      : f.type === "textarea"
        ? `<textarea data-f="${f.name}" placeholder="${esc(f.placeholder || "")}">${esc(v)}</textarea>`
        : `<input type="${f.type || "text"}" data-f="${f.name}" value="${esc(v)}"
             placeholder="${esc(f.placeholder || "")}" ${f.disabled ? "disabled" : ""}
             ${f.reactive ? 'data-reactive="1"' : ""} ${f.list ? `list="${f.list}"` : ""}>`;
    const star = f.req ? `<span class="req" aria-hidden="true">*</span>` : "";
    return `<div class="fld${f.half ? " half" : ""}${bad.has(f.name) ? " bad" : ""}">
      ${f.type === "toggle" ? `<label>${esc(f.label)}${star}</label>` : `<label for="">${esc(f.label)}${star}</label>`}${inner}
      ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}
      ${f.list ? `<datalist id="${f.list}">${(f.listOptions || []).map(o => `<option value="${esc(o)}"></option>`).join("")}</datalist>` : ""}
    </div>`;
  }).join("") + (fields.some(f => f.req) ? `<div class="reqnote">${t("req_note")}</div>` : "");
  document.getElementById("modal").classList.add("on");
  if (card && cardTop) card.scrollTop = cardTop;
  document.querySelectorAll("#mBody [data-f]").forEach(el => {
    const handler = e => {
      dlg.values[el.dataset.f] = el.type === "checkbox" ? el.checked : e.target.value;
      if (el.dataset.reactive) renderDialog();
    };
    el.oninput = handler; el.onchange = handler;
  });
  document.querySelectorAll("#mBody [data-ff]").forEach(el => el.onchange = () => {
    dlg.values[el.dataset.ff] = el.files && el.files[0] ? el.files[0] : null;
    renderDialog();
  });
  document.querySelectorAll("#mBody [data-fm]").forEach(el => el.onchange = () => {
    const n = el.dataset.fm;
    dlg.values[n] = Array.from(document.querySelectorAll(`#mBody [data-fm="${n}"]:checked`)).map(x => x.value);
  });
  /* Reaktive Felder zeichnen den Dialog neu — Fokus und Schreibmarke halten */
  if (keep && keep.name) {
    const el = document.querySelector(`#mBody [data-f="${keep.name}"]`);
    if (el) { el.focus(); if (keep.pos != null && el.setSelectionRange) { try { el.setSelectionRange(keep.pos, keep.pos); } catch (e) {} } }
  } else {
    const first = document.querySelector("#mBody [data-f]");
    if (first && !err) first.focus();
  }
}
document.getElementById("mOk").onclick = () => {
  if (!dlg) return;
  const e = dlg.cfg.validate ? dlg.cfg.validate(dlg.values) : null;
  if (e && (!Array.isArray(e) || e.length)) {
    renderDialog(e);
    const first = Array.isArray(e) ? e.find(x => x.f) : null;
    const el = first && document.querySelector(`#mBody [data-f="${first.f}"]`);
    if (el) el.focus();
    return;
  }
  const { cfg, values } = dlg;
  closeDialog();
  cfg.onSubmit(values);
};
document.getElementById("mCancel").onclick = closeDialog;
document.getElementById("modal").onclick = e => { if (e.target.id === "modal") closeDialog(); };

/* ============================================================================
   Export

    ${(() => { const meta = [[t("exp_state"), expStamp()]].concat(def.meta || []);
      return `<table class="kv">${meta.map(([k,v]) =>

}
/* Der Stand eines Exports: Zeitpunkt und laufende Nummer der letzten Änderung.
   Damit lässt sich ein ausgedrucktes Blatt einem Datenstand zuordnen — und
   erkennen, dass es nicht der neueste ist. */
function expStamp() {
  return fmtLong(today()) + ", " +
    new Date().toLocaleTimeString(L === "de" ? "de-AT" : "en-GB", { hour:"2-digit", minute:"2-digit" }) +
    " · " + t("exp_rev", { n:DATA_REV });
}

/* Welche Ausgabe gerade offen ist. Ändert sich etwas, wird sie neu gebaut —
   ein Bericht auf dem Bildschirm darf nie einen überholten Stand zeigen. */
let OPEN_EXPORT = null;
function refreshOpenExport() {
  const el = document.getElementById("print");
  if (el && el.classList.contains("on") && OPEN_EXPORT) { openPrint(OPEN_EXPORT, true); return; }
  // Der Excel-Auszug ist ein Textblock; er wird mit den neuen Zahlen gefüllt.
  if (dlg && dlg.cfg && dlg.cfg.expKind) {
    dlg.values.data = exportTsv(dlg.cfg.expKind);
    renderDialog();
  }
}

function openPrint(kind, keepScroll) {
  OPEN_EXPORT = kind;
  const def = docDef(kind);
  const keep = keepScroll ? document.getElementById("print").scrollTop : 0;
  const el = document.getElementById("print");
  el.innerHTML = `<div class="pbar">
      <span class="ttl">${esc(def.title)}</span>
      <button id="pPrint" class="go">${t("exp_print")}</button>
      <button id="pClose">${t("exp_close")}</button>
    </div>` + renderPrint(def);
  el.classList.add("on");
  if (keep) el.scrollTop = keep;
  document.getElementById("pClose").onclick = () => { el.classList.remove("on"); OPEN_EXPORT = null; };
  document.getElementById("pPrint").onclick = () => { try { window.print(); } catch (e) { toast(t("exp_manual"), true); } };
  if (!keepScroll) {
    try { window.print(); } catch (e) { /* Vorschau blockiert den Druckdialog — Ansicht bleibt sichtbar */ }
  }
}
/* Ein Feld, das mit = + - @ beginnt, führt Excel als Formel aus. Ein
   Apostroph davor macht daraus Text — sichtbar, aber ungefährlich. */
const tsvSafe = v => {
  const s = String(v == null ? "" : v).replace(/[\t\r\n]/g, " ");
  return /^[=+\-@]/.test(s) ? "'" + s : s;
};
function exportTsv(kind) {
  const def = docDef(kind);
  const lines = [def.title, t("exp_state") + "\t" + expStamp(), ""];
  def.sections.forEach(sec => {
    if (sec.h) lines.push(sec.h);
    lines.push(sec.cols.join("\t"));
    sec.rows.forEach(r => lines.push(r.map(v => tsvSafe(v)).join("\t")));
    lines.push("");
  });
  return lines.join("\n").trim();
}
/* ---------- Echte Excel-Datei ---------- */
/* Eine .xlsx ist ein Zip-Archiv mit XML-Blättern. Beides entsteht hier ohne
   Bibliothek: die Einträge liegen unkomprimiert im Archiv (dafür genügt eine
   CRC32), die Zellen sind Inline-Text — Excel liest „=SUMME(…)" damit als
   Text, nie als Formel. Zahlen bleiben Zahlen. */
const CRC_TABLE = (() => {
  const tb = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; tb[n] = c >>> 0; }

})();

  const u16 = n => [n & 255, (n >> 8) & 255];

  files.forEach(f => {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const head = new Uint8Array([0x50, 0x4B, 3, 4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21),
      ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0)]);
    parts.push(head, name, data);
    central.push(new Uint8Array([0x50, 0x4B, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21),
      ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(0), ...u32(offset)]), name);
    offset += head.length + name.length + data.length;
  });
  const cdSize = central.reduce((a, x) => a + x.length, 0);
  const end = new Uint8Array([0x50, 0x4B, 5, 6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length),
    ...u32(cdSize), ...u32(offset), ...u16(0)]);

const xmlEsc = v => String(v == null ? "" : v)

    if (typeof v === "number" && isFinite(v)) return `<c r="${ref}"${st}><v>${v}</v></c>`;
    if (v == null || v === "") return "";
    return `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
  }).join("") + "</row>").join("");

    `<col min="${i + 1}" max="${i + 1}" width="${Math.min(60, Math.max(8, w + 2))}" customWidth="1"/>`).join("")}</cols>` : "";

    let b = n, i = 2;

    const rows = [{ cells:[def.title + (sec.h ? " · " + sec.h : "")], bold:true }, { cells:[t("exp_state"), expStamp()] }];
    (def.meta || []).forEach(m => rows.push({ cells:m }));
    rows.push({ cells:[] }, { cells:sec.cols, bold:true });
    sec.rows.forEach(r => rows.push({ cells:r }));

    { name:"[Content_Types].xml", text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${NS}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${
      sheets.map((x, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>` },
    { name:"_rels/.rels", text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}package/2006/relationships"><Relationship Id="rId1" Type="${NS}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name:"xl/workbook.xml", text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}spreadsheetml/2006/main" xmlns:r="${NS}officeDocument/2006/relationships"><sheets>${
      sheets.map((x, i) => `<sheet name="${xmlEsc(x.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>` },
    { name:"xl/_rels/workbook.xml.rels", text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}package/2006/relationships">${
      sheets.map((x, i) => `<Relationship Id="rId${i + 1}" Type="${NS}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")
      }<Relationship Id="rId${sheets.length + 1}" Type="${NS}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { name:"xl/styles.xml", text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` }
  ].concat(sheets.map((x, i) => ({ name:`xl/worksheets/sheet${i + 1}.xml`, text:x.xml })));

}
function exportXlsx(kind) {
  const def = docDef(kind);
  const slug = def.title.toLowerCase().replace(/[^a-z0-9äöüß]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || kind;
  docSave(slug + "-" + today() + ".xlsx", xlsxBlob(def));

const expBtns = kind =>

    box(`<div class="pick"><h2>${t("lg_as")}</h2><div class="rows">

     springt die Liste nach jeder Aktion an den Anfang. */

function mkProject(o) {
  const p = Object.assign({ id:pid(), ws:[], tasks:[], ms:[], risks:[], issues:[],
    decisions:[], docs:[], team:[], versions:[], links:[], archived:false }, o);
  PROJECTS.push(p);
  return p;
}
/* Die nächste freie Nummer je Art. Nach einem Verwerfen darf eine Nummer nie
   ein zweites Mal vergeben werden — im Gespräch zeigt man auf sie. */
function nextRef(list, prefix) {
  const n = list.reduce((a, x) => {
    const m = new RegExp("^" + prefix + "-(\\d+)$").exec(x.ref || "");
    return m ? Math.max(a, +m[1]) : a;
  }, 0);
  return prefix + "-" + (n + 1);
}
function mkTask(p, o) {
  const tk = Object.assign({ id:pid(), ref:nextRef(p.tasks, "T"), parent:null,
    status:"not_started", prio:"Medium", progress:0, sub:[] }, o);
  p.tasks.push(tk); return tk;
}
function mkSub(p, parent, title, status, assignee, done) {
  /* Start und Frist kommen vom Elternteil: eine Teilaufgabe läuft in dessen
     Zeitraum. Ohne das stünde sie im Gantt als Punkt ohne Dauer. */
  return mkTask(p, { title, parent:parent.id, status, assignee, ws:parent.ws,
    start:parent.start, due:parent.due, prio:parent.prio,
    done:done || null, progress:status === "completed" ? 100 : 0 });
}

const DEMO = /[?&]demo=1/.test(location.search);

   den Prüfungen einen gefüllten Datensatz. */
if (DEMO) ladeBeispiele();
ladeProjekte();

/* ---------- Ableitungen ---------- */
const pTop = p => p.tasks.filter(x => !x.parent);
/* Ohne die Prüfung auf x.parent gälten zwei Aufgaben ohne Elternteil
   gegenseitig als Teilaufgaben — beide tragen dort nichts. */
const pKids = (p, t) => p.tasks.filter(x => x.parent && x.parent === t.id);
const pTaskDone = t => t.status === "completed" || t.status === "cancelled";
/* Eine Aufgabe ist so weit, wie ihre Teile fertig sind. Hat sie keine
   Teilaufgaben, gilt ihr eigener Wert; ist sie selbst abgeschlossen, gilt 100 —
   sonst stünde eine erledigte Aufgabe mit offener Teilaufgabe bei 60 %. */
function pTaskProgress(p, x) {
  if (pTaskDone(x)) return 100;
  const kids = pKids(p, x).filter(k => k.status !== "cancelled");
  if (!kids.length) return x.progress || 0;
  return Math.round(kids.reduce((a, k) => a + (pTaskDone(k) ? 100 : (k.progress || 0)), 0) / kids.length);
}
const pHasKids = (p, x) => pKids(p, x).length > 0;
/* Gemittelt wird über die Hauptaufgaben: deren Wert enthält die Teilaufgaben
   bereits. Zählte man beide, wögen zerlegte Aufgaben doppelt. */
function pProgress(p) {
  const all = pTop(p).filter(t => t.status !== "cancelled");
  if (!all.length) return 0;
  return Math.round(all.reduce((a, t) => a + pTaskProgress(p, t), 0) / all.length);
}
const pTaskOverdue = t => !pTaskDone(t) && t.due && daysTo(t.due) < 0;
const pOverdueTasks = p => p.tasks.filter(pTaskOverdue);
const pOpenRisks = p => p.risks.filter(r => ["open","monitoring"].includes(r.status));
const rScore = r => r.prob * r.imp;
const pCritRisks = p => pOpenRisks(p).filter(r => rScore(r) >= 15);
const pMsOverdue = m => m.status !== "completed" && daysTo(m.date) < 0;
function pNextMs(p) {
  return p.ms.filter(m => m.status !== "completed").sort((a,b) => a.date < b.date ? -1 : 1)[0] || null;
}
/* Rot ist teuer: es bedeutet Handlungsbedarf auf Leitungsebene. Ein einzelnes
   kritisches Risiko in einem Projekt im Plan ist noch kein roter Status. */
function pHealth(p) {
  if (p.status === "completed" || p.status === "cancelled") return "green";
  if (p.status === "delayed" || p.ms.some(pMsOverdue) || pCritRisks(p).length >= 2) return "red";
  if (p.status === "at_risk" || pCritRisks(p).length || pOverdueTasks(p).length) return "amber";
  return "green";
}
const healthCls = h => h === "red" ? "bad" : h === "amber" ? "warn" : "ok";
/* Die Gesamtlage als Ampel, immer beschriftet: eine Farbe allein sagt nicht,
   wofür sie steht. */
/* Warum die Ampel so steht, wie sie steht. Eine Farbe ohne Begründung führt zu
   Rückfragen statt zu Entscheidungen. */
function healthWhy(p) {
  const r = [];
  const ms = p.ms.filter(pMsOverdue).length, cr = pCritRisks(p).length, ot = pOverdueTasks(p).length;
  if (p.status === "delayed" || p.status === "cancelled") r.push(t("why_status", { s:t("ps_" + p.status) }));
  if (ms) r.push(t("why_ms", { n:ms }));
  /* Einzahl ist kein Schönheitsfehler: „1 kritische Risiken" liest sich wie
     ein Fehler in der Zählung und untergräbt das Vertrauen in die Zahl. */
  if (cr) r.push(cr === 1 ? t("why_risk1") : t("why_risk", { n:cr }));
  if (ot) r.push(ot === 1 ? t("why_task1") : t("why_task", { n:ot }));
  return r.length ? r.join(" · ") : t("why_ok");
}

/* Was die eigene Rolle in diesem Projekt erlaubt — positiv formuliert. Wer
   liest, er dürfe nichts, meldet auch nichts. */
function roleHint(p) {
  if (pCanEdit(p)) return "";
  /* Zwei Gründe, warum hier nichts zu ändern ist: der Lesezugang oder ein
     archiviertes Projekt. Beide sollen dastehen, nicht erraten werden. */

}
