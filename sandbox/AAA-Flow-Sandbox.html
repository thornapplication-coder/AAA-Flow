<meta charset="utf-8">
<title>AAA Flow Sandbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ============================================================================
   AAA Flow — Sandbox v1
   Klickbarer Prototyp der Vorgangsakte. Keine Persistenz, Daten im Speicher.
   Farben, Typografie und Chrome übernommen aus AAA-Flow-Sandbox-v0.html.
   Prüfpunkt-Katalog, Rechte und Sperrlogik gespiegelt aus supabase/migrations.
   ========================================================================== */
:root{
  --navy-900:#0C1B2E;
  --navy-800:#12283F;
  --navy-700:#1B3A5A;
  --navy-600:#26507A;
  --navy-500:#3A6796;
  --navy-400:#5B84B1;
  --line:#DDE4EC;
  --line-strong:#C3CFDD;
  --paper:#F1F4F8;
  --surface:#FFFFFF;
  --surface-2:#FAFCFE;
  --ink:#132132;
  --ink-soft:#5A6B7F;
  --ink-faint:#8A9AAC;
  --open:#8FA3BC;
  --work:#B87514;      --work-bg:#FDF3E2;
  --done:#26714F;      --done-bg:#E6F2EC;
  --late:#A83A2A;      --late-bg:#FBECE9;
  --exc:#5C4B8A;       --exc-bg:#EFEBF7;
  --focus:#4A90D9;
  --r:6px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);background:var(--paper);color:var(--ink);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Chrome ---------- */
.app{display:grid;grid-template-columns:212px 1fr;grid-template-rows:56px 1fr;height:100vh}
.topbar{grid-column:1/-1;background:var(--navy-900);display:flex;align-items:center;gap:18px;padding:0 20px;color:#fff}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:600;letter-spacing:-.01em;font-size:16px}
.brand span{color:var(--navy-400);font-weight:400;font-size:12px;letter-spacing:.04em}
.topbar .spacer{flex:1}
.ctl{display:flex;align-items:center;gap:8px}
.ctl label{color:#9DB4CC;font-size:12px;white-space:nowrap}
.ctl select{background:var(--navy-800);color:#fff;border:1px solid #24405F;border-radius:var(--r);padding:5px 8px;font-size:13px;max-width:260px}
.lang{display:flex;border:1px solid #24405F;border-radius:var(--r);overflow:hidden}
.lang button{padding:5px 11px;font-size:12px;font-weight:600;color:#9DB4CC}
.lang button.on{background:var(--navy-600);color:#fff}

.side{background:var(--navy-800);padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.side button{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--r);color:#A9C0D6;font-size:13.5px;text-align:left;width:100%}
.side button:hover{background:#1A3552}
.side button.on{background:var(--navy-600);color:#fff;font-weight:600}
.side .count{font-size:11px;background:rgba(255,255,255,.14);padding:1px 6px;border-radius:9px;font-variant-numeric:tabular-nums}
.side .count.alert{background:#7A3A2C;color:#FFD9D1}
.side .grp{color:#5B7794;font-size:11px;padding:14px 12px 5px;letter-spacing:.03em}
.side .who{margin-top:auto;padding:12px;border-top:1px solid #1E3A57;color:#7E9AB6;font-size:11.5px;line-height:1.45}
.side .who b{display:block;color:#C6D8E8;font-size:12.5px;font-weight:600}

.main{overflow-y:auto;padding:22px 24px 60px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap}
.hd h1{font-size:21px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.hd p{color:var(--ink-soft);font-size:13px;margin-top:3px;max-width:66ch}

/* ---------- Vorgangsbahn ---------- */
.track{background:var(--navy-900);border-radius:8px;padding:16px 18px 14px;margin-bottom:20px;display:flex;align-items:stretch;overflow-x:auto}
.stage{flex:1;min-width:106px;padding:0 4px}
.stage button{width:100%;text-align:left;padding:8px 10px;border-radius:var(--r);display:block}
.stage button:hover{background:rgba(255,255,255,.06)}
.stage button.on{background:rgba(255,255,255,.11)}
.stage .n{font-size:27px;font-weight:600;color:#fff;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stage .lb{font-size:11.5px;color:#8FAAC6;margin-top:2px}
.stage .late{font-size:11.5px;color:#F0A192;margin-top:5px;display:flex;align-items:center;gap:5px}
.stage .late i{width:6px;height:6px;border-radius:50%;background:#E0705C;display:inline-block}
.gatebar{width:90px;flex:0 0 90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative}
.gatebar::before,.gatebar::after{content:"";position:absolute;left:50%;width:1px;background:#24405F}
.gatebar::before{top:0;height:14px}
.gatebar::after{bottom:0;height:14px}
.gatebar .g{font-size:10.5px;color:#7E9AB6;letter-spacing:.05em;text-align:center;line-height:1.35;border:1px solid #24405F;border-radius:3px;padding:4px 7px;background:var(--navy-800);width:100%}
.gatebar .g b{display:block;color:#C6D8E8;font-size:11.5px;font-weight:600}
.gatebar.block .g{border-color:#7A3A2C;background:#2A1815}
.gatebar.block .g b{color:#F0A192}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.kpi .n{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .lb{font-size:12px;color:var(--ink-soft);margin-top:2px}
.kpi.warn .n{color:var(--late)}
.kpi.ok .n{color:var(--done)}

/* ---------- Filter ---------- */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 10px;min-width:230px}
.filters select{border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 9px;background:#fff}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);cursor:pointer}
.filters .clear{color:var(--navy-600);font-size:13px;text-decoration:underline;padding:6px 2px}
.fcount{color:var(--ink-faint);font-size:12.5px;margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- Tabelle ---------- */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-soft);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #EDF1F6;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F7FAFD}
.num{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap}
.tn{font-weight:600}
.co{color:var(--ink-soft);font-size:12.5px}
.pill{display:inline-block;padding:2px 8px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-open{background:#EEF2F7;color:#5A6B7F}
.p-work{background:var(--work-bg);color:var(--work)}
.p-done{background:var(--done-bg);color:var(--done)}
.p-late{background:var(--late-bg);color:var(--late)}
.p-pool{background:#E8F0FA;color:var(--navy-600)}
.p-exc{background:var(--exc-bg);color:var(--exc)}
.type{font-family:var(--mono);font-size:12px;background:#EEF2F7;padding:2px 6px;border-radius:3px}
.prog{display:flex;align-items:center;gap:7px}
.prog .bar{width:52px;height:5px;background:#E6ECF3;border-radius:3px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--navy-600)}
.prog span{font-size:11.5px;color:var(--ink-soft);font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{padding:44px 20px;text-align:center;color:var(--ink-soft)}
.empty b{display:block;color:var(--ink);margin-bottom:5px;font-size:15px}
.wait{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--work)}

/* ---------- Drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,27,46,.42);opacity:0;pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(780px,96vw);background:var(--surface);box-shadow:-14px 0 40px rgba(12,27,46,.2);transform:translateX(101%);transition:transform .2s ease;display:flex;flex-direction:column;z-index:5}
.drawer.on{transform:none}
.dhd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.dhd h2{font-size:17px;font-weight:600}
.dhd .meta{color:var(--ink-soft);font-size:12.5px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dhd .x{font-size:22px;color:var(--ink-faint);line-height:1;padding:2px 6px;margin-left:auto}
.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.tabs button{padding:11px 13px;font-size:13.5px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--navy-700);border-bottom-color:var(--navy-600);font-weight:600}
.dbody{flex:1;overflow-y:auto;padding:18px 20px 40px}

/* ---------- Gate-Panel ---------- */
.gate{border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.gate>header{padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gate>header h3{font-size:14px;font-weight:600;flex:1;min-width:200px}
.gate>header .hint{font-size:11.5px;color:var(--ink-faint)}
.gate.locked .cp{opacity:.55}
.gate.released{border-color:#BFDBCB}
.gate.released>header{background:var(--done-bg);border-bottom-color:#BFDBCB}
.gate>header .fold{font-size:11.5px;color:var(--navy-600);text-decoration:underline;white-space:nowrap}
.gate.folded>header{border-bottom:none}

.cp{display:flex;align-items:flex-start;gap:11px;padding:10px 14px;border-bottom:1px solid #F0F4F8}
.cp:last-of-type{border-bottom:none}
.cp .box{width:19px;height:19px;flex:0 0 19px;margin-top:1px;border:1.5px solid var(--line-strong);border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transition:background .12s,border-color .12s}
.cp .box:hover:not(:disabled){border-color:var(--navy-500)}
.cp .box:disabled{background:#F2F5F9}
.cp .box.half{background:var(--work);border-color:var(--work)}
.cp .box.full{background:var(--done);border-color:var(--done)}
.cp .box.exc{background:var(--exc);border-color:var(--exc);font-size:10px}
.cp .txt{flex:1;font-size:13.5px;min-width:0}
.cp.done .txt>.lbl{color:var(--ink-soft)}
.cp.excepted .txt>.lbl{text-decoration:line-through;text-decoration-color:var(--exc);color:var(--ink-soft)}
.cp .lbl{display:block}
.cp .opt{color:var(--ink-faint);font-weight:400;font-size:11.5px}
.cp .sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}
.cp .sub>span:not(:last-child)::after{content:"·";margin-left:8px;color:var(--line-strong)}
.cp .sub .due.late{color:var(--late);font-weight:600}
.cp .four{font-family:var(--mono);font-size:10.5px;background:#EEF2F7;color:var(--navy-600);padding:0 4px;border-radius:3px;font-weight:600}
.cp .why{font-size:11.5px;margin-top:4px;color:var(--late);display:flex;gap:5px;align-items:flex-start}
.cp .why.neutral{color:var(--ink-faint)}
.cp .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cp .acts button{font-size:11.5px;border:1px solid var(--line-strong);border-radius:4px;padding:2px 8px;color:var(--navy-600);background:#fff}
.cp .acts button:hover{border-color:var(--navy-500);background:var(--surface-2)}
.cp .acts button.warn{color:var(--work);border-color:#E8CDA0;background:var(--work-bg)}
.cp .state{flex:0 0 auto;margin-top:1px}

.rel{padding:11px 14px;background:#F7FAFD;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid #EDF1F6}
.rel .btn{background:var(--navy-600);color:#fff;padding:7px 14px;border-radius:var(--r);font-size:13px;font-weight:600}
.rel .btn:hover:not(:disabled){background:var(--navy-700)}
.rel .btn:disabled{background:#C3CFDD}
.rel .note{font-size:12px;color:var(--ink-soft)}
.rel .note b{color:var(--late)}
.rel .done{font-size:12px;color:var(--done)}

.notice{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--navy-600);border-radius:var(--r);padding:11px 13px;font-size:12.5px;color:var(--ink-soft);margin-bottom:16px}
.notice b{color:var(--ink)}
.notice.warn{border-left-color:var(--late);background:var(--late-bg);border-color:#F0D5CF;color:#7C3427}
.notice.warn b{color:#7C3427}
.notice .lnk{color:var(--navy-600);text-decoration:underline;font-weight:600}

/* ---------- Kommunikation ---------- */
.ctx{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ctx button{border:1px solid var(--line-strong);border-radius:14px;padding:5px 12px;font-size:12.5px;color:var(--ink-soft);background:#fff}
.ctx button.on{background:var(--navy-700);border-color:var(--navy-700);color:#fff;font-weight:600}
.ctx button .b{background:#E0705C;color:#fff;border-radius:8px;padding:0 5px;font-size:10.5px;margin-left:5px;font-variant-numeric:tabular-nums}
.msg{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #F0F4F8}
.av{width:29px;height:29px;flex:0 0 29px;border-radius:5px;background:var(--navy-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.av.s{background:#6B4E9E}.av.t{background:#1F6E5A}.av.a{background:#B0641A}.av.d{background:var(--navy-700)}
.msg .who{font-size:13px;font-weight:600}
.msg .dept{font-size:11px;color:var(--ink-faint);font-weight:400}
.msg .tm{font-size:11px;color:var(--ink-faint);margin-left:auto}
.msg .row{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.msg .body{font-size:13.5px;margin-top:3px;overflow-wrap:anywhere}
.msg .body .tag{background:#EEF2F7;border-radius:3px;padding:1px 5px;font-size:12px;color:var(--navy-600);font-weight:600}
.msg .ref{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:11.5px;color:var(--navy-600);background:#EEF2F7;border-radius:4px;padding:2px 7px}
.msg .edited{font-size:11px;color:var(--ink-faint);font-style:italic}
.msg .edit{font-size:11.5px;color:var(--navy-600);text-decoration:underline;margin-top:4px}
.composer{border:1px solid var(--line-strong);border-radius:8px;margin-top:14px;overflow:hidden}
.composer textarea{width:100%;border:none;padding:11px 12px;resize:vertical;min-height:66px;font-size:13.5px;display:block}
.composer footer{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface-2);border-top:1px solid var(--line);flex-wrap:wrap}
.composer .send{background:var(--navy-600);color:#fff;padding:6px 15px;border-radius:var(--r);font-size:13px;font-weight:600;margin-left:auto}
.composer .keep{font-size:11.5px;color:var(--ink-faint);max-width:46ch}
.composer select{border:1px solid var(--line-strong);border-radius:4px;padding:4px 6px;font-size:12px;background:#fff}

/* ---------- Audit ---------- */
.log{font-size:12.5px}
.log .e{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #F0F4F8}
.log .t{font-family:var(--mono);color:var(--ink-faint);flex:0 0 96px;font-size:11.5px}
.log b{font-weight:600}
.log .rsn{display:block;color:var(--ink-soft);font-style:italic;margin-top:2px}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(12,27,46,.5);z-index:20;padding:20px}
.modal.on{display:flex}
.modal .card{background:var(--surface);border-radius:9px;width:min(480px,100%);padding:20px;box-shadow:0 20px 60px rgba(12,27,46,.3)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:6px}
.modal p{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px}
.modal textarea{width:100%;border:1px solid var(--line-strong);border-radius:var(--r);padding:9px 11px;min-height:88px;font-size:13.5px;resize:vertical}
.modal .err{color:var(--late);font-size:12px;margin-top:6px;min-height:16px}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.modal .btns button{padding:7px 14px;border-radius:var(--r);font-size:13px;font-weight:600;border:1px solid var(--line-strong)}
.modal .btns .go{background:var(--navy-600);color:#fff;border-color:var(--navy-600)}
.modal .btns .go:hover{background:var(--navy-700)}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--navy-900);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:30;max-width:min(560px,92vw);box-shadow:0 10px 30px rgba(12,27,46,.35)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:#7C2D20}

/* ---------- Ausnahmen-Liste ---------- */
.exlist{display:grid;gap:10px}
.excard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 15px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.excard .m{flex:1;min-width:240px}
.excard .rsn{font-size:13px;margin-top:5px}
.excard .sub{font-size:11.5px;color:var(--ink-faint);margin-top:4px}
.excard .acts{display:flex;gap:7px}
.excard .acts button{padding:6px 12px;border-radius:var(--r);font-size:12.5px;font-weight:600;border:1px solid var(--line-strong)}
.excard .acts .ok{background:var(--navy-600);color:#fff;border-color:var(--navy-600)}

.adm{display:grid;gap:12px}
.admtbl th:first-child,.admtbl td:first-child{width:34%}

@media(max-width:1000px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:16px 14px 50px}
  .ctl label{display:none}
}
</style>

<div class="app">
  <div class="topbar">
    <div class="brand">AAA Flow <span id="brandSub">Sandbox</span></div>
    <div class="spacer"></div>
    <div class="ctl">
      <label id="lblRole" for="role">Angemeldet als</label>
      <select id="role"></select>
    </div>
    <div class="lang">
      <button data-l="de" class="on">DE</button>
      <button data-l="en">EN</button>
    </div>
  </div>
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<div class="modal" id="modal">
  <div class="card">
    <h3 id="mTitle"></h3>
    <p id="mText"></p>
    <textarea id="mInput"></textarea>
    <div class="err" id="mErr"></div>
    <div class="btns">
      <button id="mCancel"></button>
      <button class="go" id="mOk"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================================
   AAA Flow — Sandbox v1
   Die Sperrlogik unten spiegelt supabase/migrations/20260902000300_logic.sql.
   Weicht der Prototyp von der Datenbank ab, gilt die Datenbank.
   ========================================================================== */

/* ---------- i18n ---------- */
const I = {
de:{
  sub:"Sandbox — Demodaten", loggedIn:"Angemeldet als",
  nav_dash:"Dashboard", nav_pool:"Pool", nav_mine:"Meine Vorgänge", nav_all:"Alle Vorgänge",
  nav_exc:"Ausnahmen", nav_admin:"Admin", grp_work:"Arbeit", grp_org:"Organisation",

const iso = d => d.toISOString().slice(0,10);
const D = n => { const d = new Date(); d.setDate(d.getDate() + n); return iso(d); };
function addBusinessDays(dateStr, days) {
  if (!dateStr) return null;
  const d = new Date(dateStr); const step = Math.sign(days); let left = Math.abs(days);
  while (left > 0) { d.setDate(d.getDate() + step); const w = d.getDay(); if (w !== 0 && w !== 6) left--; }
  return iso(d);
}
const daysTo = s => Math.round((new Date(s) - new Date(iso(new Date()))) / 864e5);
function fmtDate(s) {
  return new Date(s).toLocaleDateString(L === "de" ? "de-AT" : "en-GB", { day:"2-digit", month:"short" });
}
function fmtStart(c) {
  if (!c.course_start) return "—";
  const n = daysTo(c.course_start), s = fmtDate(c.course_start);
  if (n === 0) return s + " · " + t("today");
  return s + " · " + (n > 0 ? t("in_") + " " + n + " " + t("days") : Math.abs(n) + " " + t("days") + " " + t("ago"));
}

function mk(o) {
  const c = Object.assign({

    owner: { sales:null, training_admin:null, ato:null }, poolSince: {}, status:"enquiry"
  }, o);
  CAT.forEach(x => {
    const done = (o.done || []).includes(x.id);
    const wait = (o.wait || []).includes(x.id);
    c.cp[x.id] = {
      state: done ? "verified" : wait ? "completed" : "open",
      by: (done || wait) ? (o.byMap && o.byMap[x.id]) || c.owner[x.d] || "u3" : null,
      vby: done && x.f ? (o.vbyMap && o.vbyMap[x.id]) || "u3" : null,
      due: null
    };
  });
  return c;
}
function recomputeDue(c) {
  CAT.forEach(x => {
    const anchor = x.a === "enquiry_date" ? c.enquiry_date : x.a === "course_end" ? c.course_end : c.course_start;
    c.cp[x.id].due = anchor ? addBusinessDays(anchor, x.a === "course_start" ? -x.days : x.days) : null;
  });
}

/* ---------- Sichtbarkeit und Zuständigkeit ---------- */
function canView(c) {
  const u = M();
  if (isAdmin(u) || u.dept !== "sales") return true;
  if (u.role === "teamleader" || u.fn === "sales_lead") return true;
  if (c.owner.sales === u.id) return true;
  return u.types.includes(c.type);
}
const visibleCases = () => CASES.filter(canView);

/* ---------- Ableitungen ---------- */
const approvedExc = (c, cpId) => c.exc.some(e => e.cp === cpId && e.status === "approved");
const pendingExc = (c, cpId) => c.exc.some(e => e.cp === cpId && e.status === "requested");
const cpDone = (c, x) => c.cp[x.id].state === "verified" || approvedExc(c, x.id);
const cpOverdue = (c, x) => c.cp[x.id].state !== "verified" && c.cp[x.id].due
  && daysTo(c.cp[x.id].due) < 0 && !approvedExc(c, x.id) && c.status !== "completed";
const openMandatory = (c, g, exclude) =>
  CAT.filter(x => x.g === g && x.m && x.id !== exclude && !cpDone(c, x));

function gateState(c, g) {
  if (c.gate[g].released) return "done";
  const items = CAT.filter(x => x.g === g);
  if (items.some(x => cpOverdue(c, x))) return "overdue";
  if (items.some(x => c.cp[x.id].state !== "open" || approvedExc(c, x.id))) return "in_progress";
  return "open";
}
function caseState(c) {
  if (c.status === "completed") return "done";
  if (c.status === "discarded") return "discarded";
  if (CAT.some(x => cpOverdue(c, x))) return "overdue";
  if (CAT.some(x => c.cp[x.id].state !== "open")) return "in_progress";
  return "open";
}
const isLate = c => caseState(c) === "overdue";
function currentGate(c) {
  if (c.status === "completed" || c.status === "discarded") return null;
  return c.gate[1].released ? (c.gate[2].released ? 3 : 2) : 1;
}
function nextTask(c) {
  const g = currentGate(c); if (!g) return null;
  const items = openMandatory(c, g).sort((a,b) => {
    const da = c.cp[a.id].due, db = c.cp[b.id].due;
    if (da && db) return da < db ? -1 : 1;
    return da ? -1 : db ? 1 : 0;
  });
  return items[0] || null;
}
function progress(c) {
  const m = CAT.filter(x => x.m);
  return Math.round(m.filter(x => cpDone(c, x)).length / m.length * 100);
}

/* ---------- Regeln: erledigen, kontrollieren, freigeben ---------- */
function canComplete(c, x) {
  const u = M(), s = c.cp[x.id];
  if (c.status === "completed" || c.status === "discarded") return { ok:false, why:t("lock_closed") };
  if (s.state !== "open") return { ok:false };
  if (approvedExc(c, x.id)) return { ok:false };
  if (x.g > 1 && !c.gate[x.g - 1].released) return { ok:false, why:t("lock_prev", { n:x.g - 1 }) };
  if (!isAdmin(u)) {
    if (u.dept !== x.d) return { ok:false, why:t("lock_dept", { d:DEPTS[x.d] }) };
    if (!isResponsible(c, x.d)) return { ok:false, why:t("lock_notmine", { d:DEPTS[x.d] }) };
  }
  if (x.needsGate) {
    const open = openMandatory(c, x.g, x.id);
    if (open.length) return { ok:false, why:t("lock_g3", { n:open.length }), hard:true };
  }
  return { ok:true };
}
function canVerify(c, x) {
  const u = M(), s = c.cp[x.id];
  if (!x.f || s.state !== "completed") return { ok:false };
  if (s.by === me) return { ok:false, why:t("lock_own") };
  if (!isAdmin(u) && u.dept !== x.d) return { ok:false, why:t("lock_wrongdept", { d:DEPTS[x.d] }) };
  return { ok:true };
}
function canReset(c, x) {
  const u = M(), s = c.cp[x.id];
  if (s.state === "open" || c.gate[x.g].released) return false;
  return isAdmin(u) || (u.dept === x.d && (isResponsible(c, x.d) || u.role === "teamleader"));
}
function canRequestException(c, x) {
  const u = M();
  if (cpDone(c, x) || pendingExc(c, x.id)) return false;
  if (c.gate[x.g].released) return false;
  return isAdmin(u) || (u.dept === x.d && (isResponsible(c, x.d) || u.role === "teamleader"));
}
function canRelease(c, g) {
  const u = M(), recv = GATE_RECEIVER[g];
  if (c.gate[g].released) return { ok:false };
  if (c.status === "completed" || c.status === "discarded") return { ok:false, why:t("lock_closed") };
  if (g > 1 && !c.gate[g - 1].released) return { ok:false, why:t("lock_relprev", { n:g - 1 }) };
  if (!isAdmin(u) && !(u.dept === recv && (isResponsible(c, recv) || u.role === "teamleader")))
    return { ok:false, why:t("lock_relwho", { n:g, d:DEPTS[recv] }) };
  if (g === 1 && !c.course_start) return { ok:false, why:t("lock_reldate") };
  if (g === 3 && (!c.course_end || daysTo(c.course_end) > 0)) return { ok:false, why:t("lock_relend") };
  const open = openMandatory(c, g);
  if (open.length) return { ok:false, why:t("lock_relopen", { n:open.length }) };
  return { ok:true };
}

/* ---------- Aktionen ---------- */
function syncStatus(c) {

  else if (c.gate[2].released) c.status = (c.course_start && daysTo(c.course_start) <= 0) ? "in_progress" : "released";

  else c.status = "enquiry";

}

function doTake(c) {

/* ---------- Modal ---------- */
let modalOk = null;
function openModal({ title, text, value, placeholder, min, err, okLabel }) {
  const m = document.getElementById("modal");
  document.getElementById("mTitle").textContent = title;
  document.getElementById("mText").textContent = text;
  const inp = document.getElementById("mInput");
  inp.value = value || ""; inp.placeholder = placeholder || "";
  document.getElementById("mErr").textContent = "";
  document.getElementById("mCancel").textContent = t("cancel");
  document.getElementById("mOk").textContent = okLabel || t("ok");
  m.classList.add("on"); inp.focus();
  modalOk = () => {
    const v = inp.value.trim();
    if (v.length < min) { document.getElementById("mErr").textContent = err; return; }
    m.classList.remove("on");
    const cb = modalOk.cb; modalOk = null; cb(v);
  };
  return fn => { modalOk.cb = fn; };
}
document.getElementById("mOk").onclick = () => modalOk && modalOk();
document.getElementById("mCancel").onclick = () => { document.getElementById("modal").classList.remove("on"); modalOk = null; };
document.getElementById("modal").onclick = e => {
  if (e.target.id === "modal") { document.getElementById("modal").classList.remove("on"); modalOk = null; }
};

/* ---------- Render: Vorgangsbahn ---------- */
function trackHTML() {
  const vis = visibleCases();
  const stages = [["enquiry","st_enquiry"],["booked","st_booked"],["in_progress","st_in_progress"],["completed","st_completed"]];
  let h = '<div class="track">';
  stages.forEach(([k,lb], i) => {
    if (i > 0) {
      const g = i;
      const blocked = vis.filter(c => !c.gate[g].released && currentGate(c) === g && gateState(c,g) === "overdue").length;
      h += `<div class="gatebar ${blocked ? "block" : ""}">
        <div class="g"><b>${t("gate")} ${g}</b>${t("g" + g)}${blocked ? `<br>${blocked} ${t("overdue")}` : ""}</div></div>`;
    }
    const set = vis.filter(c => k === "in_progress" ? (c.status === "released" || c.status === "in_progress") : c.status === k);
    const late = set.filter(isLate).length;
    h += `<div class="stage"><button data-stage="${k}" class="${F.status === k ? "on" : ""}">
      <div class="n">${set.length}</div><div class="lb">${t(lb)}</div>
      ${late ? `<div class="late"><i></i>${late} ${t("overdue")}</div>` : ""}</button></div>`;
  });
  return h + "</div>";
}

}
function filtered(base) {
  return base.filter(c => {
    if (F.q) {
      const q = F.q.toLowerCase();
      if (!(c.trainee + c.co + c.no + c.type + c.course).toLowerCase().includes(q)) return false;
    }
    if (F.type && c.type !== F.type) return false;
    if (F.status && c.status !== F.status) return false;
    if (F.owner && !Object.values(c.owner).includes(F.owner)) return false;
    if (F.dept) { const nt = nextTask(c); if (!nt || nt.d !== F.dept) return false; }
    if (F.late && !isLate(c)) return false;
    if (F.pool && !inMyPool(c)) return false;
    return true;
  });
}

  const map = { open:"p-open", in_progress:"p-work", done:"p-done", overdue:"p-late", discarded:"p-open" };

  return `<span class="pill ${map[s]}">${lbl[s]}</span>`;

}

            <div class="sub">${t("ex_by")} ${esc(user(e.by).name)}, ${e.at}${
              e.decBy ? ` · ${t("ex_dec")} ${esc(user(e.decBy).name)}, ${e.decAt}` : ""}</div>
          </div>
          ${e.status === "requested" && canDecideExceptions(M()) ? `<div class="acts">

/* ---------- Render: Vorgangsakte ---------- */
function cpHTML(c, x) {
  const s = c.cp[x.id];
  const exc = approvedExc(c, x.id), pend = pendingExc(c, x.id);
  const comp = canComplete(c, x), ver = canVerify(c, x);
  const overdue = cpOverdue(c, x);
  const state = exc ? "excepted" : s.state === "verified" ? "done" : s.state === "completed" ? "waiting" : overdue ? "late" : "open";

  let boxCls = "", boxTxt = "", boxDis = true, act = "";
  if (exc) { boxCls = "exc"; boxTxt = "A"; }
  else if (s.state === "verified") { boxCls = "full"; boxTxt = "✓"; }
  else if (s.state === "completed") {
    boxCls = "half"; boxTxt = "✓";
    if (ver.ok) { boxDis = false; act = "verify"; }
  } else if (comp.ok) { boxDis = false; act = "complete"; }

  const sub = [];
  sub.push(`<span>${DEPTS[x.d]}</span>`);
  if (!x.m) sub.push(`<span class="opt">optional</span>`);
  if (x.f) sub.push(`<span class="four">${t("fourEyes")}</span>`);
  if (s.due) sub.push(`<span class="due${overdue ? " late" : ""}">${t("deadline")} ${fmtDate(s.due)}</span>`);
  if (x.ev) sub.push(`<span>${t("evidence")}: ${esc(x.ev)}</span>`);
  if (s.by) sub.push(`<span>${t("by")} ${esc(user(s.by).name)}</span>`);
  if (s.vby) sub.push(`<span>${t("verifiedBy")} ${esc(user(s.vby).name)}</span>`);

  const why = [];
  if (!exc && s.state === "completed" && !ver.ok && ver.why) why.push({ txt:ver.why, neutral:ver.why === t("lock_own") });
  if (!exc && s.state === "open" && comp.why) why.push({ txt:comp.why, neutral:!comp.hard && !overdue });
  if (pend) why.push({ txt:(L === "de" ? "Ausnahme beantragt, Entscheidung offen" : "Exception requested, decision pending"), neutral:true });

  const acts = [];
  if (!exc && s.state === "completed" && ver.ok) acts.push(`<button data-verify="${x.id}">${t("verify")}</button>`);
  if (!exc && canReset(c, x)) acts.push(`<button class="warn" data-reset="${x.id}">${t("reset")}</button>`);
  if (canRequestException(c, x)) acts.push(`<button data-exc="${x.id}">${t("exception")}</button>`);

  const chip = { excepted:`<span class="pill p-exc">${t("excepted")}</span>`,
                 done:`<span class="pill p-done">${t("done")}</span>`,
                 waiting:`<span class="pill p-work">${t("waiting")}</span>`,
                 late:`<span class="pill p-late">${t("late")}</span>`,
                 open:`<span class="pill p-open">${t("open")}</span>` }[state];

  return `<div class="cp ${s.state === "verified" ? "done" : ""} ${exc ? "excepted" : ""}">
    <button class="box ${boxCls}" ${boxDis ? "disabled" : ""} data-${act}="${x.id}"
      aria-label="${esc(x[L])}" title="${esc(x[L])}">${boxTxt}</button>
    <span class="txt">
      <span class="lbl">${esc(x[L])}</span>
      <span class="sub">${sub.join("")}</span>
      ${why.map(w => `<span class="why ${w.neutral ? "neutral" : ""}">↳ ${esc(w.txt)}</span>`).join("")}
      ${acts.length ? `<span class="acts">${acts.join("")}</span>` : ""}
    </span>
    <span class="state">${chip}</span>
  </div>`;
}
function gateHTML(c, g) {
  const st = gateState(c, g), rel = canRelease(c, g);
  const items = CAT.filter(x => x.g === g);
  const recv = GATE_RECEIVER[g];
  const open = openMandatory(c, g).length;
  const locked = g > 1 && !c.gate[g - 1].released;
  /* Ein freigegebenes Gate ist abgearbeitet und startet eingeklappt, damit die
     offene Arbeit oben steht. Aufklappen bleibt jederzeit möglich. */
  const folded = c.gate[g].released && !expanded.has(c.id + ":" + g);
  return `<div class="gate ${locked ? "locked" : ""} ${c.gate[g].released ? "released" : ""} ${folded ? "folded" : ""}">
    <header>
      <h3>${t("gate")} ${g} — ${t("g" + g)}</h3>
      ${stateChip(st)}
      <span class="hint">${t("accepts")} ${DEPTS[recv]}</span>
      ${c.gate[g].released ? `<button class="fold" data-fold="${g}">${folded ? t("fold_open") : t("fold_close")}</button>` : ""}
    </header>
    ${folded ? "" : items.map(x => cpHTML(c, x)).join("")}
    <div class="rel">
      ${c.gate[g].released
        ? `<span class="done">✓ ${t("released")} ${esc(user(c.gate[g].by).name)}${c.gate[g].at ? ", " + fmtDate(c.gate[g].at) : ""}</span>`
        : `<button class="btn" ${rel.ok ? "" : "disabled"} data-rel="${g}">${t("release")}</button>
           <span class="note">${open ? `<b>${open}</b> ${open === 1 ? t("need1") : t("need")}` : t("allDone")}${
             rel.ok ? "" : rel.why ? ` · ${esc(rel.why)}` : ""}</span>`}
    </div>
  </div>`;
}

            } <button class="lnk" id="dtake">${t("take")}</button></div>` : "")
          + (g3warn ? `<div class="notice warn"><b>${t("k_g3")}:</b> ${t("notice_g3")}</div>` : "")
          + [1,2,3].map(g => gateHTML(c, g)).join("")
        : dtab === "chat" ? chatHTML(c) : logHTML(c)}</div>`;
  d.classList.add("on"); d.setAttribute("aria-hidden","false");
  document.getElementById("scrim").classList.add("on");
  wireDrawer();
}

/* ---------- Wiring ---------- */
function wireMain() {
  const q = id => document.getElementById(id);
  if (q("fq")) {
    q("fq").oninput = e => { F.q = e.target.value; renderMain();
      const el = q("fq"); el.focus(); el.setSelectionRange(F.q.length, F.q.length); };
    q("ftype").onchange   = e => { F.type = e.target.value; renderMain(); };
    q("fstatus").onchange = e => { F.status = e.target.value; renderMain(); };
    q("fdept").onchange   = e => { F.dept = e.target.value; renderMain(); };
    q("fowner").onchange  = e => { F.owner = e.target.value; renderMain(); };
    q("flate").onchange   = e => { F.late = e.target.checked; renderMain(); };
    q("fpool").onchange   = e => { F.pool = e.target.checked; renderMain(); };
    q("fclear").onclick   = () => { F = { q:"", type:"", status:"", dept:"", owner:"", late:false, pool:false }; renderMain(); };
  }
  document.querySelectorAll("[data-stage]").forEach(b => b.onclick = () => {
    F.status = F.status === b.dataset.stage ? "" : b.dataset.stage; renderMain();
  });
  document.querySelectorAll("[data-take]").forEach(b => b.onclick = e => {
    e.stopPropagation(); doTake(CASES.find(c => c.id === b.dataset.take));
  });
  document.querySelectorAll("[data-exok]").forEach(b => b.onclick = () => {
    const [cid, eid] = b.dataset.exok.split("|"); const c = CASES.find(x => x.id === cid);
    doDecideException(c, c.exc.find(e => e.id === eid), true);
  });
  document.querySelectorAll("[data-exno]").forEach(b => b.onclick = () => {
    const [cid, eid] = b.dataset.exno.split("|"); const c = CASES.find(x => x.id === cid);
    doDecideException(c, c.exc.find(e => e.id === eid), false);
  });
  document.querySelectorAll("tbody tr[data-id]").forEach(tr => tr.onclick = () => {
    drawerCase = CASES.find(c => c.id === tr.dataset.id); dtab = "gates"; chatScope = "case"; renderDrawer();
  });
}
function wireDrawer() {
  const c = drawerCase;
  document.getElementById("dx").onclick = closeDrawer;
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { dtab = b.dataset.tab; renderDrawer(); });
  document.querySelectorAll("[data-complete]").forEach(b => b.onclick = () => doComplete(c, cat(b.dataset.complete)));
  document.querySelectorAll("[data-verify]").forEach(b => b.onclick = () => doVerify(c, cat(b.dataset.verify)));
  document.querySelectorAll("[data-rel]").forEach(b => b.onclick = () => doRelease(c, +b.dataset.rel));
  document.querySelectorAll("[data-fold]").forEach(b => b.onclick = () => {
    const k = c.id + ":" + b.dataset.fold;
    expanded.has(k) ? expanded.delete(k) : expanded.add(k);
    renderDrawer();
  });
  document.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => {
    const x = cat(b.dataset.reset);
    openModal({ title:t("m_res_t"), text:t("m_res_p") + " — " + x[L], min:5, err:t("m_res_e"), okLabel:t("ok") })
      (reason => doReset(c, x, reason));
  });
  document.querySelectorAll("[data-exc]").forEach(b => b.onclick = () => {
    const x = cat(b.dataset.exc);
    openModal({ title:t("m_exc_t"), text:t("m_exc_p") + " — " + x[L], min:10, err:t("m_exc_e"), okLabel:t("request") })
      (reason => doRequestException(c, x, reason));
  });
  const tk = document.getElementById("dtake");
  if (tk) tk.onclick = () => doTake(c);
  document.querySelectorAll("[data-sc]").forEach(b => b.onclick = () => { chatScope = b.dataset.sc; renderDrawer(); });
  document.querySelectorAll("[data-editmsg]").forEach(b => b.onclick = () => {
    const m = c.chat.find(x => x.id === b.dataset.editmsg);
    const plain = m.txt.replace(/<[^>]+>/g, "");
    openModal({ title:t("m_edit_t"), text:t("m_edit_p"), value:plain, min:1, err:t("m_edit_e"), okLabel:t("save") })(v => {
      m.history.push({ body:m.txt, by:me, at:L === "de" ? "gerade" : "just now" });
      m.txt = esc(v); m.edited = true;
      lg(c, me, L === "de" ? "Nachricht bearbeitet" : "Message edited", null, L === "de" ? "gerade" : "just now");
      toast(t("t_edited")); render();
    });
  });
  const sd = document.getElementById("csend");
  if (sd) sd.onclick = () => {
    const ta = document.getElementById("cmsg");
    if (!ta.value.trim()) return;
    const ref = document.getElementById("cref").value || null;
    c.chat.push({ id:"m" + Math.random().toString(36).slice(2,7), scope:chatScope, uid:me,
      txt:esc(ta.value.trim()), when:L === "de" ? "gerade" : "just now", ref, edited:false, history:[] });
    lg(c, me, (L === "de" ? "Nachricht hinzugefügt — " : "Message added — ") + t("ctx_" + (chatScope === "company" ? "co" : chatScope)),
       null, L === "de" ? "gerade" : "just now");
    toast(t("t_msg")); render();
  };
}
function closeDrawer() { drawerCase = null; renderDrawer(); }
document.getElementById("scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.getElementById("modal").classList.contains("on")) {
    document.getElementById("modal").classList.remove("on"); modalOk = null;
  } else closeDrawer();
});
document.getElementById("role").onchange = e => { me = e.target.value; render(); };
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  L = b.dataset.l; document.documentElement.lang = L;
  document.querySelectorAll(".lang button").forEach(x => x.classList.toggle("on", x === b));
  render();
});
document.getElementById("side").addEventListener("click", e => {
  const b = e.target.closest("[data-v]"); if (!b) return;
  view = b.dataset.v; renderMain(); renderSide();
});

function render() { renderTop(); renderSide(); renderMain(); renderDrawer(); }
render();
/* Startzustand: die Vorgangsakte mit der Gate-3-Sperre ist offen, damit der
   Kern des Modells ohne Suchen sichtbar ist. */
drawerCase = CASES[6]; dtab = "gates"; renderDrawer();
</script>
