<meta charset="utf-8">
<title>AAA Flow Sandbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* ============================================================================
   AAA Flow — Sandbox v2
   Klickbarer Prototyp. Keine Persistenz, Daten im Speicher; ein Neuladen
   stellt den Ausgangszustand wieder her.
   Farben, Typografie und Chrome aus AAA-Flow-Sandbox-v0.html.
   Sperrlogik, Rechte und Prüfpunkt-Katalog gespiegelt aus supabase/migrations.
   Desktop ist Leitplattform, Tablet und Handy sind reduziert (Spec Abschnitt 3).
   ========================================================================== */
:root{
  --navy-900:#0C1B2E; --navy-800:#12283F; --navy-700:#1B3A5A;
  --navy-600:#26507A; --navy-500:#3A6796; --navy-400:#5B84B1;
  --line:#DDE4EC; --line-strong:#C3CFDD;
  --paper:#F1F4F8; --surface:#FFFFFF; --surface-2:#FAFCFE;
  --ink:#132132; --ink-soft:#5A6B7F; --ink-faint:#8A9AAC;
  --open:#8FA3BC;
  --work:#B87514; --work-bg:#FDF3E2;
  --done:#26714F; --done-bg:#E6F2EC;
  --late:#A83A2A; --late-bg:#FBECE9;
  --exc:#5C4B8A;  --exc-bg:#EFEBF7;
  --focus:#4A90D9;
  --r:6px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Chrome ---------- */
.app{display:grid;grid-template-columns:212px 1fr;grid-template-rows:56px auto 1fr;height:100vh}
.topbar{grid-column:1/-1;background:var(--navy-900);display:flex;align-items:center;gap:14px;padding:0 16px;color:#fff}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:600;letter-spacing:-.01em;font-size:16px;white-space:nowrap}
.brand span{color:var(--navy-400);font-weight:400;font-size:12px;letter-spacing:.04em}
.topbar .spacer{flex:1}
.ctl{display:flex;align-items:center;gap:8px;min-width:0}
.ctl label{color:#9DB4CC;font-size:12px;white-space:nowrap}
.ctl select{background:var(--navy-800);color:#fff;border:1px solid #24405F;border-radius:var(--r);padding:5px 8px;font-size:13px;max-width:min(280px,42vw)}
.lang{display:flex;border:1px solid #24405F;border-radius:var(--r);overflow:hidden;flex:0 0 auto}
.lang button{padding:5px 11px;font-size:12px;font-weight:600;color:#9DB4CC}
.lang button.on{background:var(--navy-600);color:#fff}

.side{grid-column:1;grid-row:2/4;background:var(--navy-800);padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.side button{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--r);color:#A9C0D6;font-size:13.5px;text-align:left;width:100%}
.side button:hover{background:#1A3552}
.side button.on{background:var(--navy-600);color:#fff;font-weight:600}
.side .count{font-size:11px;background:rgba(255,255,255,.14);padding:1px 6px;border-radius:9px;font-variant-numeric:tabular-nums}
.side .count.alert{background:#7A3A2C;color:#FFD9D1}
.side .grp{color:#5B7794;font-size:11px;padding:14px 12px 5px;letter-spacing:.03em}
.side .who{margin-top:auto;padding:12px;border-top:1px solid #1E3A57;color:#7E9AB6;font-size:11.5px;line-height:1.45}
.side .who b{display:block;color:#C6D8E8;font-size:12.5px;font-weight:600}

.workspace{grid-column:2;grid-row:3;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.mobnav{grid-column:2;grid-row:2;display:none;gap:6px;padding:9px 12px;background:var(--navy-800);overflow-x:auto}
.mobnav button{color:#A9C0D6;font-size:13px;padding:6px 12px;border-radius:14px;white-space:nowrap;border:1px solid #24405F}
.mobnav button.on{background:var(--navy-600);color:#fff;font-weight:600;border-color:var(--navy-600)}
.mobnav .count{font-size:11px;margin-left:5px;font-variant-numeric:tabular-nums}
.mobnav .count.alert{color:#F0A192;font-weight:700}

.main{padding:22px 24px 96px;flex:1;min-width:0}
.hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap}
.hd h1{font-size:21px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.hd p{color:var(--ink-soft);font-size:13px;margin-top:3px;max-width:66ch}
.btn-primary{background:var(--navy-600);color:#fff;padding:8px 15px;border-radius:var(--r);font-size:13.5px;font-weight:600;white-space:nowrap}
.btn-primary:hover{background:var(--navy-700)}
.btn-ghost{border:1px solid var(--line-strong);background:#fff;color:var(--navy-600);padding:7px 13px;border-radius:var(--r);font-size:13px;font-weight:600}
.btn-ghost:hover{border-color:var(--navy-500);background:var(--surface-2)}

/* ---------- Vorgangsbahn ---------- */
.track{background:var(--navy-900);border-radius:8px;padding:16px 18px 14px;margin-bottom:20px;display:flex;align-items:stretch;overflow-x:auto}
.stage{flex:1;min-width:104px;padding:0 4px}
.stage button{width:100%;text-align:left;padding:8px 10px;border-radius:var(--r);display:block}
.stage button:hover{background:rgba(255,255,255,.06)}
.stage button.on{background:rgba(255,255,255,.11)}
.stage .n{font-size:27px;font-weight:600;color:#fff;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stage .lb{font-size:11.5px;color:#8FAAC6;margin-top:2px}
.stage .late{font-size:11.5px;color:#F0A192;margin-top:5px;display:flex;align-items:center;gap:5px}
.stage .late i{width:6px;height:6px;border-radius:50%;background:#E0705C;display:inline-block}
.gatebar{width:90px;flex:0 0 90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative}
.gatebar::before,.gatebar::after{content:"";position:absolute;left:50%;width:1px;background:#24405F}
.gatebar::before{top:0;height:14px}
.gatebar::after{bottom:0;height:14px}
.gatebar .g{font-size:10.5px;color:#7E9AB6;letter-spacing:.05em;text-align:center;line-height:1.35;border:1px solid #24405F;border-radius:3px;padding:4px 7px;background:var(--navy-800);width:100%}
.gatebar .g b{display:block;color:#C6D8E8;font-size:11.5px;font-weight:600}
.gatebar.block .g{border-color:#7A3A2C;background:#2A1815}
.gatebar.block .g b{color:#F0A192}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.kpi .n{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .lb{font-size:12px;color:var(--ink-soft);margin-top:2px}
.kpi.warn .n{color:var(--late)}
.kpi.ok .n{color:var(--done)}

/* ---------- Filter ---------- */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 10px;min-width:230px;flex:1 1 230px;max-width:340px}
.filters select{border:1px solid var(--line-strong);border-radius:var(--r);padding:7px 9px;background:#fff}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.filters .clear,.filters .more{color:var(--navy-600);font-size:13px;text-decoration:underline;padding:6px 2px}
.fcount{color:var(--ink-faint);font-size:12.5px;margin-left:auto;font-variant-numeric:tabular-nums}
.filters .more{display:none}

/* ---------- Tabelle ---------- */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-soft);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #EDF1F6;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr[data-id]{cursor:pointer}
tbody tr[data-id]:hover{background:#F7FAFD}
.num{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap}
.tn{font-weight:600}
.co{color:var(--ink-soft);font-size:12.5px}
.pill{display:inline-block;padding:2px 8px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-open{background:#EEF2F7;color:#5A6B7F}
.p-work{background:var(--work-bg);color:var(--work)}
.p-done{background:var(--done-bg);color:var(--done)}
.p-late{background:var(--late-bg);color:var(--late)}
.p-pool{background:#E8F0FA;color:var(--navy-600)}
.p-exc{background:var(--exc-bg);color:var(--exc)}
.type{font-family:var(--mono);font-size:12px;background:#EEF2F7;padding:2px 6px;border-radius:3px;white-space:nowrap}
.prog{display:flex;align-items:center;gap:7px}
.prog .bar{width:52px;height:5px;background:#E6ECF3;border-radius:3px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--navy-600)}
.prog span{font-size:11.5px;color:var(--ink-soft);font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{padding:44px 20px;text-align:center;color:var(--ink-soft)}
.empty b{display:block;color:var(--ink);margin-bottom:5px;font-size:15px}

/* ---------- Kartenliste (Handy) ---------- */
.cards{display:none;gap:10px;flex-direction:column}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:13px 14px;cursor:pointer}
.card:active{background:#F7FAFD}
.card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h4{font-size:15px;font-weight:600;margin-top:5px}
.card .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .next{font-size:12.5px;color:var(--ink-soft);margin-top:7px;padding-top:7px;border-top:1px solid #F0F4F8}
.card .next b{color:var(--ink);font-weight:600}
.card .foot{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}

/* ---------- Drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,27,46,.42);opacity:0;pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(780px,96vw);background:var(--surface);box-shadow:-14px 0 40px rgba(12,27,46,.2);transform:translateX(101%);transition:transform .2s ease;display:flex;flex-direction:column;z-index:5}
.drawer.on{transform:none}
.dhd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.dhd h2{font-size:17px;font-weight:600}
.dhd .meta{color:var(--ink-soft);font-size:12.5px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dhd .x{font-size:22px;color:var(--ink-faint);line-height:1;padding:2px 8px}
.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--surface-2);overflow-x:auto}
.tabs button{padding:11px 13px;font-size:13.5px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--navy-700);border-bottom-color:var(--navy-600);font-weight:600}
.dbody{flex:1;overflow-y:auto;padding:18px 20px 96px}

/* ---------- Gate-Panel ---------- */
.gate{border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.gate>header{padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gate>header h3{font-size:14px;font-weight:600;flex:1;min-width:180px}
.gate>header .hint{font-size:11.5px;color:var(--ink-faint)}
.gate>header .fold{font-size:11.5px;color:var(--navy-600);text-decoration:underline;white-space:nowrap}
.gate.folded>header{border-bottom:none}
.gate.locked .cp{opacity:.55}
.gate.released{border-color:#BFDBCB}
.gate.released>header{background:var(--done-bg);border-bottom-color:#BFDBCB}

.cp{display:flex;align-items:flex-start;gap:11px;padding:10px 14px;border-bottom:1px solid #F0F4F8}
.cp:last-of-type{border-bottom:none}
.cp .box{width:19px;height:19px;flex:0 0 19px;margin-top:1px;border:1.5px solid var(--line-strong);border-radius:4px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transition:background .12s,border-color .12s}
.cp .box:hover:not(:disabled){border-color:var(--navy-500)}
.cp .box:disabled{background:#F2F5F9}
.cp .box.half{background:var(--work);border-color:var(--work)}
.cp .box.full{background:var(--done);border-color:var(--done)}
.cp .box.exc{background:var(--exc);border-color:var(--exc);font-size:10px}
.cp .txt{flex:1;font-size:13.5px;min-width:0}
.cp.done .txt>.lbl{color:var(--ink-soft)}
.cp.excepted .txt>.lbl{text-decoration:line-through;text-decoration-color:var(--exc);color:var(--ink-soft)}
.cp .lbl{display:block}
.cp .opt{color:var(--ink-faint);font-size:11.5px}
.cp .sub{font-size:11.5px;color:var(--ink-faint);margin-top:2px;display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}
.cp .sub>span:not(:last-child)::after{content:"·";margin-left:8px;color:var(--line-strong)}
.cp .sub .due.late{color:var(--late);font-weight:600}
.cp .four{font-family:var(--mono);font-size:10.5px;background:#EEF2F7;color:var(--navy-600);padding:0 4px;border-radius:3px;font-weight:600}
.cp .why{font-size:11.5px;margin-top:4px;color:var(--late);display:block}
.cp .why.neutral{color:var(--ink-faint)}
.cp .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cp .acts button{font-size:11.5px;border:1px solid var(--line-strong);border-radius:4px;padding:3px 9px;color:var(--navy-600);background:#fff}
.cp .acts button:hover{border-color:var(--navy-500);background:var(--surface-2)}
.cp .acts button.warn{color:var(--work);border-color:#E8CDA0;background:var(--work-bg)}
.cp .state{flex:0 0 auto;margin-top:1px}

.rel{padding:11px 14px;background:#F7FAFD;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid #EDF1F6}
.rel .btn{background:var(--navy-600);color:#fff;padding:7px 14px;border-radius:var(--r);font-size:13px;font-weight:600}
.rel .btn:hover:not(:disabled){background:var(--navy-700)}
.rel .btn:disabled{background:#C3CFDD}
.rel .note{font-size:12px;color:var(--ink-soft)}
.rel .note b{color:var(--late)}
.rel .done{font-size:12px;color:var(--done)}

.notice{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--navy-600);border-radius:var(--r);padding:11px 13px;font-size:12.5px;color:var(--ink-soft);margin-bottom:16px}
.notice b{color:var(--ink)}
.notice.warn{border-left-color:var(--late);background:var(--late-bg);border-color:#F0D5CF;color:#7C3427}
.notice.warn b{color:#7C3427}
.notice .lnk{color:var(--navy-600);text-decoration:underline;font-weight:600}

/* ---------- Kommunikation ---------- */
.ctx{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ctx button{border:1px solid var(--line-strong);border-radius:14px;padding:5px 12px;font-size:12.5px;color:var(--ink-soft);background:#fff}
.ctx button.on{background:var(--navy-700);border-color:var(--navy-700);color:#fff;font-weight:600}
.ctx button .b{background:#E0705C;color:#fff;border-radius:8px;padding:0 5px;font-size:10.5px;margin-left:5px;font-variant-numeric:tabular-nums}
.msg{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #F0F4F8}
.av{width:29px;height:29px;flex:0 0 29px;border-radius:5px;background:var(--navy-600);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.av.s{background:#6B4E9E}.av.t{background:#1F6E5A}.av.a{background:#B0641A}.av.d{background:var(--navy-700)}
.msg .who{font-size:13px;font-weight:600}
.msg .dept{font-size:11px;color:var(--ink-faint);font-weight:400}
.msg .tm{font-size:11px;color:var(--ink-faint);margin-left:auto}
.msg .row{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.msg .body{font-size:13.5px;margin-top:3px;overflow-wrap:anywhere}
.msg .body .tag{background:#EEF2F7;border-radius:3px;padding:1px 5px;font-size:12px;color:var(--navy-600);font-weight:600}
.msg .ref{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:11.5px;color:var(--navy-600);background:#EEF2F7;border-radius:4px;padding:2px 7px}
.msg .case{font-size:11px;color:var(--ink-faint);font-family:var(--mono)}
.msg .edited{font-style:italic}
.msg .edit{font-size:11.5px;color:var(--navy-600);text-decoration:underline;margin-top:4px}
.composer{border:1px solid var(--line-strong);border-radius:8px;margin-top:14px;overflow:hidden}
.composer textarea{width:100%;border:none;padding:11px 12px;resize:vertical;min-height:66px;font-size:13.5px;display:block}
.composer footer{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface-2);border-top:1px solid var(--line);flex-wrap:wrap}
.composer .send{background:var(--navy-600);color:#fff;padding:6px 15px;border-radius:var(--r);font-size:13px;font-weight:600;margin-left:auto}
.composer .keep{font-size:11.5px;color:var(--ink-faint);max-width:44ch}
.composer select{border:1px solid var(--line-strong);border-radius:4px;padding:4px 6px;font-size:12px;background:#fff;max-width:100%}

/* ---------- Audit ---------- */
.log{font-size:12.5px}
.log .e{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #F0F4F8}
.log .t{font-family:var(--mono);color:var(--ink-faint);flex:0 0 92px;font-size:11.5px}
.log b{font-weight:600}
.log .rsn{display:block;color:var(--ink-soft);font-style:italic;margin-top:2px}

/* ---------- Dialog ---------- */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(12,27,46,.5);z-index:20;padding:16px}
.modal.on{display:flex}
.modal .card{background:var(--surface);border-radius:9px;width:min(520px,100%);max-height:92vh;overflow-y:auto;padding:20px;box-shadow:0 20px 60px rgba(12,27,46,.3);cursor:default}
.modal h3{font-size:16px;font-weight:600;margin-bottom:6px}
.modal .lead{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{grid-column:1/-1}
.fld.half{grid-column:auto}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line-strong);border-radius:var(--r);padding:8px 10px;font-size:13.5px;background:#fff}
.fld textarea{min-height:84px;resize:vertical}
.fld .hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px}
.modal .err{color:var(--late);font-size:12px;margin-top:8px;min-height:16px}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.modal .btns button{padding:8px 15px;border-radius:var(--r);font-size:13px;font-weight:600;border:1px solid var(--line-strong)}
.modal .btns .go{background:var(--navy-600);color:#fff;border-color:var(--navy-600)}
.modal .btns .go:hover{background:var(--navy-700)}

/* ---------- Druck- und Exportdokument ---------- */
.hdacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#print{display:none;position:fixed;inset:0;z-index:60;background:#fff;overflow-y:auto}
#print.on{display:block}
.pbar{position:sticky;top:0;background:var(--navy-900);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;z-index:2}
.pbar .ttl{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.pbar button{border:1px solid #24405F;color:#C6D8E8;border-radius:var(--r);padding:6px 13px;font-size:13px;font-weight:600}

/* ---------- Sichtbarkeit und Zuständigkeit ---------- */
function canView(c) {

  if (u.role === "teamleader" || holds(u, "sales_lead")) return true;

  return u.types.includes(c.type);
}
const visibleCases = () => CASES.filter(canView);

const isMine = c => Object.values(c.owner).includes(me);
const inMyPool = c => !c.owner[M().dept] && canView(c);

/* ---------- Ableitungen ---------- */
const approvedExc = (c, cpId) => c.exc.some(e => e.cp === cpId && e.status === "approved");
const pendingExc  = (c, cpId) => c.exc.some(e => e.cp === cpId && e.status === "requested");
const cpDone = (c, x) => c.cp[x.id].state === "verified" || approvedExc(c, x.id);
const cpOverdue = (c, x) => c.cp[x.id].state !== "verified" && c.cp[x.id].due
  && daysTo(c.cp[x.id].due) < 0 && !approvedExc(c, x.id) && c.status !== "completed";
const openMandatory = (c, g, exclude) => caseCat(c).filter(x => x.g === g && x.m && x.id !== exclude && !cpDone(c, x));

function gateState(c, g) {
  if (c.gate[g].released) return "done";
  const items = caseCat(c).filter(x => x.g === g);
  if (items.some(x => cpOverdue(c, x))) return "overdue";
  if (items.some(x => c.cp[x.id].state !== "open" || approvedExc(c, x.id))) return "in_progress";
  return "open";
}
function caseState(c) {
  if (c.status === "completed") return "done";
  if (c.status === "discarded") return "discarded";
  if (caseCat(c).some(x => cpOverdue(c, x))) return "overdue";
  if (caseCat(c).some(x => c.cp[x.id].state !== "open")) return "in_progress";
  return "open";
}
const isLate = c => caseState(c) === "overdue";
const currentGate = c => (c.status === "completed" || c.status === "discarded") ? null
  : c.gate[1].released ? (c.gate[2].released ? 3 : 2) : 1;
function nextTask(c) {
  const g = currentGate(c); if (!g) return null;
  return openMandatory(c, g).sort((a,b) => {
    const da = c.cp[a.id].due, db = c.cp[b.id].due;
    if (da && db) return da < db ? -1 : da > db ? 1 : 0;
    return da ? -1 : db ? 1 : 0;
  })[0] || null;
}
const progress = c => {
  const m = caseCat(c).filter(x => x.m);
  return Math.round(m.filter(x => cpDone(c, x)).length / m.length * 100);
};
/* Ungelesene Nachrichten je Kontextebene */
const unread = (scope, id) => thread(scope, id).filter(m => m.uid !== me && !m.seen.includes(me)).length;
const markRead = (scope, id) => thread(scope, id).forEach(m => { if (!m.seen.includes(me)) m.seen.push(me); });

/* ---------- Regeln ---------- */
function canComplete(c, x) {
  const u = M(), s = c.cp[x.id];
  if (c.status === "completed" || c.status === "discarded") return { ok:false, why:t("lock_closed") };
  if (s.state !== "open" || approvedExc(c, x.id)) return { ok:false };
  if (x.g > 1 && !c.gate[x.g - 1].released) return { ok:false, why:t("lock_prev", { n:x.g - 1 }) };
  if (!isAdmin(u)) {
    if (u.dept !== x.d) return { ok:false, why:t("lock_dept", { d:DEPTS[x.d] }) };
    if (!isResponsible(c, x.d)) return { ok:false, why:t("lock_notmine", { d:DEPTS[x.d] }) };
  }
  if (x.roleReq === "teamleader" && !isAdmin(u) && u.role !== "teamleader")
    return { ok:false, why:t("lock_role") };
  /* Vorbedingung: ein bestimmter Prüfpunkt muss erledigt sein */
  if (x.dep) {
    const dep = cat(x.dep);
    if (dep && c.catIds.includes(dep.id) && !cpDone(c, dep))
      return { ok:false, why:t("lock_dep", { s:dep[L] }), hard:true };
  }
  /* Sperrender Prüfpunkt weiter oben im selben Gate */
  const items = caseCat(c).filter(y => y.g === x.g);
  const blocker = items.slice(0, items.indexOf(x)).find(y => y.blocks && !cpDone(c, y));
  if (blocker) return { ok:false, why:t("lock_blocked", { s:blocker[L] }), hard:true };
  if (x.needsGate) {
    const open = openMandatory(c, x.g, x.id);
    if (open.length) return { ok:false, why:t("lock_g3", { n:open.length }), hard:true };
  }
  return { ok:true };
}
function canVerify(c, x) {
  const u = M(), s = c.cp[x.id];
  if (!x.f || s.state !== "completed") return { ok:false };
  if (s.by === me) return { ok:false, why:t("lock_own") };
  if (!isAdmin(u) && u.dept !== x.d) return { ok:false, why:t("lock_wrongdept", { d:DEPTS[x.d] }) };
  return { ok:true };
}
function canReset(c, x) {
  const u = M(), s = c.cp[x.id];
  if (s.state === "open" || c.gate[x.g].released) return false;
  return isAdmin(u) || (u.dept === x.d && (isResponsible(c, x.d) || u.role === "teamleader"));
}
function canRequestException(c, x) {
  const u = M();
  if (cpDone(c, x) || pendingExc(c, x.id) || c.gate[x.g].released) return false;
  return isAdmin(u) || (u.dept === x.d && (isResponsible(c, x.d) || u.role === "teamleader"));
}
function canRelease(c, g) {
  const u = M(), recv = GATE_RECEIVER[g];
  if (c.gate[g].released) return { ok:false };
  if (c.status === "completed" || c.status === "discarded") return { ok:false, why:t("lock_closed") };
  if (g > 1 && !c.gate[g - 1].released) return { ok:false, why:t("lock_relprev", { n:g - 1 }) };
  if (!isAdmin(u) && !(u.dept === recv && (isResponsible(c, recv) || u.role === "teamleader")))
    return { ok:false, why:t("lock_relwho", { n:g, d:DEPTS[recv] }) };
  if (g === 1 && !c.course_start) return { ok:false, why:t("lock_reldate") };
  if (g === 3 && (!c.course_end || daysTo(c.course_end) > 0)) return { ok:false, why:t("lock_relend") };
  const open = openMandatory(c, g);
  if (open.length) return { ok:false, why:t("lock_relopen", { n:open.length }) };
  return { ok:true };
}

/* ---------- Aktionen ---------- */
function syncStatus(c) {
  if (c.gate[3].released) c.status = "completed";
  else if (c.gate[2].released) c.status = (c.course_start && daysTo(c.course_start) <= 0) ? "in_progress" : "released";
  else if (c.gate[1].released) c.status = "booked";
  else c.status = "enquiry";
}
function doComplete(c, x, note) {
  const r = canComplete(c, x);
  if (!r.ok) return toast(r.why || t("lock_closed"), true);
  const s = c.cp[x.id];
  s.by = me;
  if (note) s.note = note;
  if (x.f) { s.state = "completed"; toast(t("t_wait")); } else { s.state = "verified"; toast(t("t_done")); }
  lg(c, me, (L === "de" ? "Prüfpunkt erledigt: " : "Checkpoint completed: ") + x[L], null, now());
  render();
}
function doVerify(c, x) {
  const r = canVerify(c, x);
  if (!r.ok) return toast(r.why || "", true);
  c.cp[x.id].state = "verified"; c.cp[x.id].vby = me;
  lg(c, me, (L === "de" ? "Prüfpunkt kontrolliert: " : "Checkpoint checked: ") + x[L], null, now());
  toast(t("t_verified")); render();
}
function doReset(c, x, reason) {
  Object.assign(c.cp[x.id], { state:"open", by:null, vby:null });
  lg(c, me, (L === "de" ? "Prüfpunkt zurückgesetzt: " : "Checkpoint reset: ") + x[L], reason, now());
  toast(t("t_reset")); render();
}
function doRelease(c, g) {
  const r = canRelease(c, g);
  if (!r.ok) return toast(r.why || "", true);
  c.gate[g] = { released:true, by:me, at:today() };
  syncStatus(c);
  lg(c, me, "Gate " + g + (L === "de" ? " freigegeben" : " released"), null, now());
  toast(t("t_released", { n:g })); render();
}
function doTake(c) {
  const d = M().dept;
  c.owner[d] = me; delete c.poolSince[d];
  lg(c, me, (L === "de" ? "Vorgang aus dem Pool übernommen — " : "Case taken from pool — ") + DEPTS[d], null, now());
  toast(t("t_taken")); render();
}
function doRequestException(c, x, reason) {
  addExc(c, x.id, reason, me, "requested", null, now());
  lg(c, me, (L === "de" ? "Ausnahme beantragt — " : "Exception requested — ") + x[L], reason, now());

}
function doDecideException(c, e, approve) {
  e.status = approve ? "approved" : "rejected"; e.decBy = me; e.decAt = now();
  lg(c, me, (approve ? (L === "de" ? "Ausnahme freigegeben — " : "Exception approved — ")

}

/* ---------- Dialog ----------
   build(values) liefert die Felder; Felder mit reactive:true zeichnen den
   Dialog beim Ändern neu, damit abhängige Felder erscheinen.               */
let dlg = null;
function openDialog(cfg) { dlg = { cfg, values: Object.assign({}, cfg.values) }; renderDialog(); }
function closeDialog() { document.getElementById("modal").classList.remove("on"); dlg = null; }
function renderDialog(err) {
  if (!dlg) return;
  const a = document.activeElement;
  const keep = a && a.dataset && a.dataset.f
    ? { name:a.dataset.f, pos:(a.selectionStart != null ? a.selectionStart : null) } : null;
  const { cfg, values } = dlg;
  const fields = cfg.build(values);
  document.getElementById("mTitle").textContent = cfg.title;
  document.getElementById("mText").textContent = cfg.text || "";
  document.getElementById("mErr").textContent = err || "";
  document.getElementById("mCancel").textContent = t("cancel");
  document.getElementById("mOk").textContent = cfg.okLabel || t("ok");
  document.getElementById("mBody").innerHTML = fields.map(f => {
    if (f.type === "note") return `<div class="fld"><div class="notice" style="margin:0">${esc(f.label)}</div></div>`;
    const v = values[f.name] == null ? "" : values[f.name];
    const inner =
      f.type === "toggle"
        ? `<label class="tgl"><input type="checkbox" data-f="${f.name}" ${v ? "checked" : ""} ${f.disabled ? "disabled" : ""}
             ${f.reactive ? 'data-reactive="1"' : ""}><span>${esc(f.text || "")}</span></label>`
      : f.type === "checks"
        ? `<div class="checks">${f.options.map(o => `<label><input type="checkbox" data-fm="${f.name}"
             value="${esc(o.v)}" ${(v || []).includes(o.v) ? "checked" : ""} ${f.disabled ? "disabled" : ""}> ${esc(o.l)}</label>`).join("")}</div>`
      : f.type === "select"
        ? `<select data-f="${f.name}" ${f.disabled ? "disabled" : ""} ${f.reactive ? 'data-reactive="1"' : ""}>${
            f.options.map(o => `<option value="${esc(o.v)}" ${String(o.v) === String(v) ? "selected" : ""}>${esc(o.l)}</option>`).join("")}</select>`
      : f.type === "textarea"
        ? `<textarea data-f="${f.name}" placeholder="${esc(f.placeholder || "")}">${esc(v)}</textarea>`
        : `<input type="${f.type || "text"}" data-f="${f.name}" value="${esc(v)}"
             placeholder="${esc(f.placeholder || "")}" ${f.disabled ? "disabled" : ""}
             ${f.reactive ? 'data-reactive="1"' : ""} ${f.list ? `list="${f.list}"` : ""}>`;
    return `<div class="fld${f.half ? " half" : ""}">
      ${f.type === "toggle" ? `<label>${esc(f.label)}</label>` : `<label for="">${esc(f.label)}</label>`}${inner}
      ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}
      ${f.list ? `<datalist id="${f.list}">${(f.listOptions || []).map(o => `<option value="${esc(o)}"></option>`).join("")}</datalist>` : ""}
    </div>`;
  }).join("");
  document.getElementById("modal").classList.add("on");
  document.querySelectorAll("#mBody [data-f]").forEach(el => {
    const handler = e => {
      dlg.values[el.dataset.f] = el.type === "checkbox" ? el.checked : e.target.value;
      if (el.dataset.reactive) renderDialog();
    };
    el.oninput = handler; el.onchange = handler;
  });
  document.querySelectorAll("#mBody [data-fm]").forEach(el => el.onchange = () => {
    const n = el.dataset.fm;
    dlg.values[n] = Array.from(document.querySelectorAll(`#mBody [data-fm="${n}"]:checked`)).map(x => x.value);
  });
  /* Reaktive Felder zeichnen den Dialog neu — Fokus und Schreibmarke halten */
  if (keep && keep.name) {
    const el = document.querySelector(`#mBody [data-f="${keep.name}"]`);
    if (el) { el.focus(); if (keep.pos != null && el.setSelectionRange) { try { el.setSelectionRange(keep.pos, keep.pos); } catch (e) {} } }
  } else {
    const first = document.querySelector("#mBody [data-f]");
    if (first && !err) first.focus();
  }
}

/* Vorgang anlegen */
/* Wer darf welches Datum setzen (Spec Abschnitt 6): das Anfragedatum gehört
   Sales, Kursbeginn und Kursende gehören Training Admin. */
const mayEnquiry = c => { const u = M();
  return isAdmin(u) || (u.dept === "sales" && (!c || u.role === "teamleader" || isResponsible(c, "sales"))); };
const mayCourseDates = c => { const u = M();
  return isAdmin(u) || (u.dept === "training_admin" && (!c || u.role === "teamleader" || isResponsible(c, "training_admin"))); };
const findCo = n => COMPANIES.find(x => x.name.toLowerCase() === (n || "").trim().toLowerCase());
const findTr = (n, coId) => TRAINEES.find(x => x.co === coId && x.name.toLowerCase() === (n || "").trim().toLowerCase());

/* Katalog nach Änderung von Muster oder Kurstyp nachziehen: neu zutreffende
   Punkte kommen dazu, nicht mehr zutreffende fallen weg, solange sie unberührt
   sind — bereits bearbeitete Punkte bleiben in der Akte. */
function syncCatalogue(c) {
  const should = applicableCat(c);
  should.forEach(id => {
    if (!c.catIds.includes(id)) { c.catIds.push(id); c.cp[id] = { state:"open", by:null, vby:null, due:null, note:null }; }
  });
  c.catIds = c.catIds.filter(id => should.includes(id) || (c.cp[id] && c.cp[id].state !== "open"));
  recomputeDue(c);
}

/* Felder für Anlegen und Bearbeiten. Firma und Trainee sind Schreibfelder mit
   Vorschlagsliste: ein bekannter Name wird übernommen, ein unbekannter neu
   angelegt. */
function caseFields(v, o) {
  const co = findCo(v.company);
  const newCo = (v.company || "").trim().length > 1 && !co;
  const tr = co ? findTr(v.trainee, co.id) : null;
  const newTr = (v.trainee || "").trim().length > 1 && !tr;
  const f = [];
  if (o.isNew) {
    f.push({ name:"company", label:t("f_company"), type:"text", reactive:true, list:"lstCo",
      listOptions:COMPANIES.map(x => x.name).sort(), placeholder:t("ph_company"),
      hint:newCo ? t("hint_newco") : t("hint_combo") });
    f.push({ name:"trainee", label:t("f_trainee"), type:"text", reactive:true, list:"lstTr",
      listOptions:co ? TRAINEES.filter(x => x.co === co.id).map(x => x.name).sort() : [],
      placeholder:t("ph_trainee"), hint:newTr ? t("hint_newtr") : t("hint_combo") });
    if (newTr) f.push({ name:"dob", label:t("f_dob"), type:"date", half:true });
  } else {
    f.push({ name:"__who", type:"note", label:`${t("f_company")}: ${v.company}   ·   ${t("f_trainee")}: ${v.trainee}` });
  }
  f.push({ name:"type", label:t("f_aircraft"), type:"select", half:true, disabled:!o.canBase,
    hint:!o.canBase ? t("only_sales") : (M().dept === "sales" && M().role === "staff" ? t("hint_types") : null),
    options:[{ v:"", l:t("opt_pick") }].concat(o.types.slice().sort().map(x => ({ v:x, l:x }))) });
  f.push({ name:"courses", label:t("f_course"), type:"checks", disabled:!o.canBase,
    hint:o.canBase ? t("hint_courses") : t("only_sales"),
    options:COURSE_TYPES.slice().sort().map(x => ({ v:x, l:x })) });
  f.push({ name:"enquiry", label:t("f_enquiry"), type:"date", half:true, disabled:!o.canEnq,
    hint:o.canEnq ? null : t("only_sales") });
  f.push({ name:"start", label:t("f_cstart"), type:"date", half:true, disabled:!o.canTA,
    hint:o.canTA ? null : t("only_ta") });
  f.push({ name:"end", label:t("f_cend"), type:"date", half:true, disabled:!o.canTA });
  f.push({ name:"__hint", label:o.canTA ? t("hint_start") : t("hint_wait_ta"), type:"note" });
  return f;
}
function validateCase(v, o) {
  if (o.isNew) {
    if ((v.company || "").trim().length < 2) return t("e_company");
    if ((v.trainee || "").trim().length < 2) return t("e_trainee");
  }
  if (!v.type) return t("e_aircraft");
  if (!(v.courses || []).length) return t("e_course");
  if (v.end && !v.start) return t("e_endonly");
  if (v.start && v.end && v.end < v.start) return t("e_dates");
  return null;
}

function dialogNewCase() {
  if (!canCreateCase(M())) return toast(t("t_nocreate"), true);
  const types = myTypes();
  const canEnq = mayEnquiry(null), canTA = mayCourseDates(null);
  openDialog({
    title:t("nc_t"), text:t("nc_p"), okLabel:t("create"),
    values:{ company:"", trainee:"", dob:"", type:types.length === 1 ? types[0] : "",
             courses:[], enquiry:today(), start:"", end:"" },
    build: v => caseFields(v, { types, canBase:true, canEnq, canTA, isNew:true }),

/* Stammdaten eines bestehenden Vorgangs ändern — je Feld nach Zuständigkeit */
function dialogEditCase(c) {
  const canBase = mayEnquiry(c), canTA = mayCourseDates(c);
  if (!canBase && !canTA) return toast(t("e_noedit"), true);
  openDialog({
    title:t("ec_t"), text:t("ec_p"), okLabel:t("save"),
    values:{ company:coName(c), trainee:trName(c), type:c.type, courses:(c.courses || []).slice(),
             enquiry:c.enquiry_date, start:c.course_start || "", end:c.course_end || "" },
    build: v => caseFields(v, { types:myTypes(), canBase, canEnq:canBase, canTA, isNew:false }),
    validate: v => validateCase(v, { isNew:false }),
    onSubmit: v => {
      const b = { type:c.type, courses:(c.courses || []).join(", "),
        enquiry:c.enquiry_date, start:c.course_start, end:c.course_end };
      if (canBase) { c.type = v.type; c.courses = v.courses; c.enquiry_date = v.enquiry; }
      if (canTA) { c.course_start = v.start || null; c.course_end = v.end || null; }
      syncCatalogue(c);
      if (b.type !== c.type) c.owner.ato = resolveAto(c.type);
      const ch = [];
      if (b.type !== c.type) ch.push(`${t("f_aircraft")}: ${b.type} → ${c.type}`);
      if (b.courses !== (c.courses || []).join(", ")) ch.push(`${t("f_course")}: ${courseLabel(c)}`);
      if (b.enquiry !== c.enquiry_date) ch.push(`${t("f_enquiry")}: ${fmtDate(c.enquiry_date)}`);
      if (b.start !== c.course_start) ch.push(`${t("f_cstart")}: ${fmtDate(c.course_start)}`);
      if (b.end !== c.course_end) ch.push(`${t("f_cend")}: ${fmtDate(c.course_end)}`);
      if (ch.length) lg(c, me, t("ec_log") + " — " + ch.join(" · "), null, now());
      toast(ch.length ? t("t_caseedit") : t("t_nochange"));
      render();
    }
  });
}

const XLS_KINDS = ["cases","exceptions","catalogue","users","companies","trainees","audit","checkpoints","notes"];

const stateName = s => ({ open:t("open"), in_progress:t("inwork"), done:t("done"),

}
const cpRow = (c, x) => [x.g, x[L], DEPTS[x.d], yn(x.m), yn(x.f), cpStateName(c, x),
  fmtLong(c.cp[x.id].due),
  c.cp[x.id].by ? user(c.cp[x.id].by).name : t("none"),
  c.cp[x.id].vby ? user(c.cp[x.id].vby).name : t("none"),
  c.cp[x.id].note || x.ev || t("none")];
const cpRows = c => caseCat(c).map(x => cpRow(c, x));
const CP_COLS = () => [t("cat_gate"), t("cat_lb"), t("cat_dept"), t("r_mand"), t("fourEyes"),

const auditRows = c => c.log.map(e => [e.when,
  e.who === "system" ? "System" : user(e.who).name, e.txt, e.reason || ""]);
const AUDIT_COLS = () => [t("exp_when"), t("exp_who"), t("exp_what"), t("m_reason")];

function docDef(kind) {
  const vis = visibleCases();

  if (kind === "cases") {
    const base = view === "pool" ? vis.filter(inMyPool) : view === "mine" ? vis.filter(isMine) : vis;
    const rows = filtered(base);

      meta:[[t("exp_filter"), filterDesc()], [t("exp_count"), rows.length]],
      sections:[{ cols:[t("c_no"), t("c_trainee"), t("c_co"), t("c_type"), t("f_course"), t("c_start"),
        t("f_cend"), t("c_status"), t("exp_state"), t("c_prog"), t("c_next"), t("cat_dept"),
        "Sales", "Training Admin", "ATO", t("nav_exc")], rows:caseRows(rows) }] };
  }
  if (kind === "exceptions") {
    const all = [];
    vis.forEach(x => x.exc.forEach(e => all.push([x.no, trName(x), coName(x), x.type, cat(e.cp).g,
      cat(e.cp)[L], DEPTS[cat(e.cp).d], t("ex_" + e.status), e.reason,
      user(e.by).name, e.at, e.decBy ? user(e.decBy).name : t("none"), e.decAt || t("none")])));

        t("fourEyes"), t("r_blocks"), t("r_dep"), t("r_gate"), t("r_role"), t("r_ev"),
        t("cat_dl"), t("cp_anchor"), t("cat_ev"), t("cp_types"), t("cp_courses"), t("r_active")],
        rows:CAT.map(x => [x.g, x.id, x.de, x.en, DEPTS[x.d], yn(x.m), yn(x.f), yn(x.blocks),
          x.dep ? (cat(x.dep) || {})[L] || "?" : t("none"), yn(x.needsGate), yn(x.roleReq), yn(x.evReq),
          x.days == null ? t("none") : x.days, t("anchor_" + x.a), x.ev || t("none"),
          x.types.join(", ") || t("exp_all"), x.courses.join(", ") || t("exp_all"), yn(x.active)]) }] };
  }
  if (kind === "users") {
    return { title:t("admin_t") + " — " + t("a_users"), meta:[[t("exp_count"), USERS.length]],
      sections:[{ cols:[t("usr_name"), t("usr_email"), t("usr_dept"), t("usr_role"), t("usr_types"),
        t("usr_status"), t("set_fn")],
        rows:USERS.slice().sort(byRole).map(x => [x.name, x.email, DEPTS[x.dept], t("role_" + x.role),
          x.types.join(", ") || t("none"),
          x.active === false ? t("r_inactive") : x.invited ? t("usr_invited") : t("r_active"),
          ["director_training","head_of_training","sales_lead"].filter(f => holds(x, f))
            .map(f => t("set_" + { director_training:"dt", head_of_training:"hot", sales_lead:"sl" }[f])).join(", ") || t("none")]) }] };
  }
  if (kind === "notes") {
    const h = noteHost(notesCtx.scope, notesCtx.id);
    return { title:t("notes_t") + " — " + h.name,
      meta:[[notesCtx.scope === "trainee" ? t("ctx_trainee") : t("ctx_company"), h.name],

        rows:(h.notes || []).map(n => [n.at, user(n.by).name, n.text + (n.edited ? " (" + t("edited") + ")" : "")]) }] };

  if (kind === "companies") {

          TRAINEES.filter(y => y.co === x.id).length,

      n:M().name })} · ${t("exp_sandbox")}</div>

}
function openPrint(kind) {

      <button id="pPrint" class="go">${t("exp_print")}</button>

function exportTable(kind) {

    if (sec.h) lines.push(sec.h);
    lines.push(sec.cols.join("\t"));
    sec.rows.forEach(r => lines.push(r.map(v => String(v == null ? "" : v).replace(/[\t\n]/g, " ")).join("\t")));
    lines.push("");
  });
  const tsv = lines.join("\n").trim();
  openDialog({
    title:t("exp_xls_t"), text:t("exp_xls_p"), okLabel:t("exp_copy"),
    values:{ data:tsv },
    build: () => [{ name:"data", label:def.title, type:"textarea" }],
    validate: () => null,
    onSubmit: v => {
      const done = () => toast(t("t_copied"));
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(v.data).then(done, () => toast(t("exp_manual"), true));
      else toast(t("exp_manual"), true);
    }
  });
}

function filtered(base) {
  return base.filter(c => {
    if (F.q) {
      const q = F.q.toLowerCase();
      if (!(trName(c) + coName(c) + c.no + c.type + courseLabel(c)).toLowerCase().includes(q)) return false;
    }
    if (F.type && c.type !== F.type) return false;
    if (F.status && c.status !== F.status) return false;
    if (F.owner && !Object.values(c.owner).includes(F.owner)) return false;
    if (F.dept) { const nt = nextTask(c); if (!nt || nt.d !== F.dept) return false; }
    if (F.late && !isLate(c)) return false;
    if (F.pool && !inMyPool(c)) return false;
    return true;
  });
}

      if (c.status === "completed" || c.status === "discarded") return;

      c.catIds.push(nx.id);

function cpHTML(c, x) {
  const s = c.cp[x.id];
  const exc = approvedExc(c, x.id), pend = pendingExc(c, x.id);
  const comp = canComplete(c, x), ver = canVerify(c, x), overdue = cpOverdue(c, x);
  const state = exc ? "excepted" : s.state === "verified" ? "done"
              : s.state === "completed" ? "waiting" : overdue ? "late" : "open";

  let boxCls = "", boxTxt = "", boxDis = true, act = "x";
  if (exc) { boxCls = "exc"; boxTxt = "A"; }
  else if (s.state === "verified") { boxCls = "full"; boxTxt = "✓"; }
  else if (s.state === "completed") { boxCls = "half"; boxTxt = "✓"; if (ver.ok) { boxDis = false; act = "verify"; } }
  else if (comp.ok) { boxDis = false; act = "complete"; }

  const sub = [`<span>${DEPTS[x.d]}</span>`];
  if (!x.m) sub.push(`<span class="opt">${t("optional")}</span>`);
  if (x.f) sub.push(`<span class="four">${t("fourEyes")}</span>`);
  if (s.due) sub.push(`<span class="due${overdue ? " late" : ""}">${t("deadline")} ${fmtDate(s.due)}</span>`);
  if (x.ev) sub.push(`<span>${t("evidence")}: ${esc(x.ev)}</span>`);
  if (s.by) sub.push(`<span>${t("by")} ${esc(user(s.by).name)}</span>`);
  if (s.vby) sub.push(`<span>${t("verifiedBy")} ${esc(user(s.vby).name)}</span>`);
  if (s.note) sub.push(`<span>${t("note")}: ${esc(s.note)}</span>`);

  const why = [];
  if (!exc && s.state === "completed" && !ver.ok && ver.why) why.push({ txt:ver.why, neutral:ver.why === t("lock_own") });
  if (!exc && s.state === "open" && comp.why) why.push({ txt:comp.why, neutral:!comp.hard && !overdue });
  if (pend) why.push({ txt:L === "de" ? "Ausnahme beantragt, Entscheidung offen" : "Exception requested, decision pending", neutral:true });

  const acts = [];
  if (!exc && s.state === "completed" && ver.ok) acts.push(`<button data-verify="${x.id}">${t("verify")}</button>`);
  if (!exc && canReset(c, x)) acts.push(`<button class="warn" data-reset="${x.id}">${t("reset")}</button>`);
  if (canRequestException(c, x)) acts.push(`<button data-exc="${x.id}">${t("exception")}</button>`);

  const chip = { excepted:`<span class="pill p-exc">${t("excepted")}</span>`,
                 done:`<span class="pill p-done">${t("done")}</span>`,
                 waiting:`<span class="pill p-work">${t("waiting")}</span>`,
                 late:`<span class="pill p-late">${t("late")}</span>`,
                 open:`<span class="pill p-open">${t("open")}</span>` }[state];

  return `<div class="cp ${s.state === "verified" ? "done" : ""} ${exc ? "excepted" : ""}">
    <button class="box ${boxCls}" ${boxDis ? "disabled" : ""} data-${act}="${x.id}" title="${esc(x[L])}"
      aria-label="${esc(x[L])}">${boxTxt}</button>
    <span class="txt">
      <span class="lbl">${esc(x[L])}</span>
      <span class="sub">${sub.join("")}</span>
      ${why.map(w => `<span class="why ${w.neutral ? "neutral" : ""}">↳ ${esc(w.txt)}</span>`).join("")}
      ${acts.length ? `<span class="acts">${acts.join("")}</span>` : ""}
    </span>
    <span class="state">${chip}</span>
  </div>`;
}
function gateHTML(c, g) {
  const st = gateState(c, g), rel = canRelease(c, g);
  const items = caseCat(c).filter(x => x.g === g);
  const recv = GATE_RECEIVER[g];
  const open = openMandatory(c, g).length;
  const locked = g > 1 && !c.gate[g - 1].released;
  /* Ein freigegebenes Gate ist abgearbeitet und startet eingeklappt. */
  const folded = c.gate[g].released && !expanded.has(c.id + ":" + g);
  return `<div class="gate ${locked ? "locked" : ""} ${c.gate[g].released ? "released" : ""} ${folded ? "folded" : ""}">
    <header>
      <h3>${t("gate")} ${g} — ${t("g" + g)}</h3>
      ${stateChip(st)}
      <span class="hint">${t("accepts")} ${DEPTS[recv]}</span>
      ${c.gate[g].released ? `<button class="fold" data-fold="${g}">${folded ? t("fold_open") : t("fold_close")}</button>` : ""}
    </header>
    ${folded ? "" : items.map(x => cpHTML(c, x)).join("")}
    <div class="rel">
      ${c.gate[g].released
        ? `<span class="done">✓ ${t("released")} ${esc(user(c.gate[g].by).name)}${c.gate[g].at ? ", " + fmtDate(c.gate[g].at) : ""}</span>`
        : `<button class="btn" ${rel.ok ? "" : "disabled"} data-rel="${g}">${t("release")}</button>
           <span class="note">${open ? `<b>${open}</b> ${open === 1 ? t("need1") : t("need")}` : t("allDone")}${
             rel.ok ? "" : rel.why ? ` · ${esc(rel.why)}` : ""}</span>`}
    </div></div>`;
}
function chatHTML(c) {
  const scopes = [["case", c.id, t("ctx_case")],
                  ["trainee", c.traineeId, t("ctx_trainee") + ": " + trName(c)],
                  ["company", c.companyId, t("ctx_company") + ": " + coName(c)]];
  const cur = scopes.find(s => s[0] === chatScope) || scopes[0];
  const list = thread(cur[0], cur[1]);
  markRead(cur[0], cur[1]);
  const av = { sales:"s", training_admin:"t", ato:"a" };
  const openCps = caseCat(c).filter(x => !cpDone(c, x));
  return `<div class="notice">${t("keep")}</div>
  <div class="ctx">${scopes.map(([sc, id, lb]) => {
    const u = unread(sc, id);
    return `<button data-sc="${sc}" class="${chatScope === sc ? "on" : ""}">${esc(lb)}${
      u ? `<span class="b">${u}</span>` : ""}</button>`; }).join("")}</div>
  ${cur[0] !== "case" ? `<div class="notice">${t("scope_" + cur[0])}</div>` : ""}
  ${list.length ? list.map(m => {
    const u = user(m.uid), x = m.ref ? cat(m.ref) : null;
    const src = m.caseId && m.caseId !== c.id ? findCase(m.caseId) : null;
    return `<div class="msg">
      <div class="av ${av[u.dept] || "d"}">${initials(u.name)}</div>
      <div style="flex:1;min-width:0">
        <div class="row"><span class="who">${esc(u.name)}</span><span class="dept">${DEPTS[u.dept]}</span>
          <span class="tm">${esc(m.when)}${m.edited ? ` · <span class="edited">${t("edited")}</span>` : ""}</span></div>
        <div class="body">${m.txt}</div>
        ${x ? `<span class="ref">↳ ${t("refTo")} ${esc(x[L])}</span>` : ""}
        ${src ? `<div class="case">${t("fromCase")} ${src.no} · ${esc(trName(src))}</div>` : ""}
        ${m.uid === me ? `<div><button class="edit" data-editmsg="${cur[0]}|${cur[1]}|${m.id}">${t("edit")}</button></div>` : ""}
      </div></div>`; }).join("")
    : `<div class="empty" style="padding:26px 0"><b>${t("empty_t")}</b></div>`}
  <div class="composer">
    <textarea id="cmsg" placeholder="${t("ph")}"></textarea>
    <footer>
      <select id="cref"><option value="">${t("noRef")}</option>${
        openCps.map(x => `<option value="${x.id}">${t("refTo")} ${esc(x[L])}</option>`).join("")}</select>
      <button class="send" id="csend">${t("send")}</button>
    </footer>
  </div>`;
}
const logHTML = c => `<div class="log">${c.log.map(e => `<div class="e">
  <span class="t">${esc(e.when)}</span>
  <span><b>${e.who === "system" ? "System" : esc(user(e.who).name)}</b> — ${esc(e.txt)}
    ${e.reason ? `<span class="rsn">„${esc(e.reason)}"</span>` : ""}</span></div>`).join("")}</div>`;

function renderDrawer() {
  const d = document.getElementById("drawer");
  if (!drawerCase) {
    d.classList.remove("on"); d.setAttribute("aria-hidden","true");
    document.getElementById("scrim").classList.remove("on"); return;
  }
  const c = drawerCase;
  const ow = Object.entries(c.owner).map(([k,v]) =>
    v ? `${DEPTS[k]}: ${esc(user(v).name)}` : `${DEPTS[k]}: <span class="pill p-pool">${t("unassigned")}</span>`).join(" · ");
  const g3warn = c.course_end && daysTo(c.course_end) < 0 && !c.gate[3].released && openMandatory(c,3).length;
  const nUnread = unread("case", c.id) + unread("trainee", c.traineeId) + unread("company", c.companyId);

  d.innerHTML = `
    <div class="dhd">
      <div>
        <h2>${esc(trName(c))}</h2>
        <div class="meta"><span class="num">${c.no}</span><span class="type">${c.type}</span>
          <span>${esc(coName(c))}</span><span>${esc(courseLabel(c))}</span><span>${fmtStart(c)}</span>${stateChip(caseState(c))}</div>
        <div class="meta">${ow}</div>
        <div class="meta">
          <button class="notecount" data-notes="trainee|${c.traineeId}">${t("notes_tr")} (${noteCount("trainee", c.traineeId)})</button>
          <button class="notecount" data-notes="company|${c.companyId}">${t("notes_co")} (${noteCount("company", c.companyId)})</button>
        </div>
      </div>
      <span class="hdacts" style="margin-left:auto">
        <button class="btn-ghost" id="dedit">${t("edit")}</button>
        <button class="btn-ghost" data-exp="pdf|case">${t("exp_record")}</button>
        <button class="x" id="dx" aria-label="${t("cancel")}">×</button>
      </span>
    </div>
    <div class="tabs">
      <button data-tab="gates" class="${dtab === "gates" ? "on" : ""}">${t("tab_gates")}</button>
      <button data-tab="chat" class="${dtab === "chat" ? "on" : ""}">${t("tab_chat")}${nUnread ? ` (${nUnread})` : ""}</button>
      <button data-tab="log" class="${dtab === "log" ? "on" : ""}">${t("tab_log")}</button>
    </div>
    <div class="dbody">${
      dtab === "gates"
        ? (inMyPool(c) ? `<div class="notice"><b>${t("unassigned")}.</b> ${
            L === "de" ? "Übernehmen Sie den Vorgang, um Prüfpunkte zu bearbeiten." : "Take the case to work on its checkpoints."
            } <button class="lnk" id="dtake">${t("take")}</button></div>` : "")
          + (g3warn ? `<div class="notice warn"><b>${t("k_g3")}:</b> ${t("notice_g3")}</div>` : "")
          + `<div class="hdacts" style="margin-bottom:12px">${expBtns("checkpoints")}</div>`
          + [1,2,3].map(g => gateHTML(c, g)).join("")
        : dtab === "chat" ? chatHTML(c)
        : `<div class="hdacts" style="margin-bottom:12px">${expBtns("audit")}</div>` + logHTML(c)}</div>`;
  d.classList.add("on"); d.setAttribute("aria-hidden","false");
  document.getElementById("scrim").classList.add("on");
  wireDrawer();
}

/* ---------- Wiring ---------- */
function wireMain() {
  const q = id => document.getElementById(id);
  if (q("newCase")) q("newCase").onclick = dialogNewCase;
  if (q("newCo")) q("newCo").onclick = dialogNewCompany;
  if (q("newTr")) q("newTr").onclick = () => dialogNewTrainee();
  document.querySelectorAll("[data-at]").forEach(b => b.onclick = () => { adminTab = b.dataset.at; renderMain(); });
  if (q("cpNew")) q("cpNew").onclick = () => dialogCheckpoint(null);
  if (q("usrNew")) q("usrNew").onclick = () => dialogUser(null);
  document.querySelectorAll("[data-cpedit]").forEach(b => b.onclick = () => dialogCheckpoint(cat(b.dataset.cpedit)));
  document.querySelectorAll("[data-cpdup]").forEach(b => b.onclick = () => dialogCheckpoint(cat(b.dataset.cpdup), true));
  document.querySelectorAll("[data-up]").forEach(b => b.onclick = () => moveCp(cat(b.dataset.up), -1));
  document.querySelectorAll("[data-down]").forEach(b => b.onclick = () => moveCp(cat(b.dataset.down), 1));
  document.querySelectorAll("[data-cptoggle]").forEach(b => b.onclick = () => {
    const x = cat(b.dataset.cptoggle); x.active = !x.active;
    toast(x.active ? t("t_cpact") : t("t_cpdeact")); render();
  });
  document.querySelectorAll("[data-cpdel]").forEach(b => b.onclick = () => {
    const x = cat(b.dataset.cpdel);
    if (cpUsed(x)) return toast(t("cp_inuse"), true);
    CAT.forEach(y => { if (y.dep === x.id) y.dep = null; });
    CAT.splice(CAT.indexOf(x), 1);
    toast(t("t_cpdel")); render();
  });
  document.querySelectorAll("[data-usredit]").forEach(b => b.onclick = () => dialogUser(user(b.dataset.usredit)));
  document.querySelectorAll("[data-usrmail]").forEach(b => b.onclick = () => {
    const x = user(b.dataset.usrmail); x.invited = true;
    toast(t("t_invite", { m:x.email })); render();
  });
  document.querySelectorAll("[data-usrtoggle]").forEach(b => b.onclick = () => {
    const x = user(b.dataset.usrtoggle);
    if (x.id === me && x.active !== false) return toast(t("t_noself"), true);
    x.active = x.active === false;
    toast(x.active ? t("t_cpact") : t("t_cpdeact")); render();
  });
  const setNum = (id, k, min) => { const el = q(id); if (!el) return;
    el.onchange = () => { SETTINGS[k] = Math.max(min, parseInt(el.value, 10) || min); toast(t("t_set")); render(); }; };
  setNum("sPool", "poolStale", 1);
  setNum("sL2", "level2Days", 1);
  if (q("sRem")) q("sRem").onchange = e => {
    SETTINGS.reminderDays = e.target.value.split(",").map(x => parseInt(x, 10)).filter(x => x > 0);
    toast(t("t_set")); render();
  };
  [["fnDT","director_training"],["fnHOT","head_of_training"],["fnSL","sales_lead"]].forEach(([id, k]) => {
    if (q(id)) q(id).onchange = e => { SETTINGS.fn[k] = e.target.value || null; toast(t("t_set")); render(); };
  });
  if (q("ctAdd")) q("ctAdd").onclick = () => {
    const v = (q("ctNew").value || "").trim();
    if (v.length < 2) return toast(t("e_name"), true);
    if (COURSE_TYPES.some(x => x.toLowerCase() === v.toLowerCase())) return toast(t("e_ctdup"), true);
    COURSE_TYPES.push(v); toast(t("t_ctnew")); render();
  };
  document.querySelectorAll("[data-ctdel]").forEach(b => b.onclick = () => {
    const i = COURSE_TYPES.indexOf(b.dataset.ctdel);
    if (i > -1) COURSE_TYPES.splice(i, 1);
    toast(t("t_ctdel")); render();
  });
  document.querySelectorAll("[data-esc]").forEach(el => el.onchange = () => {
    SETTINGS.escalation[el.dataset.esc] = el.value || null; toast(t("t_set")); render();
  });
  if (q("fq")) {
    q("fq").oninput = e => { F.q = e.target.value; renderMain();
      const el = q("fq"); el.focus(); el.setSelectionRange(F.q.length, F.q.length); };
    q("ftoggle").onclick = () => { filtersOpen = !filtersOpen; renderMain(); };
    q("ftype").onchange   = e => { F.type = e.target.value; renderMain(); };
    q("fstatus").onchange = e => { F.status = e.target.value; renderMain(); };
    q("fdept").onchange   = e => { F.dept = e.target.value; renderMain(); };
    q("fowner").onchange  = e => { F.owner = e.target.value; renderMain(); };
    q("flate").onchange   = e => { F.late = e.target.checked; renderMain(); };
    q("fpool").onchange   = e => { F.pool = e.target.checked; renderMain(); };
    q("fclear").onclick   = () => { F = { q:"", type:"", status:"", dept:"", owner:"", late:false, pool:false }; renderMain(); };
  }
  document.querySelectorAll("[data-stage]").forEach(b => b.onclick = () => {
    F.status = F.status === b.dataset.stage ? "" : b.dataset.stage; renderMain();
  });
  document.querySelectorAll("[data-take]").forEach(b => b.onclick = e => {
    e.stopPropagation(); doTake(findCase(b.dataset.take));
  });
  document.querySelectorAll("[data-exok]").forEach(b => b.onclick = () => {
    const [cid, eid] = b.dataset.exok.split("|"); const c = findCase(cid);
    doDecideException(c, c.exc.find(e => e.id === eid), true);
  });
  document.querySelectorAll("[data-exno]").forEach(b => b.onclick = () => {
    const [cid, eid] = b.dataset.exno.split("|"); const c = findCase(cid);
    doDecideException(c, c.exc.find(e => e.id === eid), false);
  });
  wireExports();
  document.querySelectorAll("[data-notes]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const [sc, id] = b.dataset.notes.split("|"); openNotes(sc, id);
  });
  document.querySelectorAll("[data-id]").forEach(el => el.onclick = () => {
    drawerCase = findCase(el.dataset.id); dtab = "gates"; chatScope = "case"; renderDrawer();
  });
}
function wireDrawer() {
  const c = drawerCase;
  wireExports();
  document.querySelectorAll("[data-notes]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const [sc, id] = b.dataset.notes.split("|"); openNotes(sc, id);
  });
  document.getElementById("dx").onclick = closeDrawer;
  document.getElementById("dedit").onclick = () => dialogEditCase(c);
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { dtab = b.dataset.tab; renderDrawer(); });
  document.querySelectorAll("[data-complete]").forEach(b => b.onclick = () => {
    const x = cat(b.dataset.complete);
    if (x.evReq) askText({ title:t("m_ev_t"), text:t("m_ev_p") + (x.ev ? " — " + x.ev : ""),
      label:t("m_ev_l"), min:2, err:t("m_ev_e"), okLabel:t("ok") }, v => doComplete(c, x, v));
    else doComplete(c, x);
  });
  document.querySelectorAll("[data-verify]").forEach(b => b.onclick = () => doVerify(c, cat(b.dataset.verify)));
  document.querySelectorAll("[data-rel]").forEach(b => b.onclick = () => doRelease(c, +b.dataset.rel));
  document.querySelectorAll("[data-fold]").forEach(b => b.onclick = () => {
    const k = c.id + ":" + b.dataset.fold;
    expanded.has(k) ? expanded.delete(k) : expanded.add(k);
    renderDrawer();
  });
  document.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => {
    const x = cat(b.dataset.reset);
    askText({ title:t("m_res_t"), text:t("m_res_p") + " — " + x[L], label:t("m_reason"),
      min:5, err:t("m_res_e"), okLabel:t("ok") }, r => doReset(c, x, r));
  });
  document.querySelectorAll("[data-exc]").forEach(b => b.onclick = () => {
    const x = cat(b.dataset.exc);
    askText({ title:t("m_exc_t"), text:t("m_exc_p") + " — " + x[L], label:t("m_reason"),
      min:10, err:t("m_exc_e"), okLabel:t("request") }, r => doRequestException(c, x, r));
  });
  const tk = document.getElementById("dtake");
  if (tk) tk.onclick = () => doTake(c);
  document.querySelectorAll("[data-sc]").forEach(b => b.onclick = () => { chatScope = b.dataset.sc; renderDrawer(); });
  document.querySelectorAll("[data-editmsg]").forEach(b => b.onclick = () => {
    const [sc, id, mid] = b.dataset.editmsg.split("|");
    const m = thread(sc, id).find(x => x.id === mid);
    askText({ title:t("m_edit_t"), text:t("m_edit_p"), label:t("m_msg"),
      value:m.txt.replace(/<[^>]+>/g, ""), min:1, err:t("m_edit_e"), okLabel:t("save") }, v => {
        m.history.push({ body:m.txt, by:me, at:now() });
        m.txt = esc(v); m.edited = true;
        lg(c, me, L === "de" ? "Nachricht bearbeitet" : "Message edited", null, now());
        toast(t("t_edited")); render();
      });
  });
  const sd = document.getElementById("csend");
  if (sd) sd.onclick = () => {
    const ta = document.getElementById("cmsg");
    if (!ta.value.trim()) return;
    const id = chatScope === "case" ? c.id : chatScope === "trainee" ? c.traineeId : c.companyId;
    msg(chatScope, id, me, esc(ta.value.trim()), now(), document.getElementById("cref").value || null, c.id);
    lg(c, me, (L === "de" ? "Nachricht hinzugefügt — " : "Message added — ") + t("ctx_" + chatScope), null, now());
    toast(t("t_msg")); render();
  };
}
function closeDrawer() { drawerCase = null; renderDrawer(); }
document.getElementById("scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.getElementById("modal").classList.contains("on")) closeDialog();
  else if (document.getElementById("print").classList.contains("on")) document.getElementById("print").classList.remove("on");
  else if (notesCtx) closeNotes();
  else closeDrawer();
});
function setLang(l) {
  L = l; document.documentElement.lang = L;
  document.querySelectorAll(".topbar .lang button").forEach(x => x.classList.toggle("on", x.dataset.l === L));
  render();
}
document.querySelectorAll(".topbar .lang button").forEach(b => b.onclick = () => setLang(b.dataset.l));
["side","mobnav"].forEach(id => document.getElementById(id).addEventListener("click", e => {
  const b = e.target.closest("[data-v]"); if (!b) return;
  view = b.dataset.v; renderMain(); renderNav();
}));

function render() {
  const inApp = !!me;
  document.getElementById("login").classList.toggle("on", !inApp);
  document.getElementById("app").style.display = inApp ? "" : "none";
  renderSandbar();
  if (!inApp) { drawerCase = null; notesCtx = null; renderNotes(); renderDrawer(); renderLogin(); return; }
  renderTop(); renderNav(); renderMain(); renderDrawer(); renderNotes();
}
render();
</script>
