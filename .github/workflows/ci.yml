name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    name: Typecheck und Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  sandbox:
    name: Prototyp im Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Rechenregeln, Wortschatz und Versionsstand — schnell und ohne Klicken.
      - run: npm run check:logic
      - run: npm run check:sandbox
      # Der Funktionsdurchlauf: jeder Knopf, jeder Dialog, jede Ausgabe, beide
      # Zugänge, Speicherung und Rechte. Läuft vor jeder Weitergabe ans Team.
      - run: npm run check:app

  database:
    name: Migrationen, Seed und SQL-Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: ./scripts/db-check.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
