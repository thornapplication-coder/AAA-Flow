# Supabase CLI-Konfiguration für das Project Control Center.
# Lokaler Start: `supabase start` (benötigt Docker), Migrationen: `supabase db reset`.
project_id = "project-control-center"

[api]
enabled = true
port = 54321
schemas = ["public", "pcc"]
extra_search_path = ["public", "pcc"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Keine Selbstregistrierung: es gibt genau zwei Zugänge, und die legt der
# Betreiber an (Architektur, Abschnitt 4). Eine offene Anmeldung erzeugte nur
# Konten ohne Rolle, die nichts sehen — und eine Liste, die niemand pflegt.
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[studio]
enabled = true
port = 54323
