# Supabase CLI-Konfiguration für AAA Flow.
# Lokaler Start: `supabase start` (benötigt Docker), Migrationen: `supabase db reset`.
project_id = "aaa-flow"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Keine Selbstregistrierung: Nutzer werden ausschließlich durch Admins angelegt (Spec Abschnitt 3).
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[studio]
enabled = true
port = 54323
